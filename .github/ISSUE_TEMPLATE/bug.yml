name: Bug report
description: Something did nothing, crashed, or looked wrong. Include copied logs.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer **Settings → About → Report a Bug on GitHub**. That opens this
        form with platform, install channel, version, host OS, and recent logs
        already filled, and copies the full diagnostics to the clipboard.

        Or use **Copy Recent Logs** / **Copy Active Machine Logs** and paste
        below. The report includes Wawona version, host OS, install channel
        (TestFlight vs sideload IPA vs App Store), the active machine (no
        passwords), and recent in-app logs.

        Sideloaded iOS IPAs do not go through TestFlight crash reports. Copied
        logs are how we see Start/Focus doing nothing.

        TestFlight testers: also send **Beta Feedback** from the TestFlight app
        (crashes already go to App Store Connect). A GitHub issue is opened from
        that feedback automatically (identity stripped). Still paste Copy Recent
        Logs here when you can. Set install channel to TestFlight (Beta).

  - type: input
    id: platform
    attributes:
      label: Platform
      description: Wawona fills this from the app. Use iOS, iPadOS, macOS, tvOS, watchOS, visionOS, Android, Linux, or Unsure.
      placeholder: "iOS"
    validations:
      required: true

  - type: input
    id: install_channel
    attributes:
      label: How you installed Wawona
      description: Wawona fills this from the app. Use TestFlight (Beta), Play Store (Beta), App Store (Release), Play Store (Release), Sideload IPA (Xcode, AltStore, TrollStore, Sileo or similar), Sideload APK, Simulator, nix / local build (not a prebuilt installation), or Other.
      placeholder: "TestFlight (Beta)"
    validations:
      required: true

  - type: input
    id: wawona_version
    attributes:
      label: Wawona version
      description: From Settings → About → Version, or the copied diagnostics header.
      placeholder: "26.8.23"
    validations:
      required: true

  - type: input
    id: host_os
    attributes:
      label: Host OS and version
      description: Example. iOS 26.5 (iPhone17,1). Copied diagnostics include this.
      placeholder: "iOS 26.5 (iPhone17,1)"
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: What you tapped (Start Weston, Focus, …) and what you saw. "Nothing happened" is a valid report.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: Nested Weston desktop appeared on the host surface.

  - type: textarea
    id: logs
    attributes:
      label: Copied diagnostics
      description: Paste the full text from Copy Recent Logs or Copy Active Machine Logs.
      render: shell
    validations:
      required: true
