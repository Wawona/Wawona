name: "Build: Apple family sims"

# Thin product producer (one platform slice). Called by Gate: products / Ship.
# No `only` filter: every job here always runs. Keeps Actions UI free of skip spam.

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = this SHA)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = caller sha)"
        type: string
        required: false
        default: ""
      tip_key:
        description: "Unused; kept for caller compatibility"
        type: string
        required: false
        default: ""

concurrency:
  group: product-apple-family-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  NIXPKGS_ALLOW_UNFREE: "1"

jobs:
  ipados:
    name: "iPadOS sim .app"
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Ensure Apple simulator SDK (skip platform download when present)
        run: ./.github/scripts/warm-ios-simulator-sdk.sh ipados

      - uses: ./.github/actions/setup-nix-flakehub

      - name: Build iPadOS simulator app
        run: >-
          ./.github/scripts/nix-retry.sh nix build
          ".#wawona-ipados" --print-build-logs
          --out-link "result-ipados"

      - name: Stage and audit iPadOS
        run: |
          OUT_DIR="dist/ipados-sim"
          mkdir -p "$OUT_DIR"
          APP="$(find -L "result-ipados" -type d -name '*.app' -print -quit)"
          test -n "$APP"
          ditto "$APP" "$OUT_DIR/Wawona.app"
          true
          ./.github/scripts/verify-iland-graphics-bundle.sh \
            --platform "ipados" "$OUT_DIR/Wawona.app"
          bash ./.github/scripts/verify-ios-modeb-artifacts.sh --mode-a "$OUT_DIR/Wawona.app"
          if [ -x "$OUT_DIR/Wawona.app/Wawona" ]; then
            if /usr/bin/strings "$OUT_DIR/Wawona.app/Wawona" | /usr/bin/grep -E 'IOMobileFramebuffer|WWN_MODE_B'; then
              echo "Mode B private strings leaked into iPadOS store-shaped app" >&2
              exit 1
            fi
          fi
          printf '{"attr":"%s","sha":"%s","artifact":"product-%s-sim"}\n' \
            "wawona-ipados" "${{ github.sha }}" "ipados" \
            > "$OUT_DIR/product-manifest.json"
          {
            echo "# Build: iPadOS"
            echo ""
            echo "**PASS:** iPadOS simulator app built and audited."
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: product-ipados-sim
          path: dist/ipados-sim/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
  visionos:
    name: "visionOS sim .app"
    runs-on: macos-26
    timeout-minutes: 180
