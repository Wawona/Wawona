name: "Build: Apple family sims"

# Thin product producer (one platform slice). Called by Gate: products / Ship.
# No `only` filter: every job here always runs. Keeps Actions UI free of skip spam.

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = this SHA)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = caller sha)"
        type: string
        required: false
        default: ""
      tip_key:
        description: "Unused; kept for caller compatibility"
        type: string
        required: false
        default: ""

concurrency:
  group: product-apple-family-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sim:
    name: "${{ matrix.target }} sim .app"
    runs-on: macos-27
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: ipados, sdk: iphonesimulator }
          - { target: visionos, sdk: xrsimulator }
          - { target: tvos, sdk: appletvsimulator }
          - { target: watchos, sdk: watchsimulator }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: ./.github/actions/setup-xtask
        with:
          key: ${{ matrix.target }}

      - name: Ensure Apple simulator SDK (skip platform download when present)
        run: ./.github/scripts/warm-ios-simulator-sdk.sh all

      # The simulator product omits the device watch slice. Building the
      # device app here exercises the backend an iOS archive links before
      # release-beta.yml can upload to App Store Connect.
      - name: Build the watchOS device app
        if: matrix.target == 'watchos'
        run: cargo xtask build watchos --device --release

      - name: Build the simulator app
        run: cargo xtask build ${{ matrix.target }} --release

      - name: Stage and audit
        env:
          TARGET: ${{ matrix.target }}
          SDK: ${{ matrix.sdk }}
        run: |
          OUT_DIR="dist/$TARGET-sim"
          mkdir -p "$OUT_DIR"
          ditto ".build/xcode/$TARGET/Build/Products/Release-$SDK/Wawona.app" "$OUT_DIR/Wawona.app"
          ./.github/scripts/verify-iland-graphics-bundle.sh --platform "$TARGET" "$OUT_DIR/Wawona.app"
          case "$TARGET" in
            ipados) bash ./.github/scripts/verify-ios-modeb-artifacts.sh --mode-a-simulator "$OUT_DIR/Wawona.app" ;;
            watchos) ./.github/scripts/verify-watchos-app-size.sh "$OUT_DIR/Wawona.app" ;;
          esac
          if /usr/bin/strings "$OUT_DIR/Wawona.app/Wawona" | /usr/bin/grep -E 'IOMobileFramebuffer|WWN_MODE_B'; then
            echo "Mode B private strings leaked into the $TARGET store-shaped app" >&2
            exit 1
          fi
          printf '{"target":"%s","sha":"%s","artifact":"product-%s-sim"}\n' \
            "$TARGET" "${{ github.sha }}" "$TARGET" > "$OUT_DIR/product-manifest.json"
          echo "**PASS:** $TARGET simulator app built and audited." >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: product-${{ matrix.target }}-sim
          path: dist/${{ matrix.target }}-sim/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
