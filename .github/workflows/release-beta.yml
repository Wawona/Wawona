name: Release Beta

# Every push to master → TestFlight (Apple), Play internal (Android), and Linux
# AppImage prebuilts (workflow artifacts, not GitHub Releases).
# Manual dispatch can target ios beta, android beta, or both (lane: beta).
# Tag push v0.2.* also triggers Apple TestFlight (legacy); prefer master for betas.

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Fastlane lane (beta, ios beta, android beta)"
        required: false
        default: ios beta
  push:
    branches:
      - master
    tags:
      - "v*"

concurrency:
  group: release-beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  actions: read

env:
  NIXPKGS_ALLOW_UNFREE: "1"

jobs:
  apple-beta:
    name: "TestFlight (Apple platforms)"
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       !contains(github.event.inputs.lane, 'android'))
    runs-on: macos-26
    environment: release-beta
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "WAWONA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Select Active Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            allow-import-from-derivation = true
            trusted-users = runner root
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Run Fastlane iOS beta
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_URL: https://github.com/aspauldingcode/apple-signing.git
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          WAWONA_BUILD_NUMBER: ${{ github.run_number }}
          CI: "true"
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        working-directory: .
        run: |
          LANE="${{ github.event.inputs.lane || 'ios beta' }}"
          nix develop .#release --command bash -c "fastlane $LANE"

  android-beta:
    name: "Play internal track (Android)"
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.lane == 'beta' ||
        contains(github.event.inputs.lane, 'android')))
    runs-on: ubuntu-latest
    environment: release-beta
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "WAWONA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "${AGENT_TOOLSDIRECTORY:-}" || true
          df -h

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            build-dir = /nix/build
            sandbox = relaxed
            allow-import-from-derivation = true
            trusted-users = runner root
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Prepare Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wawona-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/wawona-upload.jks" >> "$GITHUB_ENV"

      - name: Run Fastlane Android beta
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          CI: "true"
        working-directory: .
        run: |
          LANE="${{ github.event.inputs.lane || 'android beta' }}"
          nix develop .#release --command bash -lc "fastlane $LANE"

  linux-beta:
    name: "Linux AppImage beta (${{ matrix.system }})"
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve AppImage from product-build (same SHA)
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x ./.github/scripts/resolve-product-artifacts.sh
          mkdir -p dist
          if ./.github/scripts/resolve-product-artifacts.sh \
               "$GITHUB_SHA" "product-appimage-${{ matrix.system }}" dist 7200; then
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          else
            echo "resolved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reclaim disk space
        if: steps.resolve.outputs.resolved != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          docker image prune -af || true

      - name: Install Nix
        if: steps.resolve.outputs.resolved != 'true'
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            build-dir = /nix/build
            sandbox = relaxed
            allow-import-from-derivation = true
            trusted-users = runner root
      - uses: DeterminateSystems/flakehub-cache-action@v3
        if: steps.resolve.outputs.resolved != 'true'

      - name: Build AppImage (fallback)
        if: steps.resolve.outputs.resolved != 'true'
        run: |
          ./.github/scripts/nix-retry.sh \
            nix build ".#packages.${{ matrix.system }}.wawona-appimage" --print-build-logs
          ./.github/scripts/appimage-smoke.sh result "${{ matrix.system }}"

      - name: Upload beta AppImage (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: wawona-beta-appimage-${{ matrix.system }}
          path: dist/*.AppImage
          retention-days: 30
          if-no-files-found: error