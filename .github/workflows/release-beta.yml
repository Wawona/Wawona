name: "Ship: beta (stores)"

# TestFlight (Apple), Play internal (Android) only after a green master
# Gate: products (full product matrix). Same pattern as Ship: beta AppImages.
# Manual dispatch remains for operators (force tip). Docs: docs/ci.md.

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Fastlane lane (beta, ios beta, android beta, ios debug_export)"
        required: false
        default: ios beta
      debug_scheme:
        description: "WAWONA_DEBUG_SCHEME for lane=ios debug_export (e.g. Wawona-iOS, Wawona-tvOS, Wawona-visionOS)"
        required: false
        default: ""
  workflow_run:
    workflows: ["Gate: products"]
    types: [completed]

concurrency:
  group: release-beta-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  actions: read

env:
  NIXPKGS_ALLOW_UNFREE: "1"

jobs:
  gate-ok:
    name: "Check: products already green?"
    if: >-
      github.event_name == 'workflow_dispatch'
      || (
        github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'master'
        && github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - id: meta
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "sha=${{ github.sha }}" >>"$GITHUB_OUTPUT"
            note="Manual ship. Operator chose this commit."
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >>"$GITHUB_OUTPUT"
            note="Gate: products was green on master. Safe to upload to stores."
          fi
          {
            echo "# Ship to stores?"
            echo ""
            echo "**YES.** ${note}"
            echo ""
            echo "- Commit: \`${{ github.event.workflow_run.head_sha || github.sha }}\`"
          } >>"$GITHUB_STEP_SUMMARY"

  apple-beta:
    name: "TestFlight (Apple platforms)"
    needs: gate-ok
    if: >-
      always()
      && needs.gate-ok.result == 'success'
      && (
        github.event_name == 'workflow_run'
        || (github.event_name == 'workflow_dispatch' && !contains(github.event.inputs.lane, 'android'))
      )
    runs-on: macos-26
    environment: release-beta
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate-ok.outputs.sha }}

      - name: Resolve release version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "WAWONA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Select Active Xcode
        run: ./.github/scripts/select-xcode.sh

      - uses: ./.github/actions/setup-nix-flakehub
        with:
          extra-conf: |
            allow-import-from-derivation = true
            trusted-users = runner root
            max-jobs = auto
            cores = 0

      - name: Run Fastlane iOS beta
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_URL: https://github.com/aspauldingcode/apple-signing.git
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          WAWONA_BUILD_NUMBER: ${{ github.run_number }}
          WAWONA_DEBUG_SCHEME: ${{ github.event.inputs.debug_scheme }}
          SECRETSPEC_PROFILE: ci-apple
          SECRETSPEC_PROVIDER: env
          CI: "true"
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        working-directory: .
        run: |
          LANE="${{ github.event.inputs.lane || 'ios beta' }}"
          nix develop .#release --command bash -c \
            './scripts/release-env.sh fastlane '"$LANE"

      - name: Upload debug_export ipa artifact
        if: contains(github.event.inputs.lane, 'debug_export')
        uses: actions/upload-artifact@v7
        with:
          name: wawona-debug-export-ipa-${{ github.event.inputs.debug_scheme }}
          path: dist/*.ipa
          retention-days: 5
          if-no-files-found: error

  android-beta:
    name: "Play internal track (Android)"
    needs: gate-ok
    if: >-
      always()
      && needs.gate-ok.result == 'success'
      && (
        github.event_name == 'workflow_run'
        || (github.event_name == 'workflow_dispatch'
            && (github.event.inputs.lane == 'beta'
                || contains(github.event.inputs.lane, 'android')))
      )
    runs-on: macos-26
    environment: release-beta
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate-ok.outputs.sha }}

      - name: Resolve release version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "WAWONA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - uses: ./.github/actions/setup-nix-flakehub
        with:
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
            trusted-users = runner root
            max-jobs = auto
            cores = 0

      - name: Prepare Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wawona-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/wawona-upload.jks" >> "$GITHUB_ENV"

      - name: Run Fastlane Android beta
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          WAWONA_BUILD_NUMBER: ${{ github.run_number }}
          SECRETSPEC_PROFILE: ci-android
          SECRETSPEC_PROVIDER: env
          CI: "true"
        working-directory: .
        run: |
          LANE="${{ github.event.inputs.lane || 'android beta' }}"
          nix develop .#release --command bash -lc \
            './scripts/release-env.sh fastlane '"$LANE"

  # Beta Linux AppImages: Ship: beta AppImages (workflow_run on Gate: products).
