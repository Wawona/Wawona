name: Release Beta

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Fastlane lane (beta, ios beta, android beta)"
        required: false
        default: ios beta
  push:
    branches:
      - master
    tags:
      - "v0.2.*"

permissions:
  contents: read

env:
  NIXPKGS_ALLOW_UNFREE: "1"

jobs:
  apple-beta:
    name: "TestFlight (Apple platforms)"
    if: github.event_name != 'workflow_dispatch' || !contains(github.event.inputs.lane, 'android')
    runs-on: macos-26
    environment: release-beta
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "WAWONA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Select Active Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found on this runner"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            allow-import-from-derivation = true
            trusted-users = runner root

      - name: Run Fastlane iOS beta
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          WAWONA_BUILD_NUMBER: ${{ github.run_number }}
          CI: "true"
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        working-directory: .
        run: |
          LANE="${{ github.event.inputs.lane || 'ios beta' }}"
          nix develop .#release --command bash -lc "fastlane $LANE"

  android-beta:
    name: "Play internal track (Android)"
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.lane == 'beta' || contains(github.event.inputs.lane, 'android'))
    runs-on: ubuntu-latest
    environment: release-beta
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "WAWONA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "${AGENT_TOOLSDIRECTORY:-}" || true
          df -h

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            build-dir = /nix/build
            sandbox = relaxed
            allow-import-from-derivation = true
            trusted-users = runner root

      - name: Prepare Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wawona-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/wawona-upload.jks" >> "$GITHUB_ENV"

      - name: Run Fastlane Android beta
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          CI: "true"
        working-directory: .
        run: |
          LANE="${{ github.event.inputs.lane || 'android beta' }}"
          nix develop .#release --command bash -lc "fastlane $LANE"
