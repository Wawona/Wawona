name: "Ship: beta (stores)"

# Every push to master → TestFlight (Apple), Play internal (Android), and Linux
# AppImage prebuilts (workflow artifacts, not GitHub Releases).
# Manual dispatch can target ios beta, android beta, or both (lane: beta).
# Tag push v* also triggers Apple TestFlight (legacy); prefer master for betas.

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Fastlane lane (beta, ios beta, android beta, ios debug_export)"
        required: false
        default: ios beta
      debug_scheme:
        description: "WAWONA_DEBUG_SCHEME for lane=ios debug_export (e.g. Wawona-iOS, Wawona-tvOS, Wawona-visionOS)"
        required: false
        default: ""
  push:
    branches:
      - master
    tags:
      - "v*"

concurrency:
  group: release-beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  actions: read

env:
  NIXPKGS_ALLOW_UNFREE: "1"

jobs:
  apple-beta:
    name: "TestFlight (Apple platforms)"
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       !contains(github.event.inputs.lane, 'android'))
    runs-on: macos-26
    environment: release-beta
    # Safety net: a codesign keychain-ACL hang (missing setup_ci. See #138)
    # burned 2h+ of runner time silently before this existed. A healthy run
    # is ~15-25 min; 90 covers cold Nix/Rust cross-compiles with headroom.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "WAWONA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Select Active Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            allow-import-from-derivation = true
            trusted-users = runner root
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Run Fastlane iOS beta
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_URL: https://github.com/aspauldingcode/apple-signing.git
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          WAWONA_BUILD_NUMBER: ${{ github.run_number }}
          WAWONA_DEBUG_SCHEME: ${{ github.event.inputs.debug_scheme }}
          SECRETSPEC_PROFILE: ci-apple
          SECRETSPEC_PROVIDER: env
          CI: "true"
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        working-directory: .
        run: |
          LANE="${{ github.event.inputs.lane || 'ios beta' }}"
          nix develop .#release --command bash -c \
            './scripts/release-env.sh fastlane '"$LANE"

      - name: Upload debug_export ipa artifact
        if: contains(github.event.inputs.lane, 'debug_export')
        uses: actions/upload-artifact@v7
        with:
          name: wawona-debug-export-ipa-${{ github.event.inputs.debug_scheme }}
          path: dist/*.ipa
          retention-days: 5
          if-no-files-found: error

  android-beta:
    name: "Play internal track (Android)"
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.lane == 'beta' ||
        contains(github.event.inputs.lane, 'android')))
    # macOS (not ubuntu): Android cross deps (e.g. zsh-android) fail configure on
    # ubuntu ("C compiler cannot create executables"). Runner OS version is
    # irrelevant (Nix supplies NDK); aligned to macos-26 with product-build.
    runs-on: macos-26
    environment: release-beta
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "WAWONA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
            trusted-users = runner root
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Prepare Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wawona-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/wawona-upload.jks" >> "$GITHUB_ENV"

      - name: Run Fastlane Android beta
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          WAWONA_BUILD_NUMBER: ${{ github.run_number }}
          SECRETSPEC_PROFILE: ci-android
          SECRETSPEC_PROVIDER: env
          CI: "true"
        working-directory: .
        run: |
          LANE="${{ github.event.inputs.lane || 'android beta' }}"
          nix develop .#release --command bash -lc \
            './scripts/release-env.sh fastlane '"$LANE"

  # Beta Linux AppImages moved to the "Ship: beta AppImages" workflow
  # (.github/workflows/ship-beta-appimage.yml), which consumes Gate: products'
  # same-SHA product-appimage-* via workflow_run instead of rebuilding them here.
  # This eliminated the master-push double AppImage build (Gate: products +
  # Ship: beta). Do not reintroduce a product-build appimage call in this file.
