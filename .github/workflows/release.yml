name: "Ship: GitHub assets"

# Tag push (v*) → GitHub Release with macOS DMG, Android APK, iOS IPA, and Linux
# AppImages. Pure products: macos / android / appimage only (no apple-family -
# watchOS sim is not a Release asset and has flaked on -downloadPlatform iOS).
# IPA is impure Fastlane match+gym (same signing path as Ship: beta).
# Re-registered 2026-07-16 after Actions run-history purge left this workflow deleted.

on:
  push:
    tags:
      - 'v*'
  # Re-build / re-upload assets for an existing tag (e.g. after notarization wiring).
  workflow_dispatch:
    inputs:
      tag:
        description: 'GitHub Release tag to (re)upload assets to (e.g. v26.8.9)'
        required: true
        type: string
      build_ref:
        description: 'Git ref to build from (empty = same as tag). Use development to ship notarization before a new tag.'
        required: false
        default: ''
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  actions: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  # Tag push: build the tagged SHA. Dispatch: build_ref if set, else the release tag.
  BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_ref || github.event.inputs.tag) || github.sha }}

jobs:
  # tip_key isolates from Gate: products / Ship: beta product-build groups.
  product-macos:
    name: "Build: macOS"
    uses: ./.github/workflows/product-macos-app.yml
    with:
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_ref || github.event.inputs.tag) || github.sha }}
      tip_key: ship-assets-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: read
      id-token: write

  product-android:
    name: "Build: Android"
    uses: ./.github/workflows/product-android-apk.yml
    with:
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_ref || github.event.inputs.tag) || github.sha }}
      tip_key: ship-assets-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: read
      id-token: write

  product-appimage:
    name: "Build: Linux AppImages"
    uses: ./.github/workflows/product-appimage.yml
    with:
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_ref || github.event.inputs.tag) || github.sha }}
      tip_key: ship-assets-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: read
      id-token: write

  release-macos:
    needs: product-macos
    runs-on: macos-27
    environment: release-beta
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Download product-macos-app
        uses: actions/download-artifact@v8
        with:
          name: product-macos-app
          path: product-macos-app/

      - uses: ./.github/actions/setup-xtask
        with:
          key: release-dmg

      # Drag-install volume: Wawona.app, Applications and README.txt.
      - name: Developer ID sign, notarize and staple the DMG
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          APP=product-macos-app/Wawona.app
          [[ -d "$APP" ]] || APP="$(find product-macos-app -name Wawona.app -type d | head -1)"
          # The artifact zip can drop +x.
          find "$APP/Contents/MacOS" "$APP/Contents/Resources/bin" -type f -exec chmod +x {} +
          cargo xtask package dmg --app "$APP" --notarize
          mv dist/Wawona-*-macOS-arm64.dmg .

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: Wawona-*-macOS-arm64.dmg

  release-ios:
    name: "iOS IPA (GitHub Release asset)"
    runs-on: macos-27
    environment: release-beta
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Resolve version from tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "WAWONA_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "WAWONA_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-xtask
        with:
          key: release-ios

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Same match+gym path as Ship: beta.
      - name: Build signed iPhone IPA (Fastlane)
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_URL: https://github.com/aspauldingcode/apple-signing.git
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          WAWONA_BUILD_NUMBER: ${{ github.run_number }}
          CI: "true"
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          bundle exec fastlane ios github_ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: dist/Wawona-*-iOS-arm64.ipa

  release-android:
    needs: product-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Download product-android-apk
        uses: actions/download-artifact@v8
        with:
          name: product-android-apk
          path: dist/

      - name: Copy APK
        run: |
          VERSION=$(cat VERSION)
          if [[ ! -f dist/Wawona.apk ]]; then
            found="$(find dist -name 'Wawona.apk' -type f | head -1)"
            [[ -n "$found" ]] || { echo "APK missing"; exit 1; }
            cp -L "$found" dist/Wawona.apk
          fi
          cp dist/Wawona.apk "Wawona-${VERSION}-Android-arm64.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: Wawona-*.apk

  release-linux:
    name: "Linux AppImage (${{ matrix.system }})"
    needs: product-appimage
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
          - system: aarch64-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Download product AppImage
        uses: actions/download-artifact@v8
        with:
          name: product-appimage-${{ matrix.system }}
          path: dist/

      - name: Stage for release
        run: |
          VERSION=$(cat VERSION)
          mkdir -p release-stage
          found=0
          while IFS= read -r -d '' f; do
            base=$(basename "$f")
            arch=
            case "$base" in
              *aarch64*|*arm64*) arch=arm64 ;;
              *x86_64*) arch=x86_64 ;;
            esac
            [[ -n "$arch" ]] || { echo "error: cannot infer arch from $base"; exit 1; }
            dest="release-stage/Wawona-${VERSION}-Linux-${arch}.AppImage"
            cp -v "$f" "$dest"
            found=1
          done < <(find dist -name '*.AppImage' -type f -print0)
          [[ "$found" -eq 1 ]] || { echo "error: no AppImage in dist/"; exit 1; }
          ls -la release-stage/

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage-${{ matrix.system }}
          path: release-stage/*.AppImage

  create-release:
    needs: [release-macos, release-ios, release-android, release-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.dmg' -o -name '*.apk' -o -name '*.ipa' -o -name '*.AppImage' \) \
            -exec cp -v {} release-assets/ \;
          ls -la release-assets/
          test "$(find release-assets -type f | wc -l)" -ge 4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${TAG#v}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Wawona $VERSION" \
              --generate-notes \
              --latest
          fi
