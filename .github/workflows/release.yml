name: "Ship: GitHub assets"

# Tag push (v*) → GitHub Release with macOS DMG, Android APK, iOS IPA, and Linux
# AppImages. Pure products: macos / android / appimage only (no apple-family -
# watchOS sim is not a Release asset and has flaked on -downloadPlatform iOS).
# IPA is impure Fastlane match+gym (same signing path as Ship: beta).
# Re-registered 2026-07-16 after Actions run-history purge left this workflow deleted.

on:
  push:
    tags:
      - 'v*'
  # Re-build / re-upload assets for an existing tag (e.g. after notarization wiring).
  workflow_dispatch:
    inputs:
      tag:
        description: 'GitHub Release tag to (re)upload assets to (e.g. v26.8.9)'
        required: true
        type: string
      build_ref:
        description: 'Git ref to build from (empty = same as tag). Use development to ship notarization before a new tag.'
        required: false
        default: ''
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  actions: read

env:
  NIXPKGS_ALLOW_UNFREE: '1'
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  # Tag push: build the tagged SHA. Dispatch: build_ref if set, else the release tag.
  BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_ref || github.event.inputs.tag) || github.sha }}

jobs:
  # tip_key isolates from Gate: products / Ship: beta product-build groups.
  product-macos:
    name: "Build: macOS"
    uses: ./.github/workflows/product-macos-app.yml
    with:
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_ref || github.event.inputs.tag) || github.sha }}
      tip_key: ship-assets-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: read
      id-token: write

  product-android:
    name: "Build: Android"
    uses: ./.github/workflows/product-android-apk.yml
    with:
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_ref || github.event.inputs.tag) || github.sha }}
      tip_key: ship-assets-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: read
      id-token: write

  product-appimage:
    name: "Build: Linux AppImages"
    uses: ./.github/workflows/product-appimage.yml
    with:
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_ref || github.event.inputs.tag) || github.sha }}
      tip_key: ship-assets-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: read
      id-token: write

  release-macos:
    needs: product-macos
    runs-on: macos-26
    environment: release-beta
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Download product-macos-app
        uses: actions/download-artifact@v8
        with:
          name: product-macos-app
          path: product-macos-app/

      - name: Stage signed-app tree + pkg-only DMG root
        run: |
          VERSION=$(cat VERSION)
          echo "WAWONA_VERSION=$VERSION" >> "$GITHUB_ENV"
          # sign-staging holds Wawona.app for Developer ID + pkg payload only.
          # dmg-staging is the volume root: WawonaAgent.pkg + README.txt (no .app).
          mkdir -p sign-staging dmg-staging
          if [[ -d product-macos-app/Wawona.app ]]; then
            ditto product-macos-app/Wawona.app sign-staging/Wawona.app
          else
            found="$(find product-macos-app -name 'Wawona.app' -type d | head -1)"
            [[ -n "$found" ]] || { echo "Wawona.app missing"; exit 1; }
            ditto "$found" sign-staging/Wawona.app
          fi
          # GHA artifact zip can drop +x; restore before packaging.
          chmod -R u+w sign-staging/Wawona.app
          find sign-staging/Wawona.app/Contents/MacOS -type f -exec chmod +x {} + 2>/dev/null || true
          find sign-staging/Wawona.app/Contents/Resources/bin -type f -exec chmod +x {} + 2>/dev/null || true
          # Unsigned pkg draft; notarize script re-seals from the signed app.
          chmod +x ./scripts/macos-launch-agent-pkg.sh
          WAWONA_VERSION="$VERSION" \
          WAWONA_APP_SRC="$PWD/sign-staging/Wawona.app" \
            ./scripts/macos-launch-agent-pkg.sh "dmg-staging/WawonaAgent.pkg"
          {
            echo 'Thank you for installing Wawona'
            echo '==============================='
            echo ''
            echo 'I am grateful you chose Wawona. Your trust means a lot, and'
            echo 'it is people like you who make this work worth shipping.'
            echo ''
            echo 'How to install'
            echo '--------------'
            echo 'Double-click WawonaAgent.pkg. That single installer handles'
            echo 'everything for you:'
            echo ''
            echo '  • Places Wawona.app in /Applications'
            echo '  • Loads the compositor and menubar LaunchAgents'
            echo '  • Registers System Settings → Wawona (preference pane)'
            echo '  • Publishes WAYLAND_DISPLAY / XDG_RUNTIME_DIR so Wayland'
            echo '    clients can connect without opening the Wawona window'
            echo '  • Syncs the Desktop Replacement helper + dylib (install'
            echo '    never takes over the screen; enable that later in Settings)'
            echo ''
            echo 'There is no drag-to-Applications step on this disk. Use the'
            echo 'pkg only so Launch Agents, Settings, and the app stay in sync.'
            echo ''
            echo 'This DMG is Developer ID signed and notarized (Gatekeeper-clean).'
          } > dmg-staging/README.txt
          [[ -d sign-staging/Wawona.app ]] || { echo "error: sign-staging/Wawona.app missing"; exit 1; }
          [[ -x sign-staging/Wawona.app/Contents/MacOS/Wawona ]] || { echo "error: Wawona binary not executable"; exit 1; }
          [[ -f dmg-staging/WawonaAgent.pkg ]] || { echo "error: dmg-staging/WawonaAgent.pkg missing"; exit 1; }
          [[ -f dmg-staging/README.txt ]] || { echo "error: dmg-staging/README.txt missing"; exit 1; }
          if [[ -e dmg-staging/Wawona.app || -e dmg-staging/Applications ]]; then
            echo "error: DMG root must not contain Wawona.app or Applications" >&2
            exit 1
          fi

      - name: Developer ID sign + notarize DMG
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_INSTALLER_P12_BASE64: ${{ secrets.DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          chmod +x ./scripts/macos-sign-and-notarize-dmg.sh
          ./scripts/macos-sign-and-notarize-dmg.sh \
            --app sign-staging/Wawona.app \
            --pkg dmg-staging/WawonaAgent.pkg \
            --staging dmg-staging \
            --dmg "Wawona-${WAWONA_VERSION}-macOS-arm64.dmg" \
            --version "$WAWONA_VERSION"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: Wawona-*-macOS-arm64.dmg

  release-ios:
    name: "iOS IPA (GitHub Release asset)"
    runs-on: macos-26
    environment: release-beta
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Resolve version from tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "WAWONA_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "WAWONA_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            allow-import-from-derivation = true
            trusted-users = runner root
      - uses: DeterminateSystems/flakehub-cache-action@v3

      # Same match+gym path as Ship: beta. Nix .#wawona-ios-ipa asserts cert
      # files that we do not pass here; Fastlane owns App Store signing.
      - name: Build signed iPhone IPA (Fastlane)
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_URL: https://github.com/aspauldingcode/apple-signing.git
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          WAWONA_BUILD_NUMBER: ${{ github.run_number }}
          SECRETSPEC_PROFILE: ci-apple
          SECRETSPEC_PROVIDER: env
          CI: "true"
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          nix develop .#release --command bash -c \
            './scripts/release-env.sh fastlane ios github_ipa'

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: dist/Wawona-*-iOS-arm64.ipa

  release-android:
    needs: product-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Download product-android-apk
        uses: actions/download-artifact@v8
        with:
          name: product-android-apk
          path: dist/

      - name: Copy APK
        run: |
          VERSION=$(cat VERSION)
          if [[ ! -f dist/Wawona.apk ]]; then
            found="$(find dist -name 'Wawona.apk' -type f | head -1)"
            [[ -n "$found" ]] || { echo "APK missing"; exit 1; }
            cp -L "$found" dist/Wawona.apk
          fi
          cp dist/Wawona.apk "Wawona-${VERSION}-Android-arm64.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: Wawona-*.apk

  release-linux:
    name: "Linux AppImage (${{ matrix.system }})"
    needs: product-appimage
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
          - system: aarch64-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Download product AppImage
        uses: actions/download-artifact@v8
        with:
          name: product-appimage-${{ matrix.system }}
          path: dist/

      - name: Stage for release
        run: |
          VERSION=$(cat VERSION)
          mkdir -p release-stage
          found=0
          while IFS= read -r -d '' f; do
            base=$(basename "$f")
            arch=
            case "$base" in
              *aarch64*|*arm64*) arch=arm64 ;;
              *x86_64*) arch=x86_64 ;;
            esac
            [[ -n "$arch" ]] || { echo "error: cannot infer arch from $base"; exit 1; }
            dest="release-stage/Wawona-${VERSION}-Linux-${arch}.AppImage"
            cp -v "$f" "$dest"
            found=1
          done < <(find dist -name '*.AppImage' -type f -print0)
          [[ "$found" -eq 1 ]] || { echo "error: no AppImage in dist/"; exit 1; }
          ls -la release-stage/

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage-${{ matrix.system }}
          path: release-stage/*.AppImage

  create-release:
    needs: [release-macos, release-ios, release-android, release-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.dmg' -o -name '*.apk' -o -name '*.ipa' -o -name '*.AppImage' \) \
            -exec cp -v {} release-assets/ \;
          ls -la release-assets/
          test "$(ls release-assets | wc -l)" -ge 4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${TAG#v}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Wawona $VERSION" \
              --generate-notes \
              --latest
          fi
