name: Wawona org quality

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: org-quality-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changed-files:
    name: Changed-file integrity
    runs-on: ubuntu-24.04
    outputs:
      rust_changed: ${{ steps.repository-kind.outputs.rust_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject whitespace errors and malformed data files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "$zero" ]]; then
            base="$BEFORE_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          else
            base="$(git hash-object -t tree /dev/null)"
          fi

          git diff --check "$base" HEAD

          while IFS= read -r -d '' path; do
            [[ -f "$path" ]] || continue
            case "$path" in
              *.json) jq empty "$path" ;;
              *.py) python3 -m py_compile "$path" ;;
              *.sh)
                if head -n 1 "$path" | grep -q 'bash'; then
                  bash -n "$path"
                else
                  sh -n "$path"
                fi
                ;;
              *.yaml|*.yml) ruby -e "require 'yaml'; YAML.parse_file(ARGV.fetch(0))" "$path" ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR -z "$base" HEAD)
      - name: Classify repository
        id: repository-kind
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "$zero" ]]; then
            base="$BEFORE_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          else
            base="$(git hash-object -t tree /dev/null)"
          fi
          if [[ -f Cargo.toml ]] && git diff --name-only "$base" HEAD | grep -Eq '\.rs$'; then
            echo 'rust_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'rust_changed=false' >> "$GITHUB_OUTPUT"
          fi

  rust-format:
    name: Rust formatting
    needs: changed-files
    if: needs.changed-files.outputs.rust_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add rustfmt
      - name: Stub optional path dependencies for fmt
        shell: bash
        run: |
          # ./coreutils and ./waypipe are populated locally by
          # scripts/ensure-coreutils.sh / ensure-waypipe.sh (Nix).
          # cargo fmt --all resolves workspace metadata for all path deps even
          # when they are optional; stub Cargo.toml (with the feature names
          # Cargo.toml requests) so metadata load succeeds without a real
          # source checkout.
          python3 - <<'PY'
          from pathlib import Path
          stubs = {
              "coreutils": [
                  "ls", "cat", "cp", "mv", "rm", "mkdir", "rmdir", "ln", "touch", "echo",
                  "pwd", "head", "tail", "wc", "sort", "cut", "tr", "seq", "basename",
                  "dirname", "stat", "du", "df", "date", "env", "printenv", "uname",
                  "whoami", "yes", "tee", "nl", "tac", "fold", "expand", "unexpand",
                  "truncate", "chmod",
              ],
              "waypipe": ["lz4", "zstd", "video"],
          }
          for name, feats in stubs.items():
              root = Path(name)
              if (root / "Cargo.toml").exists():
                  continue
              (root / "src").mkdir(parents=True, exist_ok=True)
              feat_lines = "\n".join(f"{f} = []" for f in feats)
              (root / "Cargo.toml").write_text(
                  f"[package]\nname = \"{name}\"\nversion = \"0.0.1\"\nedition = \"2021\"\n\n"
                  f"[features]\ndefault = []\n{feat_lines}\n"
              )
              (root / "src" / "lib.rs").write_text("// stub\n")
          PY
      - name: Stub dangling Terminal symlinks for fmt
        shell: bash
        run: |
          # src/term/{screen,kitty}.rs are committed as symlinks to a sibling
          # Terminal checkout. CI shallow clones do not have that tree;
          # scripts/ensure-terminal.sh (Nix) materializes real files for builds.
          # rustfmt follows the broken links and aborts, so replace them with
          # tiny stubs for the format check only.
          for f in src/term/screen.rs src/term/kitty.rs; do
            if [[ -L "$f" && ! -e "$f" ]]; then
              rm -f "$f"
              printf '// stub for fmt; real file from scripts/ensure-terminal.sh\n' > "$f"
            fi
          done
      - run: cargo fmt --all -- --check

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  vulnerable-dependencies:
    name: OSV dependency scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@7f58dd6750d78fc29a900ba64b1a0f946f62fba4 # v2.6.0
        with:
          scan-args: |-
            --include-git-root
            --recursive
            --experimental-exclude=dependencies/generators
            --experimental-exclude=dependencies/clients
            ./

  workflow-security:
    name: Workflow security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Reject high-severity GitHub Actions findings
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "$zero" ]]; then
            base="$BEFORE_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          else
            base="$(git hash-object -t tree /dev/null)"
          fi
          mapfile -d '' workflows < <(git diff --name-only --diff-filter=ACMR -z \
            "$base" HEAD -- \
            ':(glob).github/workflows/*.yml' \
            ':(glob).github/workflows/*.yaml')
          if (( ${#workflows[@]} == 0 )); then
            exit 0
          fi
          uvx "zizmor==1.30.1" --min-severity high "${workflows[@]}"

  linux-package-wiring:
    name: Linux package wiring
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Linux package wiring (wawonaLinuxUiBin / #164 / autostart)
        run: python3 ./.github/scripts/verify-linux-package-wiring.py
      - name: Verify Linux shell-tool wiring
        run: python3 ./.github/scripts/verify-linux-shell-tools.py
