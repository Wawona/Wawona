name: Android parity builds

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - 'dependencies/**'
      - 'src/platform/android/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/scripts/verify-android-shell-tools.py'
      - '.github/scripts/verify-android-meson-sandbox.py'
      - '.github/scripts/nix-build-shell-tools.sh'
      - '.github/scripts/nix-build-android-meson-sandbox-gate.sh'
  pull_request:
    paths:
      - 'android/**'
      - 'dependencies/**'
      - 'src/platform/android/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/scripts/verify-android-shell-tools.py'
      - '.github/scripts/verify-android-meson-sandbox.py'
      - '.github/scripts/nix-build-shell-tools.sh'
      - '.github/scripts/nix-build-android-meson-sandbox-gate.sh'

permissions:
  contents: read
  id-token: write

concurrency:
  group: android-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-android-gate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Verify Android shell-tool wiring
        run: python3 ./.github/scripts/verify-android-shell-tools.py
      - name: Checkout flake inputs for meson verify
        run: ./.github/scripts/checkout-flake-inputs.sh
      - name: Verify Android meson sandbox hooks
        run: python3 ./.github/scripts/verify-android-meson-sandbox.py
      - name: Build weston + compositor + bundled shell tools
        run: ./.github/scripts/nix-build-android-meson-sandbox-gate.sh
      - name: Build bundled shell tools + weston-ios
        run: |
          nix build .#zsh-android .#fastfetch-android .#neovim-android \
            .#weston-ios --no-link
      - name: Gradle project assembleDebug
        run: |
          nix run .#gradlegen
          cd Wawona-gradle-project
          ./gradlew :Wawona:assembleDebug --no-daemon
