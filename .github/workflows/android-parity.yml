name: Android parity builds

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - 'dependencies/**'
      - 'src/platform/android/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/scripts/verify-android-shell-tools.py'
      - '.github/scripts/nix-build-shell-tools.sh'
  pull_request:
    paths:
      - 'android/**'
      - 'dependencies/**'
      - 'src/platform/android/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/scripts/verify-android-shell-tools.py'
      - '.github/scripts/nix-build-shell-tools.sh'

jobs:
  nix-android-gate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
      - name: Verify Android shell-tool wiring
        run: python3 ./.github/scripts/verify-android-shell-tools.py
      - name: Build weston + compositor + bundled shell tools
        run: |
          nix build .#weston-android .#weston-compositor-android \
            .#zsh-android .#fastfetch-android .#neovim-android \
            .#weston-ios --no-link
      - name: Gradle project assembleDebug
        run: |
          nix run .#gradlegen
          cd Wawona-gradle-project
          ./gradlew :Wawona:assembleDebug --no-daemon
