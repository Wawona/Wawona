# Nix-only floor for other flakes / manual dispatch. On Wawona, Verification
# already runs scripts/verify-nix.sh. Do not fire on every push (Actions noise).
# Required development check remains "Verification report" in verify-all.yml.
name: Nix floor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    name: Nix floor
    uses: ./.github/workflows/nix-repo-floor.yml
