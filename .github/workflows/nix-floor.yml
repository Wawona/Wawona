# Nix-only floor for path-filtered pushes. The required development check is the
# "Verification report" job in verify-all.yml (full matrix). Do not reuse that
# check name here.
name: Nix floor

on:
  push:
    branches: [development, master, main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "**/*.nix"
      - ".github/workflows/nix-floor.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "**/*.nix"
      - ".github/workflows/nix-floor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    name: Nix floor
    uses: ./.github/workflows/nix-repo-floor.yml
