name: "Build: GUI smoke"

# Dispatcher for manual / legacy callers. Gate: products calls the thin
# per-platform smoke workflows directly (no skip spam).

on:
  workflow_dispatch:
    inputs:
      tip_key:
        description: "Tip concurrency key (branch name; empty = github.ref_name)"
        type: string
        required: false
        default: ""
      lanes:
        description: "Lane subset: all | ios | android | macos | linux"
        type: string
        required: false
        default: "all"
      products_ready:
        description: "When true, consume product-build artifacts"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to test"
        type: string
        required: false
        default: ""
      tip_key:
        description: "Tip concurrency key"
        type: string
        required: false
        default: ""
      products_ready:
        description: "When true, consume product-build artifacts"
        type: boolean
        required: false
        default: false
      lanes:
        description: "Lane subset: all | ios | android | macos | linux"
        type: string
        required: false
        default: "all"

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: device-e2e-${{ github.sha }}-${{ inputs.products_ready && 'products' || 'standalone' }}-${{ inputs.lanes || 'all' }}
  cancel-in-progress: false

jobs:
  ios:
    name: "iOS"
    if: ${{ (inputs.lanes || 'all') == 'all' || (inputs.lanes || 'all') == 'ios' }}
    uses: ./.github/workflows/device-e2e-ios.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.tip_key }}
      products_ready: ${{ inputs.products_ready }}
    permissions:
      contents: read
      id-token: write
      actions: read

  android:
    name: "Android"
    if: ${{ (inputs.lanes || 'all') == 'all' || (inputs.lanes || 'all') == 'android' }}
    uses: ./.github/workflows/device-e2e-android.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.tip_key }}
      products_ready: ${{ inputs.products_ready }}
    permissions:
      contents: read
      id-token: write
      actions: read

  macos:
    name: "macOS"
    if: ${{ (inputs.lanes || 'all') == 'all' || (inputs.lanes || 'all') == 'macos' }}
    uses: ./.github/workflows/device-e2e-macos.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.tip_key }}
      products_ready: ${{ inputs.products_ready }}
    permissions:
      contents: read
      id-token: write
      actions: read

  linux:
    name: "Linux"
    if: ${{ (inputs.lanes || 'all') == 'all' || (inputs.lanes || 'all') == 'linux' }}
    uses: ./.github/workflows/device-e2e-linux.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.tip_key }}
      products_ready: ${{ inputs.products_ready }}
    permissions:
      contents: read
      id-token: write
      actions: read
