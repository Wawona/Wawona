name: "Watch: Appium UI matrix"

# Nightly + path-filtered development push. Not a promote blocker until the
# native lane is green and Build: GUI smoke switches over. Docs:
# docs/testing/appium-ui-matrix.md
#
# Artifacts: CI writes to test-artifacts/appium/ (non-hidden). Local dogfood
# still uses .agent-device/test-artifacts/appium via script defaults.
# Catalog green = PNG only. macOS tip+Colima smoke fail-closed (no SKIPPED
# exit 0). Linux catalog only when products_ready.

on:
  workflow_dispatch:
    inputs:
      products_ready:
        description: "Download Gate: products artifacts instead of building"
        type: boolean
        required: false
        default: false
      lanes:
        description: "all | apple | android | linux | unit"
        type: string
        required: false
        default: "all"
  schedule:
    - cron: "30 7 * * *"
  push:
    branches: [development]
    paths:
      - "Tests/appium/**"
      - "scripts/appium/**"
      - ".github/workflows/ui-appium.yml"
      - "Sources/WawonaUI/Machines/Catalog/WWNAccessibilityIdentifiers.swift"
      - "android/app/src/main/java/com/aspauldingcode/wawona/WawonaTestTags.kt"
      - "src/linux/ui/a11y.rs"
      - "Sources/WawonaModel/PlatformCapabilities.swift"

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ui-appium-${{ github.sha }}
  cancel-in-progress: false

jobs:
  unit:
    name: "selectors + matrix (offline)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Tip soft-supersede
        run: ./.github/scripts/ci-require-branch-tip.sh || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify a11y sync + matrix + Wayland guest map
        run: |
          pip install -q tomli
          python3 scripts/appium/verify-a11y-sync.py
          python3 scripts/appium/verify-matrix.py
          python3 scripts/appium/verify-wayland-guest-map.py
          cd Tests/appium
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -q -r requirements.txt
          WAWONA_APPIUM_DRY=1 PYTHONPATH=. pytest tests/test_gates_unit.py -q

  android:
    name: "Android Appium (KVM)"
    if: ${{ github.event_name != 'push' || true }}
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Tip soft-supersede
        run: ./.github/scripts/ci-require-branch-tip.sh || true
      - name: Prepare Appium artifact dir
        run: |
          chmod +x scripts/appium/ci-prepare-artifacts.sh
          eval "$(scripts/appium/ci-prepare-artifacts.sh)"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download product-android-apk
        if: ${{ inputs.products_ready }}
        uses: actions/download-artifact@v8
        with:
          name: product-android-apk
          path: dist/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Appium + UiAutomator2
        run: |
          npm install -g appium@3.1.1
          appium driver install uiautomator2
      - name: Start Appium
        run: |
          appium --address 127.0.0.1 --port 4723 > /tmp/appium.log 2>&1 &
          echo $! > /tmp/appium.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4723/status && break
            sleep 1
          done
      - name: Android Appium suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          # One-liner: multiline script under /usr/bin/sh (dash) broke if/fi.
          script: bash scripts/appium/ci-android-suite.sh
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appium-android
          path: test-artifacts/appium/
          if-no-files-found: warn

  linux:
    name: "Linux Appium (Xvfb + Wayland nested catalog)"
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Tip soft-supersede
        run: ./.github/scripts/ci-require-branch-tip.sh || true
      - name: Prepare Appium artifact dir
        run: |
          chmod +x scripts/appium/ci-prepare-artifacts.sh
          eval "$(scripts/appium/ci-prepare-artifacts.sh)"
      - name: Download product AppImage
        if: ${{ inputs.products_ready }}
        uses: actions/download-artifact@v8
        with:
          name: product-appimage-x86_64-linux
          path: dist/
      - name: Install Xvfb + AT-SPI + Wayland clients
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xfixes0 x11-utils at-spi2-core \
            weston foot || true
      - name: Start Xvfb
        run: |
          /sbin/start-stop-daemon --start --quiet \
            --pidfile /tmp/custom_xvfb_99.pid --make-pidfile \
            --background --exec /usr/bin/Xvfb -- :99 \
            --screen 0 1920x1200x24
          echo "DISPLAY=:99.0" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Appium Linux driver
        run: |
          npm install -g appium@3.1.1
          appium driver install --source=npm appium-linux-driver || true
          appium --address 127.0.0.1 --port 4723 > /tmp/appium.log 2>&1 &
          sleep 3
      - name: Linux Appium unit gates
        env:
          DISPLAY: ":99.0"
          WAWONA_APPIUM_PLATFORM: linux
          WAWONA_APPIUM_SERVER: http://127.0.0.1:4723
        run: |
          set -euo pipefail
          eval "$(scripts/appium/ci-prepare-artifacts.sh)"
          chmod +x scripts/appium/run-appium-suite.sh
          python3 scripts/appium/verify-wayland-guest-map.py
          WAWONA_APPIUM_DRY=1 ./scripts/appium/run-appium-suite.sh \
            tests/test_gates_unit.py
      - name: Linux Wayland catalog (needs AppImage)
        # Literally skip (not exit 0 + SKIPPED.txt). Catalog green = PNG only.
        if: ${{ inputs.products_ready }}
        env:
          DISPLAY: ":99.0"
          WAWONA_APPIUM_PLATFORM: linux
          WAWONA_APPIUM_SERVER: http://127.0.0.1:4723
          WAWONA_WAYLAND_GUEST: nested
        run: |
          set -euo pipefail
          eval "$(scripts/appium/ci-prepare-artifacts.sh)"
          chmod +x scripts/appium/run-appium-suite.sh
          chmod +x scripts/appium/launch-wayland-client.sh
          if [[ -z "${WAWONA_APP_PATH:-}" ]]; then
            img="$(find dist -name 'Wawona*.AppImage' -type f 2>/dev/null | head -1 || true)"
            if [[ -n "$img" ]]; then
              chmod +x "$img"
              export WAWONA_APP_PATH="$img"
            fi
          fi
          # Fail closed: SKIPPED.txt + exit 0 is false green (no PNG proof).
          if [[ -z "${WAWONA_APP_PATH:-}" && ! -x /usr/bin/Wawona ]]; then
            echo "::error title=Catalog not proven::No Wawona AppImage. Pass products_ready after Gate products."
            printf '%s\n' "FAIL: no AppImage; catalog not proven." \
              >"${WAWONA_APPIUM_ARTIFACTS}/catalog-gallery/FAILED.txt"
            exit 1
          fi
          ./scripts/appium/run-appium-suite.sh \
            tests/test_gates_unit.py \
            tests/test_catalog_wayland.py
          python3 scripts/appium/verify-catalog-gallery.py
          shopt -s nullglob
          pngs=("${WAWONA_APPIUM_ARTIFACTS}/catalog-gallery/"*.png)
          if ((${#pngs[@]} == 0)); then
            echo "::error title=Catalog not proven::No catalog-gallery PNG after suite."
            exit 1
          fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appium-linux
          path: test-artifacts/appium/
          if-no-files-found: warn
      - name: Upload catalog screenshot gallery
        if: ${{ always() && inputs.products_ready }}
        uses: actions/upload-artifact@v7
        with:
          name: appium-catalog-gallery-linux
          path: test-artifacts/appium/catalog-gallery/
          if-no-files-found: error

  apple:
    name: "Apple Appium (${{ matrix.platform }})"
    needs: unit
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            device: "iPhone 17 Pro"
            download_visionos: false
          - platform: ipados
            device: "iPad Pro 13-inch (M4)"
            download_visionos: false
          - platform: tvos
            device: "Apple TV 4K (3rd generation)"
            download_visionos: false
          - platform: visionos
            device: "Apple Vision Pro"
            download_visionos: true
          - platform: macos
            device: "macOS"
            download_visionos: false
          - platform: ios
            device: "iPhone 17 Pro"
            download_visionos: false
            job_name: ios-watch-pair
            watch_pair: true
    steps:
      - uses: actions/checkout@v5
      - name: Tip soft-supersede
        run: ./.github/scripts/ci-require-branch-tip.sh || true
      - name: Prepare Appium artifact dir
        run: |
          chmod +x scripts/appium/ci-prepare-artifacts.sh
          eval "$(scripts/appium/ci-prepare-artifacts.sh)"
      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh
      - name: Download visionOS SDK
        if: ${{ matrix.download_visionos }}
        run: xcodebuild -downloadPlatform visionOS -buildVersion 26.2 || xcodebuild -downloadPlatform visionOS
      - name: Download product-macos-app
        if: ${{ matrix.platform == 'macos' && inputs.products_ready }}
        uses: actions/download-artifact@v8
        with:
          name: product-macos-app
          path: product-macos-app/
      - name: Stage macOS host app
        if: ${{ matrix.platform == 'macos' && inputs.products_ready }}
        run: |
          if [[ -d product-macos-app/Wawona.app ]]; then
            app="$PWD/product-macos-app/Wawona.app"
          else
            app="$(find product-macos-app -name 'Wawona.app' -type d | head -1 || true)"
          fi
          [[ -n "$app" && -d "$app" ]] || { echo "Wawona.app missing from product-macos-app"; exit 1; }
          echo "WAWONA_APP_PATH=$app" >> "$GITHUB_ENV"
          # Tip refuse still allows this path when WAWONA_ALLOW_STALE_TEST_APP is unset
          # only for Gate product of this SHA via products_ready. Catalog capture
          # treats it as the host app (not /Applications).
          echo "Staged host app: $app"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Appium + XCUITest / Mac2
        run: |
          npm install -g appium@3.1.1
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            appium driver install mac2
          else
            appium driver install xcuitest
          fi
          appium --address 127.0.0.1 --port 4723 > /tmp/appium.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:4723/status && break
            sleep 1
          done
      - name: Apple Appium suite (dry until product artifact wired)
        env:
          WAWONA_APPIUM_PLATFORM: ${{ matrix.platform }}
          WAWONA_DEVICE_NAME: ${{ matrix.device }}
          WAWONA_APPIUM_SERVER: http://127.0.0.1:4723
          WAWONA_APPIUM_DRY: "1"
        run: |
          eval "$(scripts/appium/ci-prepare-artifacts.sh)"
          chmod +x scripts/appium/run-appium-suite.sh
          ./scripts/appium/run-appium-suite.sh
      - name: macOS Wayland catalog guests (Colima)
        if: ${{ matrix.platform == 'macos' }}
        env:
          WAWONA_APPIUM_PLATFORM: macos
          WAWONA_APPIUM_SERVER: http://127.0.0.1:4723
          WAWONA_WAYLAND_GUEST: colima
          WAWONA_COLIMA_START: "1"
          # This VM is disposable runner state. Recover stale prestarted Lima
          # state when Colima says running but has no live SSH config.
          WAWONA_COLIMA_RECOVER: "1"
          # CI smoke clients only. Full matrix is local
          # scripts/appium/capture-catalog-gallery.sh (no argv).
          WAWONA_CATALOG_CI_CLIENTS: "weston_simple_shm foot"
        run: |
          set -euo pipefail
          eval "$(scripts/appium/ci-prepare-artifacts.sh)"
          chmod +x scripts/appium/launch-wayland-client.sh
          chmod +x scripts/appium/ensure-colima.sh
          chmod +x scripts/appium/ensure-tip-wawona-macos.sh
          chmod +x scripts/appium/capture-catalog-gallery.sh
          python3 scripts/appium/verify-wayland-guest-map.py
          # Never exit 0 without PNGs. SKIPPED.txt was false green on tip a58384fc.
          if ! command -v colima >/dev/null 2>&1; then
            brew install colima lima || {
              echo "FAIL: colima required for macOS catalog Wayland guests" >&2
              exit 1
            }
          fi
          unset WAWONA_APPIUM_DRY || true
          # Gate product (products_ready): copy into tip path so ensure-tip
          # clean-launches without xcodebuild. Else capture tip-builds.
          if [[ -n "${WAWONA_APP_PATH:-}" && -d "${WAWONA_APP_PATH}" ]]; then
            TIP_APP="/tmp/wawona-macos-tip/DerivedData/Build/Products/Debug/Wawona.app"
            mkdir -p "$(dirname "$TIP_APP")"
            rm -rf "$TIP_APP"
            ditto "$WAWONA_APP_PATH" "$TIP_APP"
            echo "$(git rev-parse HEAD)" >/tmp/wawona-macos-tip/git-HEAD
            export WAWONA_TIP_SKIP_BUILD=1
            export WAWONA_APP_PATH="$TIP_APP"
          fi
          # shellcheck disable=SC2086
          ./scripts/appium/capture-catalog-gallery.sh ${WAWONA_CATALOG_CI_CLIENTS}
          shopt -s nullglob
          pngs=("${WAWONA_APPIUM_ARTIFACTS}/catalog-gallery/"*.png)
          if ((${#pngs[@]} == 0)); then
            echo "::error title=Catalog not proven::No catalog-gallery PNG after capture."
            exit 1
          fi
          echo "Catalog PNGs: ${pngs[*]}"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appium-${{ matrix.job_name || matrix.platform }}
          path: test-artifacts/appium/
          if-no-files-found: warn
      - name: Upload catalog screenshot gallery (macOS)
        if: ${{ always() && matrix.platform == 'macos' }}
        uses: actions/upload-artifact@v7
        with:
          name: appium-catalog-gallery-macos
          path: test-artifacts/appium/catalog-gallery/
          # Fail the job when catalog left no PNG (or FAILED.txt only).
          if-no-files-found: error
