name: "Build: iOS sim"

# Thin product producer (one platform slice). Called by Gate: products / Ship.
# No `only` filter: every job here always runs. Keeps Actions UI free of skip spam.

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = this SHA)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = caller sha)"
        type: string
        required: false
        default: ""
      tip_key:
        description: "Unused; kept for caller compatibility"
        type: string
        required: false
        default: ""

concurrency:
  group: product-ios-sim-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  NIXPKGS_ALLOW_UNFREE: "1"

jobs:
  ios-sim:
    name: "iOS sim .app"
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Select Xcode
        id: xcode
        run: ./.github/scripts/select-xcode.sh

      # SDK check is cheap; set skip before Nix so build-app.nix never hits CDN.
      - name: Ensure iOS Simulator SDK (skip platform download when present)
        run: ./.github/scripts/warm-ios-simulator-sdk.sh ios

      - uses: ./.github/actions/setup-nix-flakehub

      - name: Build wawona-ios
        run: ./.github/scripts/nix-retry.sh nix build ".#wawona-ios" --print-build-logs --out-link result-ios

      - name: Plain summary
        if: success()
        run: |
          {
            echo "# Build: iOS"
            echo ""
            echo "**PASS:** iOS simulator app built."
            echo ""
            echo "Next: smoke test downloads this artifact."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Stage + manifest
        run: |
          mkdir -p dist/ios-sim
          # Dereference store symlinks so the GHA artifact is self-contained.
          ditto result-ios/Wawona.app dist/ios-sim/Wawona.app
          test -d dist/ios-sim/Wawona.app
          OUT="$(readlink -f result-ios)"
          {
            echo "{"
            echo "  \"attr\": \"wawona-ios\","
            echo "  \"sha\": \"${{ github.sha }}\","
            echo "  \"outPath\": \"$OUT\","
            echo "  \"artifact\": \"product-ios-sim\""
            echo "}"
          } > dist/ios-sim/product-manifest.json
          # Note whether path looks cache-backed (best-effort).
          if nix path-info --json "$OUT" 2>/dev/null | grep -q cache.flakehub.com; then
            echo "" >>"$GITHUB_STEP_SUMMARY"
            echo "Cache: reused a matching Nix build from FlakeHub (faster)." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "" >>"$GITHUB_STEP_SUMMARY"
            echo "Cache: built on this runner (or cache probe unclear)." >>"$GITHUB_STEP_SUMMARY"
          fi
          ls -la dist/ios-sim/

      - name: Verify store-safe iOS graphics bundle
        run: ./.github/scripts/verify-iland-graphics-bundle.sh --platform ios --simulator dist/ios-sim/Wawona.app

      - name: Verify iOS Mode A firewall
        run: bash ./.github/scripts/verify-ios-modeb-artifacts.sh --mode-a dist/ios-sim/Wawona.app

      - name: Verify iOS Mode B replay contract
        run: bash ./.github/scripts/verify-ios-modeb-ci.sh

      - uses: actions/upload-artifact@v7
        with:
          name: product-ios-sim
          path: dist/ios-sim/
          if-no-files-found: error
          # Bundle ships hidden Mach-Os (e.g. bin/.foot-wrapped); upload-artifact
          # excludes dotfiles by default, which broke foot in the matrix gate.
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

