name: "Build: iOS sim"

# Thin product producer (one platform slice). Called by Gate: products / Ship.
# No `only` filter: every job here always runs. Keeps Actions UI free of skip spam.

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = this SHA)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = caller sha)"
        type: string
        required: false
        default: ""
      tip_key:
        description: "Unused; kept for caller compatibility"
        type: string
        required: false
        default: ""

concurrency:
  group: product-ios-sim-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  ios-sim:
    name: "iOS sim .app"
    runs-on: macos-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: ./.github/actions/setup-xtask
        with:
          key: ios-sim

      # The iOS app embeds the watch companion, so both SDKs are needed.
      - name: Ensure Apple simulator SDKs
        run: cargo xtask ci warm-sdk ios watchos

      - name: Build Wawona-iOS for the simulator
        run: cargo xtask build ios --release

      - name: Plain summary
        if: success()
        run: |
          {
            echo "# Build: iOS"
            echo ""
            echo "**PASS:** iOS simulator app built."
            echo ""
            echo "Next: smoke test downloads this artifact."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Stage + manifest
        run: |
          mkdir -p dist/ios-sim
          ditto .build/xcode/ios/Build/Products/Release-iphonesimulator/Wawona.app dist/ios-sim/Wawona.app
          printf '{"target":"ios","sha":"%s","artifact":"product-ios-sim"}\n' "${{ github.sha }}" \
            > dist/ios-sim/product-manifest.json

      - name: Verify store-safe iOS graphics bundle
        run: cargo xtask artifact graphics --platform ios --simulator dist/ios-sim/Wawona.app

      - name: Verify iOS Mode A firewall
        run: cargo xtask artifact ios mode-a-simulator dist/ios-sim/Wawona.app

      - name: Verify iOS Mode B replay contract
        run: cargo xtask artifact ios-contract

      - uses: actions/upload-artifact@v7
        with:
          name: product-ios-sim
          path: dist/ios-sim/
          if-no-files-found: error
          # Bundle ships hidden Mach-Os (e.g. bin/.foot-wrapped); upload-artifact
          # excludes dotfiles by default, which broke foot in the matrix gate.
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

