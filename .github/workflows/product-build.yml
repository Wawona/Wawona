name: "Build: products"

# One product matrix over .github/ci-product-matrix.json.
# Apple / Android: cargo xtask over committed Xcode 27 + Gradle projects.
# Linux AppImages: nix build .#wawona-appimage (ship workflows rename/upload).
# `only` filters matrix rows (all | ios-sim | ios-modeb | apple-family |
# android-apk | macos-app | appimage).

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Product subset: all | ios-sim | ios-modeb | apple-family | android-apk | macos-app | appimage"
        type: string
        required: false
        default: "all"
      tip_key:
        description: "Tip concurrency key (branch name; empty = github.ref_name)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = caller sha)"
        type: string
        required: false
        default: ""
      tip_key:
        description: "Tip concurrency key (branch tip; empty = github.ref_name)"
        type: string
        required: false
        default: ""
      only:
        description: "Product subset: all | ios-sim | ios-modeb | apple-family | android-apk | macos-app | appimage"
        type: string
        required: false
        default: "all"

concurrency:
  group: product-build-${{ github.sha }}-${{ inputs.only || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  NIXPKGS_ALLOW_UNFREE: "1"

jobs:
  matrix:
    name: "Product matrix"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      include: ${{ steps.filter.outputs.include }}
      needs_waypipe: ${{ steps.filter.outputs.needs_waypipe }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          sparse-checkout: |
            .github/ci-product-matrix.json
          sparse-checkout-cone-mode: false
      - id: filter
        env:
          ONLY: ${{ inputs.only || 'all' }}
        run: |
          set -euo pipefail
          ROWS="$(jq -c --arg only "$ONLY" '[.include[] | select(.only | index($only))]' .github/ci-product-matrix.json)"
          COUNT="$(jq 'length' <<<"$ROWS")"
          if [[ "$COUNT" -eq 0 ]]; then
            echo "no product rows for only=$ONLY" >&2
            exit 1
          fi
          NEED_WP="$(jq -r 'any(.[]; .needs_waypipe_guest == true)' <<<"$ROWS")"
          echo "Filtered $COUNT product row(s) for only=$ONLY (waypipe=$NEED_WP)"
          {
            echo "include=$ROWS"
            echo "needs_waypipe=$NEED_WP"
          } >>"$GITHUB_OUTPUT"

  waypipe-guest-cache:
    name: "Warm aarch64-linux container Waypipe"
    needs: matrix
    if: needs.matrix.outputs.needs_waypipe == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: ./.github/actions/setup-nix-flakehub
      - name: Build container Waypipe guest tree
        run: nix build ".#packages.aarch64-linux.waypipe-guest-root" --print-build-logs --no-link

  product:
    name: "${{ matrix.id }}"
    needs: [matrix, waypipe-guest-cache]
    if: always() && needs.matrix.result == 'success' && (needs.waypipe-guest-cache.result == 'success' || needs.waypipe-guest-cache.result == 'skipped')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      # --- Apple / Android xtask path ---
      - uses: ./.github/actions/setup-xtask
        if: matrix.kind == 'apple-sim' || matrix.kind == 'macos' || matrix.kind == 'android' || matrix.kind == 'ios-modeb'
        with:
          key: ${{ matrix.id }}
          android: ${{ matrix.kind == 'android' && 'true' || 'false' }}

      - name: Ensure Apple simulator SDKs
        if: matrix.kind == 'apple-sim'
        run: cargo xtask ci warm-sdk ${{ matrix.warm_sdk }}

      - name: Build watchOS device app (archive floor)
        if: matrix.kind == 'apple-sim' && matrix.device_first
        run: cargo xtask build watchos --device --release

      - name: Build Apple simulator / macOS app
        if: matrix.kind == 'apple-sim' || matrix.kind == 'macos'
        run: cargo xtask build ${{ matrix.target }} --release

      - name: Stage and audit Apple simulator
        if: matrix.kind == 'apple-sim'
        env:
          TARGET: ${{ matrix.target }}
          SDK: ${{ matrix.sdk }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          OUT_DIR="dist/$TARGET-sim"
          mkdir -p "$OUT_DIR"
          ditto ".build/xcode/$TARGET/Build/Products/Release-$SDK/Wawona.app" "$OUT_DIR/Wawona.app"
          if [[ "$TARGET" == "ios" ]]; then
            cargo xtask artifact graphics --platform ios --simulator "$OUT_DIR/Wawona.app"
            cargo xtask artifact ios mode-a-simulator "$OUT_DIR/Wawona.app"
            cargo xtask artifact ios-contract
          else
            cargo xtask artifact graphics --platform "$TARGET" "$OUT_DIR/Wawona.app"
            case "$TARGET" in
              ipados) cargo xtask artifact ios mode-a-simulator "$OUT_DIR/Wawona.app" ;;
              watchos) cargo xtask artifact watch-size "$OUT_DIR/Wawona.app" ;;
            esac
          fi
          if /usr/bin/strings "$OUT_DIR/Wawona.app/Wawona" | /usr/bin/grep -E 'IOMobileFramebuffer|WWN_MODE_B'; then
            echo "Mode B private strings leaked into the $TARGET store-shaped app" >&2
            exit 1
          fi
          printf '{"target":"%s","sha":"%s","artifact":"%s"}\n' \
            "$TARGET" "${{ github.sha }}" "$ARTIFACT" > "$OUT_DIR/product-manifest.json"
          echo "**PASS:** $TARGET product built and audited." >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: matrix.kind == 'apple-sim'
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.target }}-sim/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

      - name: Stage and verify macOS
        if: matrix.kind == 'macos'
        run: |
          set -euo pipefail
          APP=.build/xcode/macos/Build/Products/Release/Wawona.app
          test -x "$APP/Contents/MacOS/Wawona"
          test -d "$APP/Contents/Resources/share/X11/xkb/rules"
          cargo xtask artifact graphics --platform macos "$APP"
          cargo xtask artifact graphics --platform macos-desktop "$APP"
          for a in macos-app macos-desktop-host; do
            mkdir -p "dist/$a"
            ditto "$APP" "dist/$a/Wawona.app"
            printf '{"target":"macos","sha":"%s","artifact":"product-%s"}\n' "${{ github.sha }}" "$a" \
              > "dist/$a/product-manifest.json"
          done
          echo "**PASS:** macOS app built and audited." >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: matrix.kind == 'macos'
        with:
          name: product-macos-app
          path: dist/macos-app/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: matrix.kind == 'macos'
        with:
          name: product-macos-desktop-host
          path: dist/macos-desktop-host/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

      - name: Build Android debug APK
        if: matrix.kind == 'android'
        run: set -o pipefail; cargo xtask build android | tee build.out

      - name: Stage and verify Android APK
        if: matrix.kind == 'android'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$(tail -n1 build.out)" dist/Wawona.apk
          printf '{"target":"android","sha":"%s","artifact":"product-android-apk"}\n' "${{ github.sha }}" \
            > dist/product-manifest.json
          rm -rf dist/apk-unpacked
          mkdir -p dist/apk-unpacked
          unzip -q dist/Wawona.apk -d dist/apk-unpacked
          cargo xtask artifact graphics --platform android dist/apk-unpacked
          echo "**PASS:** Android APK built and audited." >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: matrix.kind == 'android'
        with:
          name: product-android-apk
          path: |
            dist/Wawona.apk
            dist/product-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Install ldid and dpkg
        if: matrix.kind == 'ios-modeb'
        run: brew install ldid dpkg

      - name: Build iOS Mode B tipa + debs
        if: matrix.kind == 'ios-modeb'
        run: cargo xtask package ios-mode-b

      - name: Verify and stage iOS Mode B
        if: matrix.kind == 'ios-modeb'
        run: |
          set -euo pipefail
          mkdir -p dist/ios-modeb
          cp dist/*.tipa dist/*-rootless.deb dist/ios-modeb/
          cargo xtask artifact ios mode-b dist/ios-modeb/*.tipa
          dpkg-deb -f dist/ios-modeb/*.deb Depends | grep -Fx 'firmware (>= 15.0)'
          printf '{"tipa_min_ios":"15.0","sileo_min_ios":"15.0","sha":"%s"}\n' "${{ github.sha }}" \
            > dist/ios-modeb/product-manifest.json
          echo "**PASS:** iOS Mode B artifacts built." >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: matrix.kind == 'ios-modeb'
        with:
          name: product-ios-modeb
          path: dist/ios-modeb/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # --- Linux AppImage (nix) ---
      - name: Free disk space
        if: matrix.kind == 'appimage'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          docker image prune -af || true

      - uses: ./.github/actions/setup-nix-flakehub
        if: matrix.kind == 'appimage'
        with:
          extra-conf: |
            build-dir = /nix/build
            sandbox = relaxed
            allow-import-from-derivation = true
            max-jobs = auto
            cores = 0
            trusted-users = runner root

      - name: Build AppImage
        if: matrix.kind == 'appimage'
        run: nix build ".#${{ matrix.attr }}" --print-build-logs --out-link result

      - uses: ./.github/actions/setup-xtask
        if: matrix.kind == 'appimage'
        with:
          key: ${{ matrix.id }}

      - name: Smoke-test and stage AppImage
        if: matrix.kind == 'appimage'
        run: cargo xtask artifact appimage result "${{ matrix.system }}"

      - name: Manifest AppImage
        if: matrix.kind == 'appimage'
        run: |
          set -euo pipefail
          mkdir -p dist
          OUT="$(readlink -f result)"
          {
            echo "{"
            echo "  \"attr\": \"wawona-appimage\","
            echo "  \"system\": \"${{ matrix.system }}\","
            echo "  \"sha\": \"${{ github.sha }}\","
            echo "  \"outPath\": \"$OUT\","
            echo "  \"artifact\": \"${{ matrix.artifact }}\""
            echo "}"
          } > dist/product-manifest.json
          echo "**PASS:** AppImage ${{ matrix.system }} built." >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: matrix.kind == 'appimage'
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.AppImage
            dist/product-manifest.json
          if-no-files-found: error
          retention-days: 14
