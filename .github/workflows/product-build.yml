name: "Build: products"

# Dispatcher for Ship / leak / bundled-clients / manual runs.
# Gate: products calls the thin per-platform workflows directly (no skip spam).
# `only` selects which slice workflows to run.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Product subset: all | ios-sim | ios-modeb | apple-family | android-apk | macos-app | appimage"
        type: string
        required: false
        default: "all"
      tip_key:
        description: "Tip concurrency key (branch name; empty = github.ref_name)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = caller sha)"
        type: string
        required: false
        default: ""
      tip_key:
        description: "Tip concurrency key (branch tip; empty = github.ref_name)"
        type: string
        required: false
        default: ""
      only:
        description: "Product subset: all | ios-sim | ios-modeb | apple-family | android-apk | macos-app | appimage"
        type: string
        required: false
        default: "all"

concurrency:
  group: product-build-${{ github.sha }}-${{ inputs.only || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  ios-sim:
    name: "iOS"
    if: ${{ (inputs.only || 'all') == 'all' || (inputs.only || 'all') == 'ios-sim' }}
    uses: ./.github/workflows/product-ios-sim.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.tip_key }}
    permissions:
      contents: read
      id-token: write

  ios-modeb:
    name: "iOS Mode B"
    if: ${{ (inputs.only || 'all') == 'all' || (inputs.only || 'all') == 'ios-modeb' }}
    uses: ./.github/workflows/product-ios-modeb.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.tip_key }}
    permissions:
      contents: read
      id-token: write

  apple-family:
    name: "iPadOS + tvOS + watchOS + visionOS"
    if: ${{ (inputs.only || 'all') == 'all' || (inputs.only || 'all') == 'apple-family' }}
    uses: ./.github/workflows/product-apple-family.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.tip_key }}
    permissions:
      contents: read
      id-token: write

  android-apk:
    name: "Android"
    if: ${{ (inputs.only || 'all') == 'all' || (inputs.only || 'all') == 'android-apk' }}
    uses: ./.github/workflows/product-android-apk.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.tip_key }}
    permissions:
      contents: read
      id-token: write

  macos-app:
    name: "macOS"
    if: ${{ (inputs.only || 'all') == 'all' || (inputs.only || 'all') == 'macos-app' }}
    uses: ./.github/workflows/product-macos-app.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.tip_key }}
    permissions:
      contents: read
      id-token: write

  appimage:
    name: "Linux AppImages"
    if: ${{ (inputs.only || 'all') == 'all' || (inputs.only || 'all') == 'appimage' }}
    uses: ./.github/workflows/product-appimage.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.tip_key }}
    permissions:
      contents: read
      id-token: write
