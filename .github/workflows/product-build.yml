name: "Build: products"

# Sole pure producer for ship/test binaries. Consumers (device-e2e, Release,
# Ship: beta (stores)) download GHA artifacts; FlakeHub Cache substitutes store paths.
# Do not schedule this on push directly. Device-gate / Release call it once
# per SHA via workflow_call.
#
# `only` lets device-gate fan out product jobs so iOS e2e can start when
# ios-sim finishes (without waiting for AppImages/macOS/Android).

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Product subset: all | ios-sim | apple-family | android-apk | macos-app | appimage"
        type: string
        required: false
        default: "all"
      tip_key:
        description: "Tip concurrency key (branch name; empty = github.ref_name)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = caller sha)"
        type: string
        required: false
        default: ""
      tip_key:
        description: "Tip concurrency key (branch tip; empty = github.ref_name)"
        type: string
        required: false
        default: ""
      only:
        description: "Product subset: all | ios-sim | apple-family | android-apk | macos-app | appimage"
        type: string
        required: false
        default: "all"

# Tip-only: cancel obsolete product builds when a newer tip gate supersedes.
concurrency:
  group: product-build-${{ inputs.tip_key || github.ref_name }}-${{ inputs.only || 'all' }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  NIXPKGS_ALLOW_UNFREE: "1"

jobs:
  ios-sim:
    name: "iOS sim .app"
    if: ${{ (inputs.only || 'all') == 'all' || (inputs.only || 'all') == 'ios-sim' }}
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Select Xcode
        id: xcode
        run: ./.github/scripts/select-xcode.sh

      # SDK check is cheap; set skip before Nix so build-app.nix never hits CDN.
      - name: Ensure iOS Simulator SDK (skip platform download when present)
        run: ./.github/scripts/warm-ios-simulator-sdk.sh ios

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
            max-jobs = auto
            cores = 0
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Build wawona-ios
        run: ./.github/scripts/nix-retry.sh nix build ".#wawona-ios" --print-build-logs --out-link result-ios

      - name: Stage + manifest
        run: |
          mkdir -p dist/ios-sim
          # Dereference store symlinks so the GHA artifact is self-contained.
          ditto result-ios/Wawona.app dist/ios-sim/Wawona.app
          test -d dist/ios-sim/Wawona.app
          OUT="$(readlink -f result-ios)"
          {
            echo "{"
            echo "  \"attr\": \"wawona-ios\","
            echo "  \"sha\": \"${{ github.sha }}\","
            echo "  \"outPath\": \"$OUT\","
            echo "  \"artifact\": \"product-ios-sim\""
            echo "}"
          } > dist/ios-sim/product-manifest.json
          # Note whether path looks cache-backed (best-effort).
          if nix path-info --json "$OUT" 2>/dev/null | grep -q cache.flakehub.com; then
            echo "flakehub_substitute=likely" >> "$GITHUB_STEP_SUMMARY"
          fi
          ls -la dist/ios-sim/

      - name: Verify store-safe iOS graphics bundle
        run: ./.github/scripts/verify-iland-graphics-bundle.sh --platform ios --simulator dist/ios-sim/Wawona.app

      - uses: actions/upload-artifact@v7
        with:
          name: product-ios-sim
          path: dist/ios-sim/
          if-no-files-found: error
          # Bundle ships hidden Mach-Os (e.g. bin/.foot-wrapped); upload-artifact
          # excludes dotfiles by default, which broke foot in the matrix gate.
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

  apple-family:
    name: "${{ matrix.label }} sim .app"
    if: ${{ (inputs.only || 'all') == 'all' || (inputs.only || 'all') == 'apple-family' }}
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ipados
            label: iPadOS
            attr: wawona-ipados
          - target: visionos
            label: visionOS
            attr: wawona-visionos
          - target: tvos
            label: tvOS
            attr: wawona-tvos
          - target: watchos
            label: watchOS
            attr: wawona-watchos
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      # Same skip-flag as ios-sim: build-app.nix still runs -downloadPlatform iOS
      # for any *simulator SDK (watch/tv/vision included). Warm the cell's SDK.
      - name: Ensure Apple simulator SDK (skip platform download when present)
        run: ./.github/scripts/warm-ios-simulator-sdk.sh ${{ matrix.target }}

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
            max-jobs = auto
            cores = 0
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Build ${{ matrix.label }} simulator app
        run: >-
          ./.github/scripts/nix-retry.sh nix build
          ".#${{ matrix.attr }}" --print-build-logs
          --out-link "result-${{ matrix.target }}"

      - name: Stage and audit ${{ matrix.label }}
        run: |
          OUT_DIR="dist/${{ matrix.target }}-sim"
          mkdir -p "$OUT_DIR"
          APP="$(find -L "result-${{ matrix.target }}" -type d -name '*.app' -print -quit)"
          test -n "$APP"
          ditto "$APP" "$OUT_DIR/Wawona.app"
          if [ "${{ matrix.target }}" = "tvos" ]; then
            export WWN_TVOS_GPU=1
          fi
          ./.github/scripts/verify-iland-graphics-bundle.sh \
            --platform "${{ matrix.target }}" "$OUT_DIR/Wawona.app"
          printf '{"attr":"%s","sha":"%s","artifact":"product-%s-sim"}\n' \
            "${{ matrix.attr }}" "${{ github.sha }}" "${{ matrix.target }}" \
            > "$OUT_DIR/product-manifest.json"

      - uses: actions/upload-artifact@v7
        with:
          name: product-${{ matrix.target }}-sim
          path: dist/${{ matrix.target }}-sim/
          if-no-files-found: error
          # Preserve hidden Mach-Os (e.g. bin/.foot-wrapped) in the bundle.
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

  android-apk:
    name: "Android debug APK"
    if: ${{ (inputs.only || 'all') == 'all' || (inputs.only || 'all') == 'android-apk' }}
    # macOS (not ubuntu): Android cross deps (e.g. zsh-android) fail configure on
    # linux; runner OS version is irrelevant (Nix supplies NDK). Aligned to
    # macos-26 with the Apple product jobs.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
            max-jobs = auto
            cores = 0
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Build wawona-android
        run: ./.github/scripts/nix-retry.sh nix build ".#wawona-android" --print-build-logs --out-link result-android

      - name: Stage APK
        run: |
          mkdir -p dist
          cp -L result-android/bin/Wawona.apk dist/Wawona.apk
          OUT="$(readlink -f result-android)"
          {
            echo "{"
            echo "  \"attr\": \"wawona-android\","
            echo "  \"sha\": \"${{ github.sha }}\","
            echo "  \"outPath\": \"$OUT\","
            echo "  \"artifact\": \"product-android-apk\""
            echo "}"
          } > dist/product-manifest.json
          ls -lh dist/Wawona.apk

      - name: Verify Play-safe Android graphics bundle
        run: |
          rm -rf dist/apk-unpacked
          mkdir -p dist/apk-unpacked
          unzip -q dist/Wawona.apk -d dist/apk-unpacked
          ./.github/scripts/verify-iland-graphics-bundle.sh --platform android dist/apk-unpacked

      - uses: actions/upload-artifact@v7
        with:
          name: product-android-apk
          path: |
            dist/Wawona.apk
            dist/product-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos-app:
    name: "macOS .app"
    if: ${{ (inputs.only || 'all') == 'all' || (inputs.only || 'all') == 'macos-app' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
            max-jobs = auto
            cores = 0
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Build wawona-macos
        run: ./.github/scripts/nix-retry.sh nix build ".#wawona-macos" --print-build-logs --out-link result-macos

      - name: Build wawona-macos-desktop-host
        run: ./.github/scripts/nix-retry.sh nix build ".#wawona-macos-desktop-host" --print-build-logs --out-link result-macos-desktop-host

      - name: Stage app
        run: |
          mkdir -p dist/macos-app
          # Nix .app trees keep store symlinks (niri/fuzzel under Resources/bin).
          # GHA artifacts must be self-contained. Dereference before upload.
          ditto result-macos/Applications/Wawona.app dist/macos-app/Wawona.app
          # Artifact zip can drop +x; restore exec bits on launcher + tools.
          APP=dist/macos-app/Wawona.app
          chmod -R u+w "$APP"
          find "$APP/Contents/MacOS" -type f -exec chmod +x {} + 2>/dev/null || true
          find "$APP/Contents/Resources/bin" -type f -exec chmod +x {} + 2>/dev/null || true
          find "$APP" \( -name '*.dylib' -o -name '*.so' \) -type f -exec chmod +x {} + 2>/dev/null || true
          NIRI="$APP/Contents/Resources/bin/niri"
          FUZZEL="$APP/Contents/Resources/bin/fuzzel"
          MAIN="$APP/Contents/MacOS/Wawona"
          test -f "$NIRI" || { echo "FAIL: staged niri missing at $NIRI"; ls -laR "$APP/Contents/Resources/bin" || true; exit 1; }
          test -f "$FUZZEL" || { echo "FAIL: staged fuzzel missing at $FUZZEL"; exit 1; }
          test -f "$MAIN" || { echo "FAIL: staged MacOS/Wawona missing"; exit 1; }
          chmod +x "$NIRI" "$FUZZEL" "$MAIN"
          test -x "$NIRI" && test -x "$FUZZEL" && test -x "$MAIN"
          # Bundle XKB data so nested niri works after artifact download (no nix store).
          XKB_OUT="$(nix build --no-link --print-out-paths nixpkgs#xkeyboard_config)"
          mkdir -p "$APP/Contents/Resources/share/X11"
          ditto "$XKB_OUT/share/X11/xkb" "$APP/Contents/Resources/share/X11/xkb"
          test -d "$APP/Contents/Resources/share/X11/xkb/rules"
          OUT="$(readlink -f result-macos)"
          {
            echo "{"
            echo "  \"attr\": \"wawona-macos\","
            echo "  \"sha\": \"${{ github.sha }}\","
            echo "  \"outPath\": \"$OUT\","
            echo "  \"artifact\": \"product-macos-app\""
            echo "}"
          } > dist/macos-app/product-manifest.json
          ls -la dist/macos-app/
          ls -la dist/macos-app/Wawona.app/Contents/Resources/bin/ | head -40

      - name: Verify macOS Mode B bundles
        run: |
          ./.github/scripts/verify-iland-graphics-bundle.sh --platform macos dist/macos-app/Wawona.app
          mkdir -p dist/macos-desktop-host
          ditto result-macos-desktop-host/Applications/Wawona.app \
            dist/macos-desktop-host/Wawona.app
          ./.github/scripts/verify-iland-graphics-bundle.sh --platform macos-desktop \
            dist/macos-desktop-host/Wawona.app
          OUT="$(readlink -f result-macos-desktop-host)"
          {
            echo "{"
            echo "  \"attr\": \"wawona-macos-desktop-host\","
            echo "  \"sha\": \"${{ github.sha }}\","
            echo "  \"outPath\": \"$OUT\","
            echo "  \"artifact\": \"product-macos-desktop-host\""
            echo "}"
          } > dist/macos-desktop-host/product-manifest.json

      - uses: actions/upload-artifact@v7
        with:
          name: product-macos-app
          path: dist/macos-app/
          if-no-files-found: error
          # Preserve hidden Mach-Os (e.g. bin/.foot-wrapped) in the bundle;
          # upload-artifact drops dotfiles by default, which broke foot.
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: product-macos-desktop-host
          path: dist/macos-desktop-host/
          if-no-files-found: error
          # Preserve hidden Mach-Os (e.g. bin/.foot-wrapped) in the bundle.
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

  appimage:
    name: "Linux AppImage (${{ matrix.system }})"
    if: ${{ (inputs.only || 'all') == 'all' || (inputs.only || 'all') == 'appimage' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          docker image prune -af || true

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            build-dir = /nix/build
            sandbox = relaxed
            allow-import-from-derivation = true
            max-jobs = auto
            cores = 0
            trusted-users = runner root
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Build AppImage
        run: |
          ./.github/scripts/nix-retry.sh \
            nix build ".#packages.${{ matrix.system }}.wawona-appimage" --print-build-logs --out-link result

      - name: Smoke-test and stage AppImage
        run: ./.github/scripts/appimage-smoke.sh result "${{ matrix.system }}"

      - name: Manifest
        run: |
          OUT="$(readlink -f result)"
          {
            echo "{"
            echo "  \"attr\": \"wawona-appimage\","
            echo "  \"system\": \"${{ matrix.system }}\","
            echo "  \"sha\": \"${{ github.sha }}\","
            echo "  \"outPath\": \"$OUT\","
            echo "  \"artifact\": \"product-appimage-${{ matrix.system }}\""
            echo "}"
          } > dist/product-manifest.json

      - uses: actions/upload-artifact@v7
        with:
          name: product-appimage-${{ matrix.system }}
          path: |
            dist/*.AppImage
            dist/product-manifest.json
          if-no-files-found: error
          retention-days: 14
