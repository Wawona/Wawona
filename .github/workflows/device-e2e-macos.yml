name: "Test: macOS opens"

# GUI smoke for one platform. Called by Gate: products. No lane filter: every
# job here always runs (no skip spam in the Actions UI).

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        type: string
        required: false
        default: ""
      products_ready:
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: false
        default: ""
      tip_key:
        type: string
        required: false
        default: ""
      products_ready:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: device-e2e-macos-${{ github.sha }}-${{ inputs.products_ready && 'products' || 'standalone' }}
  cancel-in-progress: false

env:
  AGENT_DEVICE_VERSION: "0.18.3"

jobs:
  catalog-and-macos-fuzzel:
    name: "Catalog + macOS nested niri/fuzzel"
    # Must match product-build macos-app runner: macos-26 builds are
    # min-version 26 and abort on macos-15 ("newer than running OS").
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Applications catalog smoke (headless)
        run: chmod +x ./scripts/applications-catalog-smoke.sh && ./scripts/applications-catalog-smoke.sh

      - name: Build Wawona.app (macOS)
        if: ${{ !inputs.products_ready }}
        run: ./.github/scripts/nix-retry.sh nix build ".#wawona-macos" --print-build-logs --out-link result-macos

      - name: Download product-macos-app
        if: ${{ inputs.products_ready }}
        uses: actions/download-artifact@v8
        with:
          name: product-macos-app
          path: product-macos-app/

      - name: Stage macOS app from product artifact
        if: ${{ inputs.products_ready }}
        run: |
          mkdir -p result-macos/Applications
          if [[ -d product-macos-app/Wawona.app ]]; then
            ditto product-macos-app/Wawona.app result-macos/Applications/Wawona.app
          else
            found="$(find product-macos-app -name 'Wawona.app' -type d | head -1)"
            [[ -n "$found" ]] || { echo "Wawona.app missing"; exit 1; }
            ditto "$found" result-macos/Applications/Wawona.app
          fi
          APP=result-macos/Applications/Wawona.app
          chmod -R u+w "$APP"
          find "$APP/Contents/MacOS" -type f -exec chmod +x {} + 2>/dev/null || true
          find "$APP/Contents/Resources/bin" -type f -exec chmod +x {} + 2>/dev/null || true
          find "$APP" \( -name '*.dylib' -o -name '*.so' \) -type f -exec chmod +x {} + 2>/dev/null || true
          test -x "$APP/Contents/MacOS/Wawona" \
            || { echo "FAIL: MacOS/Wawona not executable"; ls -la "$APP/Contents/MacOS" || true; exit 1; }
          test -x "$APP/Contents/Resources/bin/niri" \
            || { echo "FAIL: niri missing/not executable in product-macos-app"; ls -la "$APP/Contents/Resources/bin" || true; exit 1; }

      # Nested niri/fuzzel omitted from Gate: products. GHA macos runners often
      # SIGTERM the job mid-GUI (exit 143) even with continue-on-error, which
      # still fails the reusable workflow. Catalog smoke above is the hard check.
      # Re-enable via Watch: graphics nightly / local scripts/niri-fuzzel-smoke-macos.sh.
      - name: Nested niri + fuzzel smoke (macOS)
        if: ${{ false }}
        env:
          WAWONA_MACOS_APP: result-macos/Applications/Wawona.app
          WAWONA_FUZZEL_REQUIRE_MACOS: "1"
        run: |
          chmod +x ./scripts/niri-fuzzel-smoke-macos.sh ./scripts/niri-smoke-macos.sh
          ./scripts/niri-fuzzel-smoke-macos.sh "$WAWONA_MACOS_APP"

      - name: Upload macOS fuzzel artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-e2e-macos-fuzzel
          path: .agent-device/test-artifacts/
          if-no-files-found: warn

