name: "Test: macOS opens"

# Gate: products macOS runtime. Catalog smoke + compositor-host client smoke.
# No agent-device CLI on runners.

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        type: string
        required: false
        default: ""
      products_ready:
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: false
        default: ""
      tip_key:
        type: string
        required: false
        default: ""
      products_ready:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: device-e2e-macos-${{ github.sha }}-${{ inputs.products_ready && 'products' || 'standalone' }}
  cancel-in-progress: false

jobs:
  catalog-and-macos-fuzzel:
    name: "macOS: catalog + compositor-host smoke"
    # Must match product-build macos-app runner: macos-27 builds are
    # min-version 27 and abort on an older macOS ("newer than running OS").
    runs-on: macos-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
      - uses: DeterminateSystems/flakehub-cache-action@f00fba8dc0949d63cbbb7d33da7912417d588d75 # v3

      - uses: ./.github/actions/setup-xtask
        with:
          key: macos

      - name: Applications catalog smoke (headless)
        run: cargo xtask lab apps-catalog

      - name: Build Wawona.app (macOS)
        if: ${{ !inputs.products_ready }}
        run: |
          cargo xtask build macos --release
          mkdir -p result-macos/Applications
          ditto .build/xcode/macos/Build/Products/Release/Wawona.app result-macos/Applications/Wawona.app

      - name: Download product-macos-app
        if: ${{ inputs.products_ready }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: product-macos-app
          path: product-macos-app/

      - name: Stage macOS app from product artifact
        if: ${{ inputs.products_ready }}
        run: |
          mkdir -p result-macos/Applications
          if [[ -d product-macos-app/Wawona.app ]]; then
            ditto product-macos-app/Wawona.app result-macos/Applications/Wawona.app
          else
            found="$(find product-macos-app -name 'Wawona.app' -type d | head -1)"
            [[ -n "$found" ]] || { echo "Wawona.app missing"; exit 1; }
            ditto "$found" result-macos/Applications/Wawona.app
          fi
          APP=result-macos/Applications/Wawona.app
          chmod -R u+w "$APP"
          find "$APP/Contents/MacOS" -type f -exec chmod +x {} + 2>/dev/null || true
          find "$APP/Contents/Resources/bin" -type f -exec chmod +x {} + 2>/dev/null || true
          find "$APP" \( -name '*.dylib' -o -name '*.so' \) -type f -exec chmod +x {} + 2>/dev/null || true
          test -x "$APP/Contents/MacOS/Wawona" \
            || { echo "FAIL: MacOS/Wawona not executable"; ls -la "$APP/Contents/MacOS" || true; exit 1; }
          # Keep-set only (optional-software: niri/fuzzel/weston install later).
          BIN="$APP/Contents/Resources/bin"
          ls -la "$BIN" 2>/dev/null || true
          keep_ok=0
          for keep in wawona-shell zsh fastfetch; do
            if [[ -x "$BIN/$keep" ]]; then
              keep_ok=1
              break
            fi
          done
          [[ "$keep_ok" -eq 1 ]] \
            || { echo "FAIL: keep-set shell tool missing in product-macos-app"; ls -la "$BIN" || true; exit 1; }

      - name: macOS compositor-host runtime smoke
        env:
          WAWONA_APP_BIN: result-macos/Applications/Wawona.app/Contents/MacOS/Wawona
        run: |
          cargo xtask lab macos-runtime

      - name: Upload macOS runtime artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: device-e2e-macos
          path: /tmp/wawona-smoke-host.log
          if-no-files-found: warn

