name: "Build: macOS app"

# Thin product producer (one platform slice). Called by Gate: products / Ship.
# No `only` filter: every job here always runs. Keeps Actions UI free of skip spam.

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = this SHA)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = caller sha)"
        type: string
        required: false
        default: ""
      tip_key:
        description: "Unused; kept for caller compatibility"
        type: string
        required: false
        default: ""

concurrency:
  group: product-macos-app-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  NIXPKGS_ALLOW_UNFREE: "1"

jobs:
  waypipe-guest-cache:
    name: "Warm aarch64-linux container Waypipe"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: ./.github/actions/setup-nix-flakehub

      - name: Build container Waypipe guest tree
        run: nix build ".#packages.aarch64-linux.waypipe-guest-root" --print-build-logs --no-link

  macos-app:
    name: "macOS .app"
    runs-on: macos-27
    timeout-minutes: 90
    needs: [waypipe-guest-cache]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: ./.github/actions/setup-xtask
        with:
          key: macos

      - name: Build Wawona-macOS
        run: cargo xtask build macos --release

      # One macOS product: Mode A presents in-window and the same bundle
      # carries the SIP-gated Mode B dylib (macOS is not store constrained).
      - name: Stage and verify
        run: |
          APP=.build/xcode/macos/Build/Products/Release/Wawona.app
          test -x "$APP/Contents/MacOS/Wawona"
          test -d "$APP/Contents/Resources/share/X11/xkb/rules"
          cargo xtask artifact graphics --platform macos "$APP"
          cargo xtask artifact graphics --platform macos-desktop "$APP"
          for a in macos-app macos-desktop-host; do
            mkdir -p "dist/$a"
            ditto "$APP" "dist/$a/Wawona.app"
            printf '{"target":"macos","sha":"%s","artifact":"product-%s"}\n' "${{ github.sha }}" "$a" \
              > "dist/$a/product-manifest.json"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: product-macos-app
          path: dist/macos-app/
          if-no-files-found: error
          # Preserve hidden Mach-Os (e.g. bin/.foot-wrapped) in the bundle;
          # upload-artifact drops dotfiles by default, which broke foot.
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: product-macos-desktop-host
          path: dist/macos-desktop-host/
          if-no-files-found: error
          # Preserve hidden Mach-Os (e.g. bin/.foot-wrapped) in the bundle.
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

