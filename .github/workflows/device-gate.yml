name: "Gate: products"

# Single scheduler for product binaries + Build: GUI smoke on development/master.
# Product jobs are called separately so iOS e2e can start when ios-sim is ready
# (without waiting for AppImages / macOS / Android).

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to build/test (nightly passes development)"
        type: string
        required: false
        default: ""
  push:
    branches: [development, master]
    paths:
      - "src/**"
      - "android/**"
      - "Sources/**"
      - "dependencies/**"
      - "flake.nix"
      - "flake.lock"
      - ".agent-device/**"
      - "scripts/agent-device-smoke.sh"
      # SSH stack (libssh2 CLI / OpenSSH Android / Settings) — sparse shell-cli replay
      - "src/platform/android/android_jni.c"
      - "src/platform/macos/ui/Settings/WWNPreferences.m"
      - "src/platform/macos/ui/Settings/WWNPreferencesManager.m"
      - "src/platform/watchos/WWNWatchStubs.c"
      - "src/platform/ios/WWNAppleMobileOptionalStubs.c"
      - ".github/scripts/verify-ios-shell-tools.py"
      - ".github/scripts/verify-android-shell-tools.py"
      - ".github/scripts/verify-ssh-backends.py"
      - "scripts/agent-device-fuzzel-smoke.sh"
      - "scripts/agent-device-set-niri-android.sh"
      - "scripts/agent-device-set-niri-ios.sh"
      - "scripts/niri-smoke-macos.sh"
      - "scripts/niri-fuzzel-smoke-macos.sh"
      - "scripts/applications-catalog-smoke.sh"
      # Leak-idle + bundled-clients harness: Gate: products calls leak-idle with
      # products_ready, so harness-only edits must re-run the gate (else they
      # green Gate: packages and leave Gate: products on the previous SHA).
      - "scripts/leak-idle-gate.sh"
      - "scripts/lib/leak-idle-measure.sh"
      - "scripts/bundled-clients-matrix-gate.sh"
      - "scripts/lib/bundled-clients-catalog.sh"
      # Shared harness libs both gate scripts (and agent-device-smoke) source.
      - "scripts/lib/android-ad-scale.sh"
      - "scripts/lib/agent-device-ios-system-ui.sh"
      - ".github/workflows/leak-idle-gate.yml"
      - ".github/workflows/bundled-clients-matrix.yml"
      - ".github/workflows/device-e2e.yml"
      - ".github/workflows/device-gate.yml"
      - ".github/workflows/product-build.yml"
      - ".github/scripts/resolve-product-artifacts.sh"
      - ".github/scripts/select-xcode.sh"
      - ".github/scripts/warm-ios-simulator-sdk.sh"
      - ".github/ci-package-matrix.json"

# Tip-only: one in-flight gate per branch tip (development/master). Nightly
# passes checkout_ref=development so it shares the development tip group.
concurrency:
  group: device-gate-${{ inputs.checkout_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  product-ios:
    name: Product iOS sim
    uses: ./.github/workflows/product-build.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.checkout_ref || github.ref_name }}
      only: ios-sim
    permissions:
      contents: read
      id-token: write

  product-android:
    name: Product Android APK
    uses: ./.github/workflows/product-build.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.checkout_ref || github.ref_name }}
      only: android-apk
    permissions:
      contents: read
      id-token: write

  product-macos:
    name: Product macOS app
    uses: ./.github/workflows/product-build.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.checkout_ref || github.ref_name }}
      only: macos-app
    permissions:
      contents: read
      id-token: write

  product-appimage:
    name: Product AppImages
    uses: ./.github/workflows/product-build.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.checkout_ref || github.ref_name }}
      only: appimage
    permissions:
      contents: read
      id-token: write

  e2e-ios:
    name: "Build: GUI smoke iOS"
    needs: product-ios
    uses: ./.github/workflows/device-e2e.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.checkout_ref || github.ref_name }}
      products_ready: true
      lanes: ios
    permissions:
      contents: read
      id-token: write
      actions: read

  e2e-android:
    name: "Build: GUI smoke Android"
    needs: product-android
    uses: ./.github/workflows/device-e2e.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.checkout_ref || github.ref_name }}
      products_ready: true
      lanes: android
    permissions:
      contents: read
      id-token: write
      actions: read

  e2e-macos:
    name: "Build: GUI smoke macOS"
    needs: product-macos
    uses: ./.github/workflows/device-e2e.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.checkout_ref || github.ref_name }}
      products_ready: true
      lanes: macos
    permissions:
      contents: read
      id-token: write
      actions: read

  e2e-linux:
    name: "Build: GUI smoke Linux catalog"
    uses: ./.github/workflows/device-e2e.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.checkout_ref || github.ref_name }}
      products_ready: true
      lanes: linux
    permissions:
      contents: read
      id-token: write
      actions: read

  # Advisory memory plateau — reuses product-* artifacts (no second product-build).
  # Soft-fail lives inside leak-idle-gate.yml (continue-on-error is invalid on uses: callers).
  leak-idle:
    name: "Watch: idle memory"
    needs: [product-ios, product-android, product-macos]
    if: ${{ always() && !cancelled() && needs.product-ios.result == 'success' && needs.product-android.result == 'success' && needs.product-macos.result == 'success' }}
    uses: ./.github/workflows/leak-idle-gate.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.checkout_ref || github.ref_name }}
      products_ready: true
      lanes: all
    permissions:
      contents: read
      id-token: write
      actions: read

  # Single rollup so AppImage product failures still fail the gate (no e2e consumer).
  # Intentionally does not need leak-idle (advisory; continue-on-error above).
  gate:
    name: "Gate: products"
    needs:
      - e2e-ios
      - e2e-android
      - e2e-macos
      - e2e-linux
      - product-appimage
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Gate: products green (Build: products + Build: GUI smoke)"
