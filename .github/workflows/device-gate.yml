name: "Gate: products"

# Builds every product, runs smoke, then one RESULT job.
# Open RESULT first. PASS = tip can promote (with Verification + Gate: packages).
# Soft supersede skips obsolete SHAs without Cancelled. Docs: docs/ci.md.

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to build/test (nightly passes development)"
        type: string
        required: false
        default: ""
  push:
    branches: [development, master]
    paths:
      - "src/**"
      - "android/**"
      - "Sources/**"
      - "dependencies/**"
      - "dependencies/wawona/workspace-src.nix"
      - "scripts/lib/expand_uutils_workspace_deps.py"
      - "scripts/prepare-cargo-path-deps.sh"
      - "flake.nix"
      - "flake.lock"
      - ".agent-device/**"
      - "scripts/agent-device-smoke.sh"
      - "scripts/ci-ios-xcuitest-smoke.sh"
      - "scripts/ci-android-espresso-smoke.sh"
      - "scripts/ci-macos-compat-smoke.sh"
      - "src/platform/android/android_jni.c"
      - "src/platform/macos/ui/Settings/WWNPreferencesSectionsBuilder.m"
      - "Sources/WawonaApple/Settings/**"
      - "src/platform/watchos/WWNWatchStubs.c"
      - "src/platform/ios/WWNAppleMobileOptionalStubs.c"
      - ".github/scripts/verify-ios-shell-tools.py"
      - ".github/scripts/verify-android-shell-tools.py"
      - ".github/scripts/verify-ssh-backends.py"
      - "scripts/agent-device-fuzzel-smoke.sh"
      - "scripts/agent-device-set-niri-android.sh"
      - "scripts/agent-device-set-niri-ios.sh"
      - "scripts/agent-device-set-client-ios.sh"
      - "scripts/niri-smoke-macos.sh"
      - "scripts/niri-fuzzel-smoke-macos.sh"
      - "scripts/applications-catalog-smoke.sh"
      - "scripts/leak-idle-gate.sh"
      - "scripts/lib/leak-idle-measure.sh"
      - "scripts/bundled-clients-matrix-gate.sh"
      - "scripts/lib/bundled-clients-catalog.sh"
      - "scripts/lib/android-ad-scale.sh"
      - "scripts/lib/agent-device-ios-system-ui.sh"
      - ".github/workflows/leak-idle-gate.yml"
      - ".github/workflows/bundled-clients-matrix.yml"
      - ".github/workflows/device-e2e.yml"
      - ".github/workflows/device-e2e-ios.yml"
      - ".github/workflows/device-e2e-android.yml"
      - ".github/workflows/device-e2e-macos.yml"
      - ".github/workflows/device-e2e-linux.yml"
      - ".github/workflows/device-gate.yml"
      - ".github/workflows/product-build.yml"
      - ".github/workflows/product-ios-sim.yml"
      - ".github/workflows/product-ios-modeb.yml"
      - ".github/workflows/product-apple-family.yml"
      - ".github/workflows/product-android-apk.yml"
      - ".github/workflows/product-macos-app.yml"
      - ".github/workflows/product-appimage.yml"
      - ".github/scripts/resolve-product-artifacts.sh"
      - ".github/scripts/select-xcode.sh"
      - ".github/scripts/warm-ios-simulator-sdk.sh"
      - ".github/scripts/ci-require-branch-tip.sh"
      - ".github/ci-package-matrix.json"

concurrency:
  group: device-gate-${{ inputs.checkout_ref || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  tip:
    name: "Check: is this the latest commit?"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      is_tip: ${{ steps.tip.outputs.is_tip }}
      reason: ${{ steps.tip.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: tip
        env:
          WAWONA_CI_FORCE_TIP: ${{ github.event_name == 'workflow_dispatch' && '1' || (inputs.checkout_ref != '' && inputs.checkout_ref != github.sha && '1' || '') }}
          WAWONA_CI_INTENDED_REF: ${{ inputs.checkout_ref }}
        run: bash .github/scripts/ci-require-branch-tip.sh

  product-ios:
    name: "Build: iOS"
    needs: tip
    if: needs.tip.outputs.is_tip == 'true'
    uses: ./.github/workflows/product-ios-sim.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.checkout_ref || github.ref_name }}
    permissions:
      contents: read
      id-token: write

  product-apple-family:
    name: "Build: iPadOS tvOS watchOS visionOS"
    needs: tip
    if: needs.tip.outputs.is_tip == 'true'
    uses: ./.github/workflows/product-apple-family.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.checkout_ref || github.ref_name }}
    permissions:
      contents: read
      id-token: write

  product-android:
    name: "Build: Android"
    needs: tip
    if: needs.tip.outputs.is_tip == 'true'
    uses: ./.github/workflows/product-android-apk.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.checkout_ref || github.ref_name }}
    permissions:
      contents: read
      id-token: write

  product-macos:
    name: "Build: macOS"
    needs: tip
    if: needs.tip.outputs.is_tip == 'true'
    uses: ./.github/workflows/product-macos-app.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.checkout_ref || github.ref_name }}
    permissions:
      contents: read
      id-token: write

  product-appimage:
    name: "Build: Linux AppImages"
    needs: tip
    if: needs.tip.outputs.is_tip == 'true'
    uses: ./.github/workflows/product-appimage.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.checkout_ref || github.ref_name }}
    permissions:
      contents: read
      id-token: write

  e2e-ios:
    name: "Test: iOS opens"
    needs: [tip, product-ios]
    if: needs.tip.outputs.is_tip == 'true'
    uses: ./.github/workflows/device-e2e-ios.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.checkout_ref || github.ref_name }}
      products_ready: true
    permissions:
      contents: read
      id-token: write
      actions: read

  e2e-android:
    name: "Test: Android opens"
    needs: [tip, product-android]
    if: needs.tip.outputs.is_tip == 'true'
    uses: ./.github/workflows/device-e2e-android.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.checkout_ref || github.ref_name }}
      products_ready: true
    permissions:
      contents: read
      id-token: write
      actions: read

  e2e-macos:
    name: "Test: macOS opens"
    needs: [tip, product-macos]
    if: needs.tip.outputs.is_tip == 'true'
    uses: ./.github/workflows/device-e2e-macos.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.checkout_ref || github.ref_name }}
      products_ready: true
    permissions:
      contents: read
      id-token: write
      actions: read

  e2e-linux:
    name: "Test: Linux catalog"
    needs: tip
    if: needs.tip.outputs.is_tip == 'true'
    uses: ./.github/workflows/device-e2e-linux.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.checkout_ref || github.ref_name }}
      products_ready: true
    permissions:
      contents: read
      id-token: write
      actions: read

  leak-idle:
    name: "Watch: memory after idle (advisory)"
    needs: [tip, product-ios, product-android, product-macos]
    if: >-
      always()
      && !cancelled()
      && needs.tip.outputs.is_tip == 'true'
      && needs.product-ios.result == 'success'
      && needs.product-android.result == 'success'
      && needs.product-macos.result == 'success'
    uses: ./.github/workflows/leak-idle-gate.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
      tip_key: ${{ inputs.checkout_ref || github.ref_name }}
      products_ready: true
      lanes: all
    permissions:
      contents: read
      id-token: write
      actions: read

  gate:
    name: "RESULT: PASS or FAIL?"
    needs:
      - tip
      - e2e-ios
      - e2e-android
      - e2e-macos
      - e2e-linux
      - product-appimage
      - product-apple-family
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Not the latest commit
        if: needs.tip.outputs.is_tip != 'true'
        run: |
          echo "::notice::SKIP. Newer commit exists. Ignore this run."
          {
            echo "# RESULT"
            echo ""
            echo "**SKIP** - not the latest commit."
            echo ""
            echo "Open the newest Gate: products run instead."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Scorecard
        if: needs.tip.outputs.is_tip == 'true'
        env:
          E2E_IOS: ${{ needs.e2e-ios.result }}
          E2E_ANDROID: ${{ needs.e2e-android.result }}
          E2E_MACOS: ${{ needs.e2e-macos.result }}
          E2E_LINUX: ${{ needs.e2e-linux.result }}
          APPIMAGE: ${{ needs.product-appimage.result }}
          APPLE_FAMILY: ${{ needs.product-apple-family.result }}
        run: |
          set -euo pipefail
          word() {
            case "$1" in
              success) echo PASS ;;
              failure|cancelled) echo FAIL ;;
              skipped) echo SKIP ;;
              *) echo "$1" ;;
            esac
          }
          fail=0
          {
            echo "# RESULT"
            echo ""
            echo "Read this table. Green tip needs every row PASS."
            echo ""
            echo "| What | Result |"
            echo "|---|---|"
            echo "| iOS build + opens | $(word "$E2E_IOS") |"
            echo "| Android build + opens | $(word "$E2E_ANDROID") |"
            echo "| macOS build + opens | $(word "$E2E_MACOS") |"
            echo "| Linux catalog | $(word "$E2E_LINUX") |"
            echo "| Linux AppImages | $(word "$APPIMAGE") |"
            echo "| iPadOS + tvOS + watchOS + visionOS | $(word "$APPLE_FAMILY") |"
            echo ""
          } >>"$GITHUB_STEP_SUMMARY"
          for pair in \
            "iOS:$E2E_IOS" \
            "Android:$E2E_ANDROID" \
            "macOS:$E2E_MACOS" \
            "Linux catalog:$E2E_LINUX" \
            "Linux AppImages:$APPIMAGE" \
            "Apple family:$APPLE_FAMILY"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            echo "$name -> $(word "$result")"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name failed (got $result). Fix that before promoting."
              fail=1
            fi
          done
          if [[ "$fail" -eq 0 ]]; then
            {
              echo "## Verdict"
              echo ""
              echo "**PASS** - all products OK. Tip can promote when Verification and Gate: packages are also green."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "RESULT: PASS"
          else
            {
              echo "## Verdict"
              echo ""
              echo "**FAIL** - fix the red row(s). Do not promote."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "RESULT: FAIL"
          fi
          exit "$fail"
