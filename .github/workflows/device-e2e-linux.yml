name: "Test: Linux catalog"

# GUI smoke for one platform. Called by Gate: products. No lane filter: every
# job here always runs (no skip spam in the Actions UI).

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        type: string
        required: false
        default: ""
      products_ready:
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: false
        default: ""
      tip_key:
        type: string
        required: false
        default: ""
      products_ready:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: device-e2e-linux-${{ github.sha }}-${{ inputs.products_ready && 'products' || 'standalone' }}
  cancel-in-progress: false

env:
  AGENT_DEVICE_VERSION: "0.18.3"

jobs:
  linux-catalog:
    name: "Linux: applications catalog smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
      - uses: DeterminateSystems/flakehub-cache-action@f00fba8dc0949d63cbbb7d33da7912417d588d75 # v3

      - uses: ./.github/actions/setup-xtask
        with:
          key: linux-catalog

      - name: Applications catalog smoke
        run: cargo xtask lab apps-catalog
