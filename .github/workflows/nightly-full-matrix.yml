name: Nightly full matrix

# Deep / slow gates (L3–L4 + capability). Push/PR fast path: nix.yml + device-e2e.
# Always exercises the development tip so WIP is deep-tested before promote.
# docs/ci.md · FlakeHub Cache on every Nix job.

on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: nightly-full-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  WAWONA_NIGHTLY_REF: development

jobs:
  graphics-smoke:
    name: "macOS (arm64): graphics driver-sanity"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WAWONA_NIGHTLY_REF }}
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Graphics validate smoke (check)
        run: nix build ".#checks.aarch64-darwin.graphics-validate-smoke" --print-build-logs

  protocol-status-drift:
    name: "Linux: protocol manifest drift"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WAWONA_NIGHTLY_REF }}
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Ensure Cargo path dependencies
        run: |
          ./scripts/ensure-waypipe.sh
          ./scripts/ensure-coreutils.sh
      - name: Regenerate + assert protocol-status.md is current
        run: |
          WWN_WRITE_PROTOCOL_STATUS=1 nix develop -c cargo test --lib \
            tests::protocol_matrix::test_generate_protocol_status_manifest -- --exact --nocapture
          git diff --exit-code -- docs/protocol-status.md \
            || { echo "::error::docs/protocol-status.md stale; run scripts/gen-protocol-status.sh"; exit 1; }

  # Cross-platform GUI parity/e2e on development tip (product-build → e2e).
  ui-parity:
    name: "Layer 3: cross-platform UI parity"
    uses: ./.github/workflows/device-gate.yml
    with:
      checkout_ref: development
    permissions:
      contents: read
      id-token: write
      actions: read

  capability-lane:
    name: "Layer 2: nested Weston + XWayland capability"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WAWONA_NIGHTLY_REF }}
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Nested Weston + XWayland capability smoke
        run: ./scripts/ci-capability-lane.sh
