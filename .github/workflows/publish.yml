name: publish-ios

# Legacy manual TestFlight upload. Primary automation:
#   master push → release-beta.yml (TestFlight + Play internal + Linux AppImages)
#   v* tag      → release.yml (GitHub Release assets)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  testflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Active Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Install Determinate Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
            trusted-users = runner root
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Build and upload to TestFlight
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: nix develop .#release --command fastlane beta
