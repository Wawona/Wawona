      - name: Smoke Linux VM automation package
        run: ./.github/scripts/nix-retry.sh nix build ".#packages.${{ needs.prepare-macos-x86_64.outputs.system }}.wawona-linux-vm" --print-build-logs
      - name: Smoke WearOS automation package
