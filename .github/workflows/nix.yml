          if-no-files-found: error

  prepare-macos-arm64:
    name: "Prepare macOS (arm64) matrix (experimental fallback)"
    runs-on: macos-26
    outputs:
      system: ${{ steps.matrix.outputs.system }}
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Active Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found on this runner"
            ls /Applications/Xcode*.app || true
            exit 1
          fi
          echo "XCODE_APP=$XCODE_APP" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
            flake-registry = https://github.com/NixOS/flake-registry/archive/master.tar.gz

      - name: Derive package matrix from flake
        id: matrix
        run: |
          SYSTEM=$(nix eval --raw --impure --expr builtins.currentSystem)
          TARGETS=$(nix eval --json --impure ".#packages.\"$SYSTEM\"" --apply builtins.attrNames || echo "[]")
          TARGETS=$(TARGETS_JSON="$TARGETS" python3 - <<'PY'
          import json, os
          excluded_targets = {
              "wawona-ios-ipa",
              "wawona-ios-xcarchive",
          }
          targets = json.loads(os.environ["TARGETS_JSON"])
          print(json.dumps([t for t in targets if t not in excluded_targets]))
          PY
          )
          if [ "$TARGETS" = "[]" ]; then
            echo "::error::Failed to derive package matrix for $SYSTEM"
            exit 1
          fi
          printf 'system=%s\n' "$SYSTEM" >> "$GITHUB_OUTPUT"
          printf 'targets=%s\n' "$TARGETS" >> "$GITHUB_OUTPUT"

      - name: Verify Android config consistency
        run: python3 ./.github/scripts/verify-android-config.py

      - name: Verify Android upgrade guardrails
        run: python3 ./.github/scripts/verify-android-upgrade-guardrails.py

      - name: Verify Android __noChroot policy
        run: python3 ./.github/scripts/verify-android-nochroot.py

      - name: Verify Android maintainability checkpoint
        run: python3 ./.github/scripts/verify-android-maintainability.py
      - name: Verify no 'tar --wildcards' in nix recipes (bsdtar no-op guard)
        run: python3 ./.github/scripts/verify-no-tar-wildcards.py
      - name: Verify iOS shell-tool wiring
        run: python3 ./.github/scripts/verify-ios-shell-tools.py
      - name: Verify Android shell-tool wiring
        run: python3 ./.github/scripts/verify-android-shell-tools.py
      - name: Verify macOS target matrix
        run: python3 ./.github/scripts/verify-macos-target-matrix.py
      - name: Verify Wayland protocol manifest
        run: python3 ./.github/scripts/verify-wayland-protocol-manifest.py
      - name: Verify Smithay coverage contract
        run: python3 ./.github/scripts/verify-smithay-coverage-contract.py
      - name: Verify Wayland runtime ownership inventory
        run: python3 ./.github/scripts/verify-wayland-runtime-ownership.py --strict --json-out ./docs/compliance/generated/wayland-runtime-ownership.json
      - name: Verify no-equivalent closure inventory
        run: python3 ./.github/scripts/verify-wayland-no-equivalent-closure.py --json-out ./docs/compliance/generated/wayland-no-equivalent-closure.json
      - name: Verify Wayland profile smoke
        run: python3 ./.github/scripts/verify-wayland-profile-smoke.py
      - name: Verify Linux machine-profile parity
        run: python3 ./.github/scripts/verify-linux-machines-parity.py
      - name: Verify Linux bundled client parity
        run: python3 ./.github/scripts/verify-linux-bundled-clients.py
      - name: Verify Linux shell-tool wiring
        run: python3 ./.github/scripts/verify-linux-shell-tools.py
      - name: Verify waypipe remote-sway env fallback (issue #54 guard)
        run: python3 ./.github/scripts/verify-waypipe-remote-sway-env.py
      - name: Verify nixpkgs lineage (issue #47 guard)
        run: python3 ./.github/scripts/verify-nixpkgs-lineage.py
      - name: Upload Wayland ownership inventory artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wayland-runtime-ownership-${{ github.job }}
          path: docs/compliance/generated/wayland-runtime-ownership.json
      - name: Upload no-equivalent closure artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wayland-no-equivalent-closure-${{ github.job }}
          path: docs/compliance/generated/wayland-no-equivalent-closure.json

  verify-macos-arm64:
    name: "macOS (arm64): flake check (experimental fallback)"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Active Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found on this runner"
            exit 1
          fi
          echo "XCODE_APP=$XCODE_APP" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XCODE_APP"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true

      - name: Run flake checks
        run: ./.github/scripts/nix-retry.sh nix flake check --print-build-logs

  build-macos-arm64:
    name: "macOS (arm64): ${{ matrix.target }} (experimental fallback)"
    runs-on: macos-26
    needs:
      - prepare-macos-arm64
      - verify-macos-arm64
      - smoke-macos-arm64
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare-macos-arm64.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Active Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found on this runner"
            exit 1
          fi
          echo "XCODE_APP=$XCODE_APP" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XCODE_APP"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true

      - name: Build Target
        run: ./.github/scripts/nix-retry.sh nix build ".#packages.${{ needs.prepare-macos-arm64.outputs.system }}.${{ matrix.target }}" --print-build-logs

  prepare-macos-x86_64:
    name: "Prepare macOS (x86_64) matrix"
    runs-on: macos-26
    outputs:
      system: ${{ steps.matrix.outputs.system }}
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Active Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found on this runner"
            exit 1
          fi
          echo "XCODE_APP=$XCODE_APP" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XCODE_APP"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
            flake-registry = https://github.com/NixOS/flake-registry/archive/master.tar.gz

      - name: Derive package matrix from flake
        id: matrix
        run: |
          TARGETS=$(nix eval --json --impure ".#packages.\"x86_64-darwin\"" --apply builtins.attrNames || echo "[]")
          TARGETS=$(TARGETS_JSON="$TARGETS" python3 - <<'PY'
          import json, os
          excluded_targets = {
              "wawona-ios-ipa",
              "wawona-ios-xcarchive",
          }
          targets = json.loads(os.environ["TARGETS_JSON"])
          print(json.dumps([t for t in targets if t not in excluded_targets]))
          PY
          )
          if [ "$TARGETS" = "[]" ]; then
            echo "::error::Failed to derive package matrix for x86_64-darwin"
            exit 1
          fi
          printf 'system=%s\n' "x86_64-darwin" >> "$GITHUB_OUTPUT"
          printf 'targets=%s\n' "$TARGETS" >> "$GITHUB_OUTPUT"

      - name: Verify Android config consistency
        run: python3 ./.github/scripts/verify-android-config.py

      - name: Verify Android upgrade guardrails
        run: python3 ./.github/scripts/verify-android-upgrade-guardrails.py

      - name: Verify Android __noChroot policy
        run: python3 ./.github/scripts/verify-android-nochroot.py

      - name: Verify Android maintainability checkpoint
        run: python3 ./.github/scripts/verify-android-maintainability.py
      - name: Verify no 'tar --wildcards' in nix recipes (bsdtar no-op guard)
        run: python3 ./.github/scripts/verify-no-tar-wildcards.py
      - name: Verify iOS shell-tool wiring
        run: python3 ./.github/scripts/verify-ios-shell-tools.py
      - name: Verify Android shell-tool wiring
        run: python3 ./.github/scripts/verify-android-shell-tools.py
      - name: Verify macOS target matrix
        run: python3 ./.github/scripts/verify-macos-target-matrix.py
      - name: Verify Wayland protocol manifest
        run: python3 ./.github/scripts/verify-wayland-protocol-manifest.py
      - name: Verify Smithay coverage contract
        run: python3 ./.github/scripts/verify-smithay-coverage-contract.py
      - name: Verify Wayland runtime ownership inventory
        run: python3 ./.github/scripts/verify-wayland-runtime-ownership.py --strict --json-out ./docs/compliance/generated/wayland-runtime-ownership.json
      - name: Verify no-equivalent closure inventory
        run: python3 ./.github/scripts/verify-wayland-no-equivalent-closure.py --json-out ./docs/compliance/generated/wayland-no-equivalent-closure.json
      - name: Verify Wayland profile smoke
        run: python3 ./.github/scripts/verify-wayland-profile-smoke.py
      - name: Verify Linux machine-profile parity
        run: python3 ./.github/scripts/verify-linux-machines-parity.py
      - name: Verify Linux bundled client parity
        run: python3 ./.github/scripts/verify-linux-bundled-clients.py
      - name: Verify Linux shell-tool wiring
        run: python3 ./.github/scripts/verify-linux-shell-tools.py
      - name: Verify waypipe remote-sway env fallback (issue #54 guard)
        run: python3 ./.github/scripts/verify-waypipe-remote-sway-env.py
      - name: Verify nixpkgs lineage (issue #47 guard)
        run: python3 ./.github/scripts/verify-nixpkgs-lineage.py
      - name: Upload Wayland ownership inventory artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wayland-runtime-ownership-${{ github.job }}
          path: docs/compliance/generated/wayland-runtime-ownership.json
      - name: Upload no-equivalent closure artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wayland-no-equivalent-closure-${{ github.job }}
          path: docs/compliance/generated/wayland-no-equivalent-closure.json

  verify-macos-x86_64:
    name: "macOS (x86_64): flake check"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Active Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found on this runner"
            exit 1
          fi
          echo "XCODE_APP=$XCODE_APP" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XCODE_APP"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true

      - name: Run flake checks
        run: ./.github/scripts/nix-retry.sh nix flake check --print-build-logs

  build-macos-x86_64:
    name: "macOS (x86_64): ${{ matrix.target }}"
    runs-on: macos-26
    needs:
      - prepare-macos-x86_64
      - verify-macos-x86_64
      - smoke-macos-x86_64
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare-macos-x86_64.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Active Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found on this runner"
            exit 1
          fi
          echo "XCODE_APP=$XCODE_APP" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XCODE_APP"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true

      - name: Build Target
        run: ./.github/scripts/nix-retry.sh nix build ".#packages.${{ needs.prepare-macos-x86_64.outputs.system }}.${{ matrix.target }}" --print-build-logs

  repro-rebuild:
    name: "Linux (x86_64): reproducibility gate"
    runs-on: ubuntu-latest
    needs:
      - prepare-linux
      - verify-linux
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          docker image prune -af || true
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            build-dir = /nix/build
            sandbox = relaxed
            allow-import-from-derivation = true
      # Determinism gate (Phase 8 root-cause #3): build, then rebuild with
      # --check so Nix re-realizes the derivation and byte-compares against the
      # first output. A non-reproducible derivation (unfiltered `./.` source
      # churn, embedded timestamps, non-sorted archives) fails here.
      - name: Build backend (first realization)
        run: ./.github/scripts/nix-retry.sh nix build ".#packages.${{ needs.prepare-linux.outputs.system }}.wawona-android-backend" --print-build-logs --out-link result-backend
      - name: Rebuild backend deterministically (--check)
        run: nix build ".#packages.${{ needs.prepare-linux.outputs.system }}.wawona-android-backend" --rebuild --print-build-logs
      # workspace-src is the filtered-source assembly derivation feeding the APK;
      # it must be byte-identical across host churn (Phase 8 root-cause #3, the
      # filtered srcFor change). Rebuild it under --check too.
      - name: Build workspace-src (first realization)
        run: ./.github/scripts/nix-retry.sh nix build ".#packages.${{ needs.prepare-linux.outputs.system }}.wawona-workspace-src-android" --print-build-logs --out-link result-workspace-src
      - name: Rebuild workspace-src deterministically (--check)
        run: nix build ".#packages.${{ needs.prepare-linux.outputs.system }}.wawona-workspace-src-android" --rebuild --print-build-logs
      - name: Flake check (evaluation + all checks)
        run: ./.github/scripts/nix-retry.sh nix flake check --print-build-logs

  smoke-linux:
    name: "Linux (x86_64): smoke gates"
    runs-on: ubuntu-latest
    needs:
      - prepare-linux
      - verify-linux
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          docker image prune -af || true
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            build-dir = /nix/build
            sandbox = relaxed
            allow-import-from-derivation = true
      - name: Smoke Android Rust backend
        run: ./.github/scripts/nix-retry.sh nix build ".#packages.${{ needs.prepare-linux.outputs.system }}.wawona-android-backend" --print-build-logs
      - name: Smoke WearOS automation package
        run: ./.github/scripts/nix-retry.sh nix build ".#packages.${{ needs.prepare-linux.outputs.system }}.wawona-wearos" --print-build-logs
      - name: Smoke Linux VM automation package
        run: ./.github/scripts/nix-retry.sh nix build ".#packages.${{ needs.prepare-linux.outputs.system }}.wawona-linux-vm" --print-build-logs

  smoke-linux-arm64:
    name: "Linux (arm64): smoke gates (experimental fallback)"
    runs-on: ubuntu-24.04-arm
    needs:
      - prepare-linux-arm64
      - verify-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          docker image prune -af || true
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            build-dir = /nix/build
            sandbox = relaxed
            allow-import-from-derivation = true
      - name: Android toolchain fallback canary
        run: ./.github/scripts/nix-retry.sh nix build ".#packages.${{ needs.prepare-linux-arm64.outputs.system }}.android-toolchain-sanity" --print-build-logs
      - name: Smoke Android Rust backend
        run: ./.github/scripts/nix-retry.sh nix build ".#packages.${{ needs.prepare-linux-arm64.outputs.system }}.wawona-android-backend" --print-build-logs
      - name: Smoke WearOS automation package
        run: ./.github/scripts/nix-retry.sh nix build ".#packages.${{ needs.prepare-linux-arm64.outputs.system }}.wawona-wearos" --print-build-logs
      - name: Smoke Linux VM automation package
        run: ./.github/scripts/nix-retry.sh nix build ".#packages.${{ needs.prepare-linux-arm64.outputs.system }}.wawona-linux-vm" --print-build-logs

  smoke-macos-arm64:
    name: "macOS (arm64): smoke gates (experimental fallback)"
    runs-on: macos-26
