name: "Gate: packages"

# Branch policy: development = WIP gate; master = release/green.
# What/why: docs/ci.md. Cache: FlakeHub (flakehub-cache-action@v3).
on:
  push:
    branches: [ development, master, main ]
  pull_request:
    branches: [ development, master, main ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

# Per-commit: do not queue the live tip behind an obsolete SHA.
concurrency:
  group: nix-ci-${{ github.sha }}
  cancel-in-progress: false

env:
  NIXPKGS_ALLOW_UNFREE: '1'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PUPPETEER_SKIP_DOWNLOAD: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  tip:
    name: "Check: is this the latest commit?"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      is_tip: ${{ steps.tip.outputs.is_tip }}
      reason: ${{ steps.tip.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: tip
        env:
          WAWONA_CI_FORCE_TIP: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: bash .github/scripts/ci-require-branch-tip.sh

  # Always-on scope probe so docs-only tips skip Darwin minutes but keep L0.
  ci-scope:
    name: "Check: which packages to build"
    needs: tip
    if: needs.tip.outputs.is_tip == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # workflow_dispatch forces full matrix via job `if`s (ignore this output).
          filters: |
            native:
              - 'src/**'
              - 'Sources/**'
              - 'android/**'
              - 'dependencies/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'fastlane/**'
              - 'secretspec.toml'
              - '.github/workflows/nix.yml'
              - '.github/ci-package-matrix.json'
              - '.github/scripts/**'
              - 'scripts/**'

  prepare-matrix:
    name: "Prepare Unified Matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [tip, ci-scope]
    if: needs.tip.outputs.is_tip == 'true'
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Reclaim Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          docker image prune -af || true
          df -h

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            build-dir = /nix/build
            sandbox = relaxed
            allow-import-from-derivation = true
            trusted-users = runner root
            max-jobs = auto
            cores = 0
            flake-registry = https://github.com/NixOS/flake-registry/archive/master.tar.gz

      - uses: DeterminateSystems/flakehub-cache-action@v3

      - uses: ./.github/actions/setup-xtask
        with:
          key: prepare-matrix

      - name: Load curated package matrix
        id: matrix
        env:
          # workflow_dispatch always full; push/PR honor ci-scope.native.
          WAWONA_CI_NATIVE: ${{ github.event_name == 'workflow_dispatch' && 'true' || needs.ci-scope.outputs.native }}
        run: cargo xtask ci matrix

      - name: Repository gates
        run: >-
          cargo xtask verify --strict --json-out docs/compliance/generated
          android-config android-upgrade-guardrails android-nochroot android-maintainability
          no-tar-wildcards ios-shell-tools wawona-wasm android-shell-tools ssh-backends
          wayland-protocol-manifest settings-in-app smithay-coverage wayland-runtime-ownership
          wayland-no-equivalent-closure wayland-profile-smoke linux-machines-parity
          linux-bundled-clients linux-shell-tools waypipe-remote-sway-env nixpkgs-lineage apple-sdk-warm
      - name: Verify iOS Mode B scanner and vphone replay contract
        run: bash ./.github/scripts/verify-ios-modeb-ci.sh
      - name: Upload Wayland ownership inventory artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: wayland-runtime-ownership-${{ github.job }}
          path: docs/compliance/generated/wayland-runtime-ownership.json
      - name: Upload no-equivalent closure artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: wayland-no-equivalent-closure-${{ github.job }}
          path: docs/compliance/generated/wayland-no-equivalent-closure.json

      - name: Pre-validate Flake
        run: ./.github/scripts/nix-retry.sh nix flake check --print-build-logs

  cargo-test-linux:
    name: "Linux (x86_64): cargo test"
    needs: tip
    if: needs.tip.outputs.is_tip == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix-flakehub

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Ensure Cargo path dependencies
        run: |
          chmod +x ./scripts/ensure-waypipe.sh ./scripts/ensure-coreutils.sh ./scripts/ensure-terminal.sh
          ./scripts/ensure-waypipe.sh
          ./scripts/ensure-coreutils.sh
          ./scripts/ensure-terminal.sh

      - name: Run Rust tests
        run: nix develop -c cargo test --lib --tests --locked

      - name: Protocol status manifest is up to date
        run: |
          WWN_WRITE_PROTOCOL_STATUS=1 nix develop -c cargo test --lib \
            tests::protocol_matrix::test_generate_protocol_status_manifest \
            -- --exact --nocapture
          git diff --exit-code -- docs/protocol-status.md \
            || { echo "::error::docs/protocol-status.md is stale; run scripts/gen-protocol-status.sh"; exit 1; }

      - name: Protocol expect manifests are up to date
        run: |
          WWN_WRITE_PROTOCOL_EXPECT=1 nix develop -c cargo test --lib \
            core::wayland::catalog::tests::test_generate_protocol_expect_manifests \
            -- --exact --nocapture
          git diff --exit-code -- docs/protocol-expect \
            || { echo "::error::docs/protocol-expect stale; run scripts/gen-protocol-expect.sh"; exit 1; }

      - name: Build Linux GTK UI (linux-ui feature)
        run: nix develop -c cargo build --bin wawona-linux-ui --features linux-ui --locked

      - name: Run Linux UI unit tests
        run: nix develop -c cargo test --features linux-ui --locked

  cargo-test-macos-arm64:
    name: "macOS (arm64): cargo test"
    runs-on: macos-27
    needs: [ci-scope]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.ci-scope.outputs.native == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Select pinned Xcode
        run: ./.github/scripts/select-xcode.sh
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
            max-jobs = auto
            cores = 0
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Ensure Cargo path dependencies
        run: |
          chmod +x ./scripts/ensure-waypipe.sh ./scripts/ensure-coreutils.sh ./scripts/ensure-terminal.sh
          ./scripts/ensure-waypipe.sh
          ./scripts/ensure-coreutils.sh
          ./scripts/ensure-terminal.sh
      - name: Run Rust tests (native aarch64-darwin)
        run: nix develop -c cargo test --lib --tests --locked

  swift-test-macos-x86_64:
    name: "macOS (x86_64): swift test"
    runs-on: macos-27
    needs: [ci-scope]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.ci-scope.outputs.native == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Select pinned Xcode
        run: ./.github/scripts/select-xcode.sh
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
            max-jobs = auto
            cores = 0
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Run Swift tests
        run: |
          swift build --product WawonaPackageTests
          swift test --skip-build --filter WawonaUIContractsTests
          swift test --skip-build --filter WawonaModelSettingsTests

  build:
    name: "${{ matrix.system }}: ${{ matrix.target }}"
    runs-on: ${{ matrix.os }}
    # Darwin rows already dropped in prepare-matrix when ci-scope.native=false.
    needs: [prepare-matrix]
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Reclaim Disk Space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          docker image prune -af || true
          df -h

      - name: Select pinned Xcode
        if: runner.os == 'macOS'
        run: ./.github/scripts/select-xcode.sh

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            build-dir = /nix/build
            sandbox = relaxed
            allow-import-from-derivation = true
            max-jobs = auto
            cores = 0

      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Build Target
        run: ./.github/scripts/nix-retry.sh nix build ".#packages.${{ matrix.system }}.${{ matrix.target }}" --print-build-logs

      - name: FlakeHub hit summary
        if: success()
        run: |
          {
            echo "### ${{ matrix.system }} / ${{ matrix.target }}"
            OUT="$(readlink -f result 2>/dev/null || true)"
            if [[ -n "$OUT" ]]; then
              echo "- outPath: \`$OUT\`"
              if nix path-info --json "$OUT" 2>/dev/null | grep -q cache.flakehub.com; then
                echo "- flakehub_substitute: likely"
              else
                echo "- flakehub_substitute: unknown (path present; narinfo not from FlakeHub in this probe)"
              fi
            else
              echo "- outPath: missing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: AppImage smoke (type-2 magic + non-FUSE extract)
        if: ${{ matrix.target == 'wawona-appimage' }}
        run: ./.github/scripts/appimage-smoke.sh result "${{ matrix.system }}"

      - name: Upload AppImage artifact
        if: ${{ matrix.target == 'wawona-appimage' }}
        uses: actions/upload-artifact@v7
        with:
          name: wawona-appimage-${{ matrix.system }}
          path: dist/*.AppImage
          if-no-files-found: error

  # Folded from former android-parity.yml: Gradle assembleDebug + meson/shell
  # gates. Nix APK + emu e2e stay on Gate: products. Path-filtered so non-Android
  # tips skip this job.
  android-path-filter:
    name: "Android path filter"
    needs: tip
    if: needs.tip.outputs.is_tip == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'dependencies/**'
              - 'src/platform/android/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'xtask/src/verify/**'
              - '.github/scripts/nix-build-shell-tools.sh'
              - '.github/scripts/nix-build-android-meson-sandbox-gate.sh'
              - '.github/workflows/nix.yml'

  android-gradle-gate:
    name: "macOS: Android Gradle + meson gate"
    needs: android-path-filter
    if: ${{ github.event_name == 'workflow_dispatch' || needs.android-path-filter.outputs.android == 'true' }}
    # macOS (not ubuntu) for Android cross deps; aligned to macos-27 with product jobs.
    runs-on: macos-27
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - uses: ./.github/actions/setup-xtask
        with:
          key: android-gate
          android: true

      - name: Verify Android shell-tool wiring
        run: cargo xtask verify android-shell-tools
      - name: Checkout flake inputs for meson verify
        run: ./.github/scripts/checkout-flake-inputs.sh
      - name: Verify Android meson sandbox hooks
        run: cargo xtask verify android-meson-sandbox
      - name: Build weston + compositor + bundled shell tools
        run: ./.github/scripts/nix-build-android-meson-sandbox-gate.sh
      - name: Build bundled shell tools + weston-ios
        run: |
          nix build .#zsh-android .#fastfetch-android .#phoon-android \
            .#weston-ios --no-link
      - name: Gradle assembleDebug over a slice built from source
        run: |
          cargo xtask deps get --nix android
          cargo xtask build android
