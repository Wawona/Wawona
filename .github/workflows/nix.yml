name: Nix CI

# Branch policy: development = WIP gate; master = release/green.
# What/why: docs/ci.md. Cache: FlakeHub (flakehub-cache-action@v3).
on:
  push:
    branches: [ development, master, main ]
  pull_request:
    branches: [ development, master, main ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: nix-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NIXPKGS_ALLOW_UNFREE: '1'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PUPPETEER_SKIP_DOWNLOAD: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Always-on scope probe so docs-only tips skip Darwin minutes but keep L0.
  ci-scope:
    name: "CI scope"
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # workflow_dispatch forces full matrix via job `if`s (ignore this output).
          filters: |
            native:
              - 'src/**'
              - 'Sources/**'
              - 'android/**'
              - 'dependencies/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'fastlane/**'
              - 'secretspec.toml'
              - '.github/workflows/nix.yml'
              - '.github/ci-package-matrix.json'
              - '.github/scripts/**'
              - 'scripts/**'

  prepare-matrix:
    name: "Prepare Unified Matrix"
    runs-on: ubuntu-latest
    needs: [ci-scope]
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Reclaim Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          docker image prune -af || true
          df -h

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            build-dir = /nix/build
            sandbox = relaxed
            allow-import-from-derivation = true
            trusted-users = runner root
            max-jobs = auto
            cores = 0
            flake-registry = https://github.com/NixOS/flake-registry/archive/master.tar.gz

      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Load curated package matrix
        id: matrix
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys

          path = ".github/ci-package-matrix.json"
          with open(path) as f:
              data = json.load(f)
          include = data["include"]
          if not include:
              print("::error::ci-package-matrix.json include[] is empty", file=sys.stderr)
              sys.exit(1)

          # Fail closed if an attr disappeared. One attrNames probe per system
          # (avoids N Darwin IFD graphs from per-target `.name` evals on Linux).
          by_system = {}
          for row in include:
              by_system.setdefault(row["system"], set()).add(row["target"])
          for system, targets in by_system.items():
              probe = subprocess.run(
                  [
                      "nix", "eval", "--json",
                      f".#packages.{system}",
                      "--apply", "builtins.attrNames",
                  ],
                  capture_output=True,
                  text=True,
              )
              if probe.returncode != 0:
                  print(
                      f"::error::failed to list packages.{system}\n{probe.stderr}",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              names = set(json.loads(probe.stdout))
              missing = sorted(targets - names)
              if missing:
                  print(
                      f"::error::matrix targets missing under packages.{system}: {missing}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          # GHA matrix only needs system/os/target.
          slim = [
              {"system": r["system"], "os": r["os"], "target": r["target"]}
              for r in include
          ]
          matrix_json = json.dumps({"include": slim})
          print(f"Curated matrix entries: {len(slim)}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix_json}\n")
          PYEOF

      - name: Verify Android config consistency
        run: python3 ./.github/scripts/verify-android-config.py

      - name: Verify Android upgrade guardrails
        run: python3 ./.github/scripts/verify-android-upgrade-guardrails.py

      - name: Verify Android __noChroot policy
        run: python3 ./.github/scripts/verify-android-nochroot.py

      - name: Verify Android maintainability checkpoint
        run: python3 ./.github/scripts/verify-android-maintainability.py
      - name: Verify no 'tar --wildcards' in nix recipes (bsdtar no-op guard)
        run: python3 ./.github/scripts/verify-no-tar-wildcards.py
      - name: Verify iOS shell-tool wiring
        run: python3 ./.github/scripts/verify-ios-shell-tools.py
      - name: Verify Android shell-tool wiring
        run: python3 ./.github/scripts/verify-android-shell-tools.py
      - name: Verify Wayland protocol manifest
        run: python3 ./.github/scripts/verify-wayland-protocol-manifest.py
      - name: Verify Smithay coverage contract
        run: python3 ./.github/scripts/verify-smithay-coverage-contract.py
      - name: Verify Wayland runtime ownership inventory
        run: python3 ./.github/scripts/verify-wayland-runtime-ownership.py --strict --json-out ./docs/compliance/generated/wayland-runtime-ownership.json
      - name: Verify no-equivalent closure inventory
        run: python3 ./.github/scripts/verify-wayland-no-equivalent-closure.py --json-out ./docs/compliance/generated/wayland-no-equivalent-closure.json
      - name: Verify Wayland profile smoke
        run: python3 ./.github/scripts/verify-wayland-profile-smoke.py
      - name: Verify Linux machine-profile parity
        run: python3 ./.github/scripts/verify-linux-machines-parity.py
      - name: Verify Linux bundled client parity
        run: python3 ./.github/scripts/verify-linux-bundled-clients.py
      - name: Verify Linux shell-tool wiring
        run: python3 ./.github/scripts/verify-linux-shell-tools.py
      - name: Verify waypipe remote-sway env fallback (issue #54 guard)
        run: python3 ./.github/scripts/verify-waypipe-remote-sway-env.py
      - name: Verify nixpkgs lineage (issue #47 guard)
        run: python3 ./.github/scripts/verify-nixpkgs-lineage.py
      - name: Upload Wayland ownership inventory artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: wayland-runtime-ownership-${{ github.job }}
          path: docs/compliance/generated/wayland-runtime-ownership.json
      - name: Upload no-equivalent closure artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: wayland-no-equivalent-closure-${{ github.job }}
          path: docs/compliance/generated/wayland-no-equivalent-closure.json

      - name: Pre-validate Flake
        run: ./.github/scripts/nix-retry.sh nix flake check --print-build-logs

  cargo-test-linux:
    name: "Linux (x86_64): cargo test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Nix (for ensure-waypipe.sh; GitLab blocks anonymous cargo git fetch)
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Ensure Cargo path dependencies
        run: |
          ./scripts/ensure-waypipe.sh
          ./scripts/ensure-coreutils.sh

      - name: Run Rust tests
        run: nix develop -c cargo test --lib --tests --locked

      - name: Protocol status manifest is up to date
        run: |
          WWN_WRITE_PROTOCOL_STATUS=1 nix develop -c cargo test --lib \
            tests::protocol_matrix::test_generate_protocol_status_manifest \
            -- --exact --nocapture
          git diff --exit-code -- docs/protocol-status.md \
            || { echo "::error::docs/protocol-status.md is stale; run scripts/gen-protocol-status.sh"; exit 1; }

      - name: Build Linux GTK UI (linux-ui feature)
        run: nix develop -c cargo build --bin wawona-linux-ui --features linux-ui --locked

      - name: Run Linux UI unit tests
        run: nix develop -c cargo test --features linux-ui --locked

  cargo-test-macos-arm64:
    name: "macOS (arm64): cargo test"
    runs-on: macos-26
    needs: [ci-scope]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.ci-scope.outputs.native == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Select pinned Xcode
        run: ./.github/scripts/select-xcode.sh
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
            max-jobs = auto
            cores = 0
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Ensure Cargo path dependencies
        run: |
          ./scripts/ensure-waypipe.sh
          ./scripts/ensure-coreutils.sh
      - name: Run Rust tests (native aarch64-darwin)
        run: nix develop -c cargo test --lib --tests --locked

  swift-test-macos-x86_64:
    name: "macOS (x86_64): swift test"
    runs-on: macos-26
    needs: [ci-scope]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.ci-scope.outputs.native == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Select pinned Xcode
        run: ./.github/scripts/select-xcode.sh
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
            max-jobs = auto
            cores = 0
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Run Swift tests
        run: |
          swift build --product WawonaPackageTests
          swift test --skip-build --filter WawonaUIContractsTests
          swift test --skip-build --filter WawonaModelSettingsTests

  build:
    name: "${{ matrix.system }}: ${{ matrix.target }}"
    runs-on: ${{ matrix.os }}
    needs: [prepare-matrix, ci-scope]
    # Docs-only tips: keep Linux L2, skip Darwin matrix cells.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.ci-scope.outputs.native == 'true' || !startsWith(matrix.os, 'macos') }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Reclaim Disk Space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          docker image prune -af || true
          df -h

      - name: Select pinned Xcode
        if: runner.os == 'macOS'
        run: ./.github/scripts/select-xcode.sh

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            build-dir = /nix/build
            sandbox = relaxed
            allow-import-from-derivation = true
            max-jobs = auto
            cores = 0

      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Build Target
        run: ./.github/scripts/nix-retry.sh nix build ".#packages.${{ matrix.system }}.${{ matrix.target }}" --print-build-logs

      - name: FlakeHub hit summary
        if: success()
        run: |
          {
            echo "### ${{ matrix.system }} / ${{ matrix.target }}"
            OUT="$(readlink -f result 2>/dev/null || true)"
            if [[ -n "$OUT" ]]; then
              echo "- outPath: \`$OUT\`"
              if nix path-info --json "$OUT" 2>/dev/null | grep -q cache.flakehub.com; then
                echo "- flakehub_substitute: likely"
              else
                echo "- flakehub_substitute: unknown (path present; narinfo not from FlakeHub in this probe)"
              fi
            else
              echo "- outPath: missing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: AppImage smoke (type-2 magic + non-FUSE extract)
        if: ${{ matrix.target == 'wawona-appimage' }}
        run: ./.github/scripts/appimage-smoke.sh result "${{ matrix.system }}"

      - name: Upload AppImage artifact
        if: ${{ matrix.target == 'wawona-appimage' }}
        uses: actions/upload-artifact@v7
        with:
          name: wawona-appimage-${{ matrix.system }}
          path: dist/*.AppImage
          if-no-files-found: error

  frontend-syntax-check:
    name: "macOS: Fast Path Frontend Check"
    runs-on: macos-26
    needs: [ci-scope]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.ci-scope.outputs.native == 'true' }}
    steps:
      - uses: actions/checkout@v5

      - name: Select pinned Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
            max-jobs = auto
            cores = 0

      - uses: DeterminateSystems/flakehub-cache-action@v3
            
      - name: Generate Xcode Project
        run: nix run .#xcodegen
        
      - name: Syntax Check Apple Platforms
        run: |
          export WAWONA_SKIP_NIX_PREBUILD=1
          
          check_target() {
            local scheme=$1
            local dest=$2
            echo "::group::Syntax Check: $scheme"
            echo "Checking $scheme ($dest)..."
            
            # Simulator destinations + unsigned: device SDKs require a
            # DEVELOPMENT_TEAM even for frontend syntax checks.
            set +e
            xcodebuild clean build \
              -project Wawona.xcodeproj \
              -scheme "$scheme" \
              -destination "$dest" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=- \
              > build.log 2>&1
            local exit_code=$?
            set -e
            
            if [ $exit_code -ne 0 ]; then
              if grep -q "error:" build.log; then
                # If there is an error that is NOT a missing Nix dependency, fail!
                if grep -v "libwawona" build.log \
                  | grep -v "linker command failed" \
                  | grep -v "clang: error: no such file or directory" \
                  | grep -v "requires a development team" \
                  | grep -q "error:"; then
                  echo "::error::Swift/ObjC Syntax error detected in $scheme!"
                  cat build.log
                  exit 1
                fi
              fi
              echo "$scheme successfully passed frontend syntax check (backend linker errors safely ignored)."
            else
              echo "$scheme unexpectedly linked successfully without the Rust backend!"
            fi
            echo "::endgroup::"
          }
          
          check_target "Wawona-tvOS" "generic/platform=tvOS Simulator"
          check_target "Wawona-watchOS" "generic/platform=watchOS Simulator"
          check_target "Wawona-visionOS" "generic/platform=visionOS Simulator"
          check_target "Wawona-iOS" "generic/platform=iOS Simulator"

  # Folded from former android-parity.yml: Gradle assembleDebug + meson/shell
  # gates. Nix APK + emu e2e stay on Device gate. Path-filtered so non-Android
  # tips skip this job.
  android-path-filter:
    name: "Android path filter"
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'dependencies/**'
              - 'src/platform/android/**'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/scripts/verify-android-shell-tools.py'
              - '.github/scripts/verify-android-meson-sandbox.py'
              - '.github/scripts/nix-build-shell-tools.sh'
              - '.github/scripts/nix-build-android-meson-sandbox-gate.sh'
              - '.github/workflows/nix.yml'

  android-gradle-gate:
    name: "macOS: Android Gradle + meson gate"
    needs: android-path-filter
    if: ${{ github.event_name == 'workflow_dispatch' || needs.android-path-filter.outputs.android == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Verify Android shell-tool wiring
        run: python3 ./.github/scripts/verify-android-shell-tools.py
      - name: Checkout flake inputs for meson verify
        run: ./.github/scripts/checkout-flake-inputs.sh
      - name: Verify Android meson sandbox hooks
        run: python3 ./.github/scripts/verify-android-meson-sandbox.py
      - name: Build weston + compositor + bundled shell tools
        run: ./.github/scripts/nix-build-android-meson-sandbox-gate.sh
      - name: Build bundled shell tools + weston-ios
        run: |
          nix build .#zsh-android .#fastfetch-android .#neovim-android \
            .#weston-ios --no-link
      - name: Gradle project assembleDebug
        run: |
          nix run .#gradlegen
          cd Wawona-gradle-project
          ./gradlew :Wawona:assembleDebug --no-daemon
