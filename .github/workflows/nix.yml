      - name: AppImage smoke (type-2 magic + non-FUSE extract)
        if: ${{ matrix.target == 'wawona-appimage' }}
        run: ./.github/scripts/appimage-smoke.sh result "${{ needs.prepare-linux-arm64.outputs.system }}"

      - name: Upload AppImage artifact
        if: ${{ matrix.target == 'wawona-appimage' }}
        uses: actions/upload-artifact@v4
        with:
