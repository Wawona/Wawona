name: Nix CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: nix-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NIXPKGS_ALLOW_UNFREE: '1'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PUPPETEER_SKIP_DOWNLOAD: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  prepare-linux:
    name: "Prepare Linux (x86_64) matrix"
    runs-on: ubuntu-latest
    outputs:
      system: ${{ steps.matrix.outputs.system }}
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          docker image prune -af || true
          df -h

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            build-dir = /nix/build
            sandbox = relaxed
            allow-import-from-derivation = true
            trusted-users = runner root
            flake-registry = https://github.com/NixOS/flake-registry/archive/master.tar.gz

      - name: Derive package matrix from flake
        id: matrix
        run: |
          SYSTEM=$(nix eval --raw --impure --expr builtins.currentSystem)
          TARGETS=$(nix eval --json --impure ".#packages.\"$SYSTEM\"" --apply builtins.attrNames || echo "[]")
          if [ "$TARGETS" = "[]" ]; then
            echo "::error::Failed to derive package matrix for $SYSTEM"
            exit 1
          fi
          printf 'system=%s\n' "$SYSTEM" >> "$GITHUB_OUTPUT"
          printf 'targets=%s\n' "$TARGETS" >> "$GITHUB_OUTPUT"

      - name: Verify Android config consistency
        run: python3 ./.github/scripts/verify-android-config.py

      - name: Verify Android upgrade guardrails
        run: python3 ./.github/scripts/verify-android-upgrade-guardrails.py

      - name: Verify Android __noChroot policy
        run: python3 ./.github/scripts/verify-android-nochroot.py

      - name: Verify Android maintainability checkpoint
        run: python3 ./.github/scripts/verify-android-maintainability.py
      - name: Verify no 'tar --wildcards' in nix recipes (bsdtar no-op guard)
        run: python3 ./.github/scripts/verify-no-tar-wildcards.py
      - name: Verify iOS shell-tool wiring
        run: python3 ./.github/scripts/verify-ios-shell-tools.py
      - name: Verify Android shell-tool wiring
        run: python3 ./.github/scripts/verify-android-shell-tools.py
      - name: Verify Wayland protocol manifest
        run: python3 ./.github/scripts/verify-wayland-protocol-manifest.py
      - name: Verify Smithay coverage contract
        run: python3 ./.github/scripts/verify-smithay-coverage-contract.py
      - name: Verify Wayland runtime ownership inventory
        run: python3 ./.github/scripts/verify-wayland-runtime-ownership.py --strict --json-out ./docs/compliance/generated/wayland-runtime-ownership.json
      - name: Verify no-equivalent closure inventory
        run: python3 ./.github/scripts/verify-wayland-no-equivalent-closure.py --json-out ./docs/compliance/generated/wayland-no-equivalent-closure.json
      - name: Verify Wayland profile smoke
        run: python3 ./.github/scripts/verify-wayland-profile-smoke.py
      - name: Verify Linux machine-profile parity
        run: python3 ./.github/scripts/verify-linux-machines-parity.py
      - name: Verify Linux bundled client parity
        run: python3 ./.github/scripts/verify-linux-bundled-clients.py
      - name: Verify Linux shell-tool wiring
        run: python3 ./.github/scripts/verify-linux-shell-tools.py
      - name: Verify waypipe remote-sway env fallback (issue #54 guard)
        run: python3 ./.github/scripts/verify-waypipe-remote-sway-env.py
      - name: Verify nixpkgs lineage (issue #47 guard)
        run: python3 ./.github/scripts/verify-nixpkgs-lineage.py
      - name: Upload Wayland ownership inventory artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wayland-runtime-ownership-${{ github.job }}
          path: docs/compliance/generated/wayland-runtime-ownership.json
      - name: Upload no-equivalent closure artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wayland-no-equivalent-closure-${{ github.job }}
          path: docs/compliance/generated/wayland-no-equivalent-closure.json
      
      - name: Pre-validate Flake
        run: ./.github/scripts/nix-retry.sh nix flake check --print-build-logs

  verify-linux:
    name: "Linux (x86_64): flake check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          docker image prune -af || true
          df -h

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            build-dir = /nix/build
            sandbox = relaxed
            allow-import-from-derivation = true
            trusted-users = runner root
            flake-registry = https://github.com/NixOS/flake-registry/archive/master.tar.gz

      - name: Run flake checks
        run: ./.github/scripts/nix-retry.sh nix flake check --print-build-logs

  cargo-test-linux:
    name: "Linux (x86_64): cargo test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix (for ensure-waypipe.sh; GitLab blocks anonymous cargo git fetch)
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Ensure Cargo path dependencies
        run: |
          ./scripts/ensure-waypipe.sh
          ./scripts/ensure-coreutils.sh

      - name: Run Rust tests
        run: nix develop -c cargo test --lib --tests --locked

      # p12: docs/protocol-status.md is auto-generated from the live advertised
      # registry. Regenerate and fail if it drifts from the committed manifest,
      # so protocol additions/removals can never silently desync the roadmap.
      - name: Protocol status manifest is up to date
        run: |
          WWN_WRITE_PROTOCOL_STATUS=1 nix develop -c cargo test --lib \
            tests::protocol_matrix::test_generate_protocol_status_manifest \
            -- --exact --nocapture
          git diff --exit-code -- docs/protocol-status.md \
            || { echo "::error::docs/protocol-status.md is stale; run scripts/gen-protocol-status.sh"; exit 1; }

      # The GTK linux-ui binary is normally built via `cargo run` at app launch
      # (dependencies/wawona/linux.nix), so it never compiles in CI. Compile it
      # here against the GTK4/libadwaita devshell stack and run the linux-ui
      # unit tests (canonical machine-profile model + migration) so UI/model
      # parity work cannot silently break the Linux build.
      - name: Build Linux GTK UI (linux-ui feature)
        run: nix develop -c cargo build --bin wawona-linux-ui --features linux-ui --locked

      - name: Run Linux UI unit tests
        run: nix develop -c cargo test --features linux-ui --locked

  cargo-test-macos-arm64:
    name: "macOS (arm64): cargo test"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Active Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found on this runner"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
      - name: Ensure Cargo path dependencies
        run: |
          ./scripts/ensure-waypipe.sh
          ./scripts/ensure-coreutils.sh
      # Layer 1 parity with cargo-test-linux: the Rust core is host-agnostic, but
      # only Linux ran cargo test before, so macOS-only regressions (cfg(target_os),
      # objc bridge, IOSurface paths) could land silently. Run the same suite on the
      # native aarch64-darwin host.
      - name: Run Rust tests (native aarch64-darwin)
        run: nix develop -c cargo test --lib --tests --locked

  swift-test-macos-x86_64:
    name: "macOS (x86_64): swift test"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Active Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found on this runner"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
      - name: Run Swift tests
        # Build the implicit test product (test targets + their deps) directly so
        # the WawonaPackageTests.xctest bundle is linked without compiling the full
        # package. WawonaUI bridges to app-only ObjC symbols and is not buildable
        # standalone under SwiftPM, so a plain `swift test` (whole-package build)
        # would fail; --product scopes the build to what the tests actually need.
        run: |
          swift build --product WawonaPackageTests
          swift test --skip-build --filter WawonaUIContractsTests
          swift test --skip-build --filter WawonaModelSettingsTests

  build-linux:
    name: "Linux (x86_64): ${{ matrix.target }}"
    runs-on: ubuntu-latest
    needs:
      - prepare-linux
      - verify-linux
      - smoke-linux
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare-linux.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          docker image prune -af || true
          df -h

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            build-dir = /nix/build
            sandbox = relaxed
            allow-import-from-derivation = true

      - name: Build Target
        run: ./.github/scripts/nix-retry.sh nix build ".#packages.${{ needs.prepare-linux.outputs.system }}.${{ matrix.target }}" --print-build-logs

      - name: AppImage smoke (type-2 magic + non-FUSE extract)
        if: ${{ matrix.target == 'wawona-appimage' }}
        run: ./.github/scripts/appimage-smoke.sh result "${{ needs.prepare-linux.outputs.system }}"

      - name: Upload AppImage artifact
        if: ${{ matrix.target == 'wawona-appimage' }}
        uses: actions/upload-artifact@v4
        with:
          name: wawona-appimage-${{ needs.prepare-linux.outputs.system }}
          path: dist/*.AppImage
          if-no-files-found: error

  prepare-linux-arm64:
    name: "Prepare Linux (arm64) matrix (experimental fallback)"
    runs-on: ubuntu-24.04-arm
    outputs:
      system: ${{ steps.matrix.outputs.system }}
      targets: ${{ steps.matrix.outputs.targets }}
