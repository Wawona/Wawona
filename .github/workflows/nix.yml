name: Nix CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: nix-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NIXPKGS_ALLOW_UNFREE: '1'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PUPPETEER_SKIP_DOWNLOAD: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  prepare-matrix:
    name: "Prepare Unified Matrix"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          docker image prune -af || true
          df -h

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            build-dir = /nix/build
            sandbox = relaxed
            allow-import-from-derivation = true
            trusted-users = runner root
            flake-registry = https://github.com/NixOS/flake-registry/archive/master.tar.gz

      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Derive Unified Package Matrix
        id: matrix
        run: |
          export TARGETS_LINUX_X64=$(nix eval --json --impure ".#packages.x86_64-linux" --apply builtins.attrNames || echo "[]")
          export TARGETS_LINUX_ARM64=$(nix eval --json --impure ".#packages.aarch64-linux" --apply builtins.attrNames || echo "[]")
          export TARGETS_MACOS_X64=$(nix eval --json --impure ".#packages.x86_64-darwin" --apply builtins.attrNames || echo "[]")
          export TARGETS_MACOS_ARM64=$(nix eval --json --impure ".#packages.aarch64-darwin" --apply builtins.attrNames || echo "[]")

          python3 - <<'PYEOF'
          import json, os, sys

          def load(env_var):
              val = os.environ.get(env_var, "[]")
              return json.loads(val) if val.strip() else []

          platforms = {
              "x86_64-linux": {"targets": load("TARGETS_LINUX_X64"), "os": "ubuntu-latest"},
              "aarch64-linux": {"targets": load("TARGETS_LINUX_ARM64"), "os": "ubuntu-24.04-arm"},
              "x86_64-darwin": {"targets": load("TARGETS_MACOS_X64"), "os": "macos-26"},
              "aarch64-darwin": {"targets": load("TARGETS_MACOS_ARM64"), "os": "macos-26"}
          }

          excluded_targets = {
              "wawona-ios-ipa", "wawona-ios-xcarchive", 
              "wawona-ipados-ipa", "wawona-tvos-ipa", "wawona-visionos-ipa", "wawona-watchos-ipa"
          }

          filtered_matrix = []
          for system, data in platforms.items():
              for target in data["targets"]:
                  if target in excluded_targets:
                      continue
                  if target.endswith("-xcode-env") or target.endswith("-project"):
                      continue
                  if target.endswith("-sim") or target.endswith("-sim-backend") or target.endswith("-simulator"):
                      continue
                  if any(t in target for t in ["tvos", "watchos", "visionos"]):
                      continue
                  if target == "wawona-ipados-backend":
                      continue
                      
                  filtered_matrix.append({
                      "system": system,
                      "target": target,
                      "os": data["os"]
                  })

          matrix_json = json.dumps({"include": filtered_matrix})
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix_json}\n")
          PYEOF

      - name: Verify Android config consistency
        run: python3 ./.github/scripts/verify-android-config.py

      - name: Verify Android upgrade guardrails
        run: python3 ./.github/scripts/verify-android-upgrade-guardrails.py

      - name: Verify Android __noChroot policy
        run: python3 ./.github/scripts/verify-android-nochroot.py

      - name: Verify Android maintainability checkpoint
        run: python3 ./.github/scripts/verify-android-maintainability.py
      - name: Verify no 'tar --wildcards' in nix recipes (bsdtar no-op guard)
        run: python3 ./.github/scripts/verify-no-tar-wildcards.py
      - name: Verify iOS shell-tool wiring
        run: python3 ./.github/scripts/verify-ios-shell-tools.py
      - name: Verify Android shell-tool wiring
        run: python3 ./.github/scripts/verify-android-shell-tools.py
      - name: Verify Wayland protocol manifest
        run: python3 ./.github/scripts/verify-wayland-protocol-manifest.py
      - name: Verify Smithay coverage contract
        run: python3 ./.github/scripts/verify-smithay-coverage-contract.py
      - name: Verify Wayland runtime ownership inventory
        run: python3 ./.github/scripts/verify-wayland-runtime-ownership.py --strict --json-out ./docs/compliance/generated/wayland-runtime-ownership.json
      - name: Verify no-equivalent closure inventory
        run: python3 ./.github/scripts/verify-wayland-no-equivalent-closure.py --json-out ./docs/compliance/generated/wayland-no-equivalent-closure.json
      - name: Verify Wayland profile smoke
        run: python3 ./.github/scripts/verify-wayland-profile-smoke.py
      - name: Verify Linux machine-profile parity
        run: python3 ./.github/scripts/verify-linux-machines-parity.py
      - name: Verify Linux bundled client parity
        run: python3 ./.github/scripts/verify-linux-bundled-clients.py
      - name: Verify Linux shell-tool wiring
        run: python3 ./.github/scripts/verify-linux-shell-tools.py
      - name: Verify waypipe remote-sway env fallback (issue #54 guard)
        run: python3 ./.github/scripts/verify-waypipe-remote-sway-env.py
      - name: Verify nixpkgs lineage (issue #47 guard)
        run: python3 ./.github/scripts/verify-nixpkgs-lineage.py
      - name: Upload Wayland ownership inventory artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wayland-runtime-ownership-${{ github.job }}
          path: docs/compliance/generated/wayland-runtime-ownership.json
      - name: Upload no-equivalent closure artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wayland-no-equivalent-closure-${{ github.job }}
          path: docs/compliance/generated/wayland-no-equivalent-closure.json

      - name: Pre-validate Flake
        run: ./.github/scripts/nix-retry.sh nix flake check --print-build-logs

  cargo-test-linux:
    name: "Linux (x86_64): cargo test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix (for ensure-waypipe.sh; GitLab blocks anonymous cargo git fetch)
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Ensure Cargo path dependencies
        run: |
          ./scripts/ensure-waypipe.sh
          ./scripts/ensure-coreutils.sh

      - name: Run Rust tests
        run: nix develop -c cargo test --lib --tests --locked

      - name: Protocol status manifest is up to date
        run: |
          WWN_WRITE_PROTOCOL_STATUS=1 nix develop -c cargo test --lib \
            tests::protocol_matrix::test_generate_protocol_status_manifest \
            -- --exact --nocapture
          git diff --exit-code -- docs/protocol-status.md \
            || { echo "::error::docs/protocol-status.md is stale; run scripts/gen-protocol-status.sh"; exit 1; }

      - name: Build Linux GTK UI (linux-ui feature)
        run: nix develop -c cargo build --bin wawona-linux-ui --features linux-ui --locked

      - name: Run Linux UI unit tests
        run: nix develop -c cargo test --features linux-ui --locked

  cargo-test-macos-arm64:
    name: "macOS (arm64): cargo test"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Active Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found on this runner"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Ensure Cargo path dependencies
        run: |
          ./scripts/ensure-waypipe.sh
          ./scripts/ensure-coreutils.sh
      - name: Run Rust tests (native aarch64-darwin)
        run: nix develop -c cargo test --lib --tests --locked

  swift-test-macos-x86_64:
    name: "macOS (x86_64): swift test"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Active Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found on this runner"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Run Swift tests
        run: |
          swift build --product WawonaPackageTests
          swift test --skip-build --filter WawonaUIContractsTests
          swift test --skip-build --filter WawonaModelSettingsTests

  build:
    name: "${{ matrix.system }}: ${{ matrix.target }}"
    runs-on: ${{ matrix.os }}
    needs: [prepare-matrix]
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim Disk Space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          docker image prune -af || true
          df -h

      - name: Select Active Xcode
        if: runner.os == 'macOS'
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found on this runner"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            build-dir = /nix/build
            sandbox = relaxed
            allow-import-from-derivation = true

      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Build Target
        run: ./.github/scripts/nix-retry.sh nix build ".#packages.${{ matrix.system }}.${{ matrix.target }}" --print-build-logs

      - name: AppImage smoke (type-2 magic + non-FUSE extract)
        if: ${{ matrix.target == 'wawona-appimage' }}
        run: ./.github/scripts/appimage-smoke.sh result "${{ matrix.system }}"

      - name: Upload AppImage artifact
        if: ${{ matrix.target == 'wawona-appimage' }}
        uses: actions/upload-artifact@v4
        with:
          name: wawona-appimage-${{ matrix.system }}
          path: dist/*.AppImage
          if-no-files-found: error

  frontend-syntax-check:
    name: "macOS: Fast Path Frontend Check"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      
      - name: Select Active Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found on this runner"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
            
      - uses: DeterminateSystems/flakehub-cache-action@v3
            
      - name: Generate Xcode Project
        run: nix run .#xcodegen
        
      - name: Syntax Check Apple Platforms
        run: |
          export WAWONA_SKIP_NIX_PREBUILD=1
          
          check_target() {
            local scheme=$1
            local dest=$2
            echo "::group::Syntax Check: $scheme"
            echo "Checking $scheme ($dest)..."
            
            # Run analyze, but ignore linker errors since we skipped Nix prebuild
            set +e
            xcodebuild clean build -project Wawona.xcodeproj -scheme "$scheme" -destination "$dest" > build.log 2>&1
            local exit_code=$?
            set -e
            
            if [ $exit_code -ne 0 ]; then
              if grep -q "error:" build.log; then
                # If there is an error that is NOT a missing Nix dependency, fail!
                if grep -v "libwawona" build.log | grep -v "linker command failed" | grep -v "clang: error: no such file or directory" | grep -q "error:"; then
                  echo "::error::Swift/ObjC Syntax error detected in $scheme!"
                  cat build.log
                  exit 1
                fi
              fi
              echo "$scheme successfully passed frontend syntax check (backend linker errors safely ignored)."
            else
              echo "$scheme unexpectedly linked successfully without the Rust backend!"
            fi
            echo "::endgroup::"
          }
          
          check_target "Wawona-tvOS" "generic/platform=tvOS"
          check_target "Wawona-watchOS" "generic/platform=watchOS"
          check_target "Wawona-visionOS" "generic/platform=visionOS"
          check_target "Wawona-iOS" "generic/platform=iOS Simulator"
