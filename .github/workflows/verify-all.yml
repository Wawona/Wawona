name: Verification

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [development, master]
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tip:
    name: Tip gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      is_tip: ${{ steps.tip.outputs.is_tip }}
      reason: ${{ steps.tip.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: tip
        env:
          WAWONA_CI_FORCE_TIP: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: bash .github/scripts/ci-require-branch-tip.sh

  formal:
    name: Rust floor
    needs: tip
    if: needs.tip.outputs.is_tip == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix-flakehub
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/ensure-waypipe.sh; ./scripts/ensure-coreutils.sh
      - run: cargo install cargo-deny --locked
      # Prebuilt release under ~/.kani (same layout as `cargo kani setup`).
      # kani-driver has no setup subcommand; see scripts/install-kani-release.sh.
      - name: Install Kani 0.68.0 (release tarball)
        run: bash scripts/install-kani-release.sh 0.68.0
      - name: Kani helpers-check harnesses
        run: |
          set -euo pipefail
          cargo kani --manifest-path verification/helpers-check/Cargo.toml \
            --harness clamped_rect_stays_inside_nonnegative_bounds \
            --harness sanitize_ascii_has_no_shell_metacharacters \
            --output-format terse
      - name: Install pinned Verus
        run: |
          rustup toolchain install 1.98.1-x86_64-unknown-linux-gnu --profile minimal
          curl --fail --location --output /tmp/verus.zip \
            https://github.com/verus-lang/verus/releases/download/release%2F0.2026.09.27.3cf1832/verus-0.2026.09.27.3cf1832-x86-linux.zip
          echo "43814031e10df043221d83c7fa842e3ebd662cb7b0090fc1eb4d7a8673226978  /tmp/verus.zip" | sha256sum --check --strict
          unzip -q /tmp/verus.zip -d "$RUNNER_TEMP/verus"
          echo "VERUS_BIN=$RUNNER_TEMP/verus/verus-x86-linux/verus" >> "$GITHUB_ENV"
      - name: Install Miri nightly
        run: rustup toolchain install nightly-2026-09-29 --profile minimal --component miri
      - name: Formal scripts
        run: bash scripts/verify-formal.sh verification-out/formal.ndjson
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndjson-formal
          path: verification-out/formal.ndjson

  heavy:
    name: Rust heavy
    needs: tip
    if: needs.tip.outputs.is_tip == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Heavy scripts and ASan fuzz
        run: bash scripts/verify-heavy.sh verification-out/heavy.ndjson
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndjson-heavy
          path: verification-out/heavy.ndjson

  c-owned:
    name: C helpers
    needs: tip
    if: needs.tip.outputs.is_tip == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install C analyzers
        run: |
          set -euo pipefail
          sudo apt-get update
          # frama-c is not in Ubuntu 24.04 apt; verify-c records a missing-tool finding.
          sudo apt-get install -y clang-tidy clang-tools valgrind || true
          sudo apt-get install -y cbmc || true
      - run: bash scripts/verify-c.sh verification-out/c.ndjson
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndjson-c
          path: verification-out/c.ndjson

  swift:
    name: Swift differential
    needs: tip
    if: needs.tip.outputs.is_tip == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/verify-swift.sh verification-out/swift.ndjson
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndjson-swift
          path: verification-out/swift.ndjson

  kotlin:
    name: Kotlin differential
    needs: tip
    if: needs.tip.outputs.is_tip == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # MainActivity Compose terminal face lives in Wawona/Terminal (not this repo).
      - uses: actions/checkout@v5
        with:
          repository: Wawona/Terminal
          ref: development
          path: Terminal
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Full app native link needs Nix deps. This floor is JVM + detekt + lint.
      # Use the runner image SDK (android-actions/setup-android fails on
      # sdkmanager "tools" with cmdline-tools 16).
      - name: Configure Android SDK from the runner image
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties
          SM=""
          for cand in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager"; do
            if [[ -x "$cand" ]]; then SM="$cand"; break; fi
          done
          test -n "$SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-36" "build-tools;36.1.0"
      - run: bash scripts/verify-kotlin.sh verification-out/kotlin.ndjson
        env:
          WAWONA_VERIFICATION_KOTLIN: "1"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndjson-kotlin
          path: verification-out/kotlin.ndjson

  nix:
    name: Nix floor
    needs: tip
    if: needs.tip.outputs.is_tip == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Parse / format floor. FlakeHub Cache not required here.
          determinate: false
      - run: bash scripts/verify-nix.sh verification-out/nix.ndjson
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndjson-nix
          path: verification-out/nix.ndjson

  report:
    name: Verification report
    if: always() && !cancelled()
    needs: [tip, formal, heavy, c-owned, swift, kotlin, nix]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Superseded tip
        if: needs.tip.outputs.is_tip != 'true'
        run: |
          echo "::notice::Verification superseded (${{ needs.tip.outputs.reason }}). Not a proof failure."
          {
            echo "### Verification report"
            echo "- result: superseded"
            echo "- reason: \`${{ needs.tip.outputs.reason }}\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5
        if: needs.tip.outputs.is_tip == 'true'
      - uses: actions/download-artifact@v4
        if: needs.tip.outputs.is_tip == 'true'
        with:
          pattern: ndjson-*
          merge-multiple: true
          path: verification-out
      - name: Write the report
        if: needs.tip.outputs.is_tip == 'true'
        run: python3 scripts/verification-report.py summarize verification-out --markdown verification-out/verification-report.md
      - name: Fail closed when a needed job failed
        if: needs.tip.outputs.is_tip == 'true'
        run: |
          python3 - <<'PY'
          import os, sys
          need = os.environ["NEEDS"]
          bad = [part for part in need.split() if part.endswith(":failure") or part.endswith(":cancelled")]
          if bad:
              print("failed jobs:", " ".join(bad))
              sys.exit(1)
          PY
        env:
          NEEDS: "formal:${{ needs.formal.result }} heavy:${{ needs.heavy.result }} c:${{ needs.c-owned.result }} swift:${{ needs.swift.result }} kotlin:${{ needs.kotlin.result }} nix:${{ needs.nix.result }}"
      - if: always() && needs.tip.outputs.is_tip == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification-out
