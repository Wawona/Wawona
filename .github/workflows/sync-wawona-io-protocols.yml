# When protocol-status.md lands on Wawona master, tell wawona.io to resync
# /docs/contributor/protocols/ from this channel.
name: Notify wawona.io protocol sync

on:
  push:
    branches: [master]
    paths:
      - "docs/protocol-status.md"
      - "src/core/wayland/catalog.rs"
      - "src/tests/protocol_matrix.rs"
      - "scripts/gen-protocol-status.sh"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: repository_dispatch wawona.io
        env:
          # Prefer a PAT with contents:write on Wawona/wawona.io. Fall back is a
          # no-op warning so master pushes never fail closed on site sync.
          TOKEN: ${{ secrets.WAWONA_IO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::WAWONA_IO_DISPATCH_TOKEN unset; wawona.io schedule sync will catch up"
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Wawona/wawona.io/dispatches \
            -d '{"event_type":"wawona-protocol-status-updated","client_payload":{"ref":"master"}}'
          echo "Dispatched wawona-protocol-status-updated to Wawona/wawona.io"
