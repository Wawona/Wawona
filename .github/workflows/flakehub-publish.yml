name: FlakeHub publish

# Public rolling FlakeHub *releases* (registry), not the binary cache.
# Cache stays on flakehub-cache-action in build jobs.
# Docs: https://docs.determinate.systems/flakehub/publishing/

on:
  push:
    branches: [development]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  flakehub-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-push@main
        with:
          name: Wawona/Wawona
          rolling: true
          visibility: public
          include-output-paths: true
