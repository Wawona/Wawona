name: "Test: Android opens"

# Gate: products Android runtime. adb + Espresso/uiautomator.
# No agent-device CLI on runners.

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        type: string
        required: false
        default: ""
      products_ready:
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: false
        default: ""
      tip_key:
        type: string
        required: false
        default: ""
      products_ready:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: device-e2e-android-${{ github.sha }}-${{ inputs.products_ready && 'products' || 'standalone' }}
  cancel-in-progress: false

jobs:
  android-apk:
    name: "Android: Wawona.apk"
    if: ${{ !inputs.products_ready }}
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: ./.github/actions/setup-nix-flakehub

      - name: Build Wawona.apk
        run: ./.github/scripts/nix-retry.sh nix build ".#wawona-android" --print-build-logs --out-link result-android

      - name: Stage APK
        run: |
          mkdir -p dist
          cp -L result-android/bin/Wawona.apk dist/Wawona.apk
          ls -lh dist/Wawona.apk

      - name: Upload product-android-apk
        uses: actions/upload-artifact@v7
        with:
          name: product-android-apk
          path: dist/Wawona.apk
          if-no-files-found: error
          compression-level: 0

  android-emu-e2e:
    name: "Android emulator: adb runtime smoke"
    needs: android-apk
    if: ${{ !cancelled() && (inputs.products_ready || needs.android-apk.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download product-android-apk
        uses: actions/download-artifact@v8
        with:
          name: product-android-apk
          path: dist/

      - name: Normalize APK path
        run: |
          if [[ ! -f dist/Wawona.apk ]]; then
            found="$(find dist -name 'Wawona.apk' -type f | head -1)"
            [[ -n "$found" ]] || { echo "Wawona.apk missing in product-android-apk"; exit 1; }
            cp -L "$found" dist/Wawona.apk
          fi
          ls -lh dist/Wawona.apk

      - name: Android runtime smoke (adb)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: >-
            adb shell settings put secure immersive_mode_confirmations confirmed
            && export WAWONA_ANDROID_APK="$GITHUB_WORKSPACE/dist/Wawona.apk"
            && chmod +x ./scripts/ci-android-espresso-smoke.sh
            && ./scripts/ci-android-espresso-smoke.sh

      - name: Upload Android runtime artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-e2e-android
          path: .agent-device/test-artifacts/ci-android-runtime/
          if-no-files-found: warn
