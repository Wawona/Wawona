name: "Build: Android APK"

# Thin product producer (one platform slice). Called by Gate: products / Ship.
# No `only` filter: every job here always runs. Keeps Actions UI free of skip spam.

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = this SHA)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = caller sha)"
        type: string
        required: false
        default: ""
      tip_key:
        description: "Unused; kept for caller compatibility"
        type: string
        required: false
        default: ""

concurrency:
  group: product-android-apk-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android-apk:
    name: "Android debug APK"
    # The backend links with the NDK's darwin-x86_64 LLVM, which the
    # prebuilt android slice was built against.
    runs-on: macos-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: ./.github/actions/setup-xtask
        with:
          key: android
          android: true

      - name: Build the debug APK
        run: cargo xtask build android

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Wawona.apk
          printf '{"target":"android","sha":"%s","artifact":"product-android-apk"}\n' "${{ github.sha }}" \
            > dist/product-manifest.json

      - name: Verify Play-safe Android graphics bundle
        run: |
          rm -rf dist/apk-unpacked
          mkdir -p dist/apk-unpacked
          unzip -q dist/Wawona.apk -d dist/apk-unpacked
          ./.github/scripts/verify-iland-graphics-bundle.sh --platform android dist/apk-unpacked

      - uses: actions/upload-artifact@v7
        with:
          name: product-android-apk
          path: |
            dist/Wawona.apk
            dist/product-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

