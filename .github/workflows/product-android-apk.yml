name: "Build: Android APK"

# Thin product producer (one platform slice). Called by Gate: products / Ship.
# No `only` filter: every job here always runs. Keeps Actions UI free of skip spam.

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = this SHA)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = caller sha)"
        type: string
        required: false
        default: ""
      tip_key:
        description: "Unused; kept for caller compatibility"
        type: string
        required: false
        default: ""

concurrency:
  group: product-android-apk-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  NIXPKGS_ALLOW_UNFREE: "1"

jobs:
  android-apk:
    name: "Android debug APK"
    # macOS (not ubuntu): Android cross deps (e.g. zsh-android) fail configure on
    # linux; runner OS version is irrelevant (Nix supplies NDK). Aligned to
    # macos-26 with the Apple product jobs.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: ./.github/actions/setup-nix-flakehub

      - name: Build wawona-android
        run: ./.github/scripts/nix-retry.sh nix build ".#wawona-android" --print-build-logs --out-link result-android

      - name: Stage APK
        run: |
          mkdir -p dist
          cp -L result-android/bin/Wawona.apk dist/Wawona.apk
          OUT="$(readlink -f result-android)"
          {
            echo "{"
            echo "  \"attr\": \"wawona-android\","
            echo "  \"sha\": \"${{ github.sha }}\","
            echo "  \"outPath\": \"$OUT\","
            echo "  \"artifact\": \"product-android-apk\""
            echo "}"
          } > dist/product-manifest.json
          ls -lh dist/Wawona.apk

      - name: Verify Play-safe Android graphics bundle
        run: |
          rm -rf dist/apk-unpacked
          mkdir -p dist/apk-unpacked
          unzip -q dist/Wawona.apk -d dist/apk-unpacked
          ./.github/scripts/verify-iland-graphics-bundle.sh --platform android dist/apk-unpacked

      - uses: actions/upload-artifact@v7
        with:
          name: product-android-apk
          path: |
            dist/Wawona.apk
            dist/product-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

