name: "Build: iOS Mode B"

# Thin product producer (one platform slice). Called by Gate: products / Ship.
# No `only` filter: every job here always runs. Keeps Actions UI free of skip spam.

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = this SHA)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = caller sha)"
        type: string
        required: false
        default: ""
      tip_key:
        description: "Unused; kept for caller compatibility"
        type: string
        required: false
        default: ""

concurrency:
  group: product-ios-modeb-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios-modeb:
    name: "iOS Mode B channel artifacts"
    runs-on: macos-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: ./.github/actions/setup-xtask
        with:
          key: ios-modeb

      # ldid signs the Mode B binaries; dpkg checks the debs xtask writes.
      - name: Install ldid and dpkg
        run: brew install ldid dpkg

      - name: Build TrollStore iOS 14+ and Sileo iOS 13+ products
        run: cargo xtask package ios-mode-b

      - name: Verify channel floors and stage artifacts
        run: |
          mkdir -p dist/ios-modeb
          cp dist/*.tipa dist/*-rootless.deb dist/ios-modeb/
          cargo xtask artifact ios mode-b dist/ios-modeb/*.tipa
          dpkg-deb -f dist/ios-modeb/*.deb Depends | grep -Fx 'firmware (>= 13.0)'
          printf '{"tipa_min_ios":"14.0","sileo_min_ios":"13.0","sha":"%s"}\n' "${{ github.sha }}" \
            > dist/ios-modeb/product-manifest.json

      - uses: actions/upload-artifact@v7
        with:
          name: product-ios-modeb
          path: dist/ios-modeb/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
