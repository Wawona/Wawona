name: "Build: iOS Mode B"

# Thin product producer (one platform slice). Called by Gate: products / Ship.
# No `only` filter: every job here always runs. Keeps Actions UI free of skip spam.

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = this SHA)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to build (empty = caller sha)"
        type: string
        required: false
        default: ""
      tip_key:
        description: "Unused; kept for caller compatibility"
        type: string
        required: false
        default: ""

concurrency:
  group: product-ios-modeb-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  NIXPKGS_ALLOW_UNFREE: "1"

jobs:
  ios-modeb:
    name: "iOS Mode B channel artifacts"
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - uses: ./.github/actions/setup-nix-flakehub

      - name: Build TrollStore iOS 14+ and Sileo iOS 13+ products
        run: |
          ./.github/scripts/nix-retry.sh nix build ".#wawona-ios-modeb-tipa-slim" --print-build-logs --out-link result-tipa
          ./.github/scripts/nix-retry.sh nix build ".#wawona-ios-modeb-deb-rootless-slim" --print-build-logs --out-link result-sileo

      - name: Verify channel floors and stage artifacts
        run: |
          mkdir -p dist/ios-modeb
          cp -L result-tipa/*.tipa dist/ios-modeb/
          cp -L result-sileo/*.deb dist/ios-modeb/
          bash ./.github/scripts/verify-ios-modeb-artifacts.sh --mode-b dist/ios-modeb/*.tipa
          dpkg-deb -f dist/ios-modeb/*.deb Depends | grep -Fx 'firmware (>= 13.0)'
          printf '{"tipa_min_ios":"14.0","sileo_min_ios":"13.0","sha":"%s"}\n' "${{ github.sha }}" \
            > dist/ios-modeb/product-manifest.json

      - uses: actions/upload-artifact@v7
        with:
          name: product-ios-modeb
          path: dist/ios-modeb/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

