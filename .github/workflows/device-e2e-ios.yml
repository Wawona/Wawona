name: "Test: iOS opens"

# Gate: products iOS runtime. Apple simctl (+ optional XCUITest).
# No agent-device CLI on runners.

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        type: string
        required: false
        default: ""
      products_ready:
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: false
        default: ""
      tip_key:
        type: string
        required: false
        default: ""
      products_ready:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: device-e2e-ios-${{ github.sha }}-${{ inputs.products_ready && 'products' || 'standalone' }}
  cancel-in-progress: false

jobs:
  ios-sim-e2e:
    name: "iOS simulator: simctl runtime smoke"
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Select Xcode
        id: xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Install Nix
        if: ${{ !inputs.products_ready }}
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: true
          extra-conf: |
            sandbox = relaxed
            allow-import-from-derivation = true
      - uses: DeterminateSystems/flakehub-cache-action@v3
        if: ${{ !inputs.products_ready }}

      - name: Ensure iOS Simulator SDK before nix build
        if: ${{ !inputs.products_ready }}
        run: ./.github/scripts/warm-ios-simulator-sdk.sh ios

      - name: Build Wawona.app (iOS simulator slice)
        if: ${{ !inputs.products_ready }}
        run: ./.github/scripts/nix-retry.sh nix build ".#wawona-ios" --print-build-logs --out-link result-ios

      - name: Download product-ios-sim
        if: ${{ inputs.products_ready }}
        uses: actions/download-artifact@v8
        with:
          name: product-ios-sim
          path: product-ios-sim/

      - name: Stage iOS app from product artifact
        if: ${{ inputs.products_ready }}
        run: |
          mkdir -p result-ios
          if [[ -d product-ios-sim/Wawona.app ]]; then
            cp -R product-ios-sim/Wawona.app result-ios/
          else
            find product-ios-sim -name 'Wawona.app' -type d | head -1 | while read -r p; do
              cp -R "$p" result-ios/
            done
          fi
          test -d result-ios/Wawona.app

      - name: Ensure simulator device exists
        run: |
          SIM_NAME="${WAWONA_IOS_SIM:-iPhone 17 Pro}"
          if ! xcrun simctl list devices available | grep -q "$SIM_NAME ("; then
            DEVTYPE=$(xcrun simctl list devicetypes | grep -F "$SIM_NAME (" | sed -E 's/.*\((com[^)]*)\).*/\1/' | head -1)
            RUNTIME=$(xcrun simctl list runtimes | grep -E "^iOS" | tail -1 | sed -E 's/.*(com\.apple\.CoreSimulator\.SimRuntime\.[A-Za-z0-9._-]+).*/\1/')
            xcrun simctl create "$SIM_NAME" "$DEVTYPE" "$RUNTIME"
          fi

      - name: iOS runtime smoke (simctl)
        env:
          WAWONA_IOS_APP: result-ios/Wawona.app
        run: |
          chmod +x ./scripts/ci-ios-xcuitest-smoke.sh
          ./scripts/ci-ios-xcuitest-smoke.sh

      - name: Upload iOS runtime artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-e2e-ios
          path: .agent-device/test-artifacts/ci-ios-runtime/
          if-no-files-found: warn
