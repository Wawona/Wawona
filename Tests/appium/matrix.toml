# Capability matrix for Appium UI tests.
# Mirrors PlatformCapabilities / wawona-platform-targets.
# States: available | planned | blocked | forbidden
# CI verifies this file via scripts/appium/verify-matrix.py
#
# Catalog clients are REAL Wayland guests. They launch via
# scripts/appium/launch-wayland-client.sh into the host Wawona socket:
#   guest=colima     → Colima Linux + waypipe SSH (required on Darwin)
#   guest=nested     → same-host nested client (Linux CI only)
# guest=container / local-bundle are forbidden for catalog proof.
# Catalog cards in repo.wawona.io are packaging, not a substitute for a guest.

[platforms.ios]
vm = "planned"
container = "planned"
multi_window = "fill_primary"
toolbar_keys = "available"
device_rotation = "available"
gpu_driver_picker = "available"
ssh = "available"
waypipe = "available"
wasm = "available"
native_shell = "available"
watch_import_send = "available"

[platforms.ipados]
vm = "planned"
container = "planned"
multi_window = "multi_scene"
toolbar_keys = "available"
device_rotation = "available"
gpu_driver_picker = "available"
ssh = "available"
waypipe = "available"
wasm = "available"
native_shell = "available"
watch_import_send = "available"

[platforms.tvos]
vm = "forbidden"
container = "forbidden"
multi_window = "fill_primary"
