[pytest]
testpaths = tests
# Mac2 WebDriverAgentMac often needs >180s under xcodebuild contention.
timeout = 600
markers =
    native: native Wawona host UI
    wayland: Wayland session / keep-set clients
    catalog: Linux optional catalog compositor or app
    apple: Apple simulator / Mac2
    android: Android emulator
    linux: Linux AT-SPI desktop
    watch_pair: iPhone + paired Watch simulator
addopts = -ra --tb=short
