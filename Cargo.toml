members = ["."]

[package]
name = "wawona"
version = "26.8.23"
edition = "2021"

[lints.rust]

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]




[dependencies]
thiserror = "2.0.17"
anyhow = "1.0.100"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["chrono", "local-time"] }
bitflags = "2.4"
chrono = "0.4"
libc = "0.2.180"
ssh2 = { version = "0.9", default-features = false, optional = true }
ash = "0.38"
libloading = "0.8"
getrandom = "0.2"
nix = "0.30"
memoffset = "0.9"
clap = { version = "4", features = ["color", "derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glib = { version = "0.20", optional = true }
gtk4 = { version = "0.9", optional = true }
cairo-rs = { version = "0.20", optional = true }
libadwaita = { version = "0.7", optional = true }

# No "cli" feature: it pulls uniffi_bindgen (+clap/camino/askama/goblin/…) into
# the graph. crate2nix then builds uniffi_bindgen with feature sets that diverge
# from the rest of the uniffi family, producing mismatched crate SVHs that fail
# with E0460/E0463 ("can't find crate for uniffi"). The scaffolding + derives we
# use come from uniffi_macros (default features); the uniffi-bindgen CLI binary
# is not built here, so cli is unnecessary.
uniffi = { version = "0.30.0" }

# Core Wayland
wayland-server = "0.31.13"
wayland-client = "0.31.14"
wayland-backend = "0.3.15"
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend"] }

# Protocol bindings (pre-generated, no custom generator needed)
wayland-protocols = { version = "0.32.13", features = ["server", "client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["server", "client"] }
wayland-protocols-misc = { version = "0.3.12", features = ["server", "client"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["server", "client"] }
wayland-protocols-hyprland = { version = "1.2.0", features = ["server", "client"] }
wayland-wf-shell = "0.1.0"

# XKB for keymap generation (FFI to libxkbcommon, already ported to macOS)
xkbcommon = { version = "0.8", features = ["wayland"] }


# Code generation for custom protocols only
wayland-scanner = "0.31.8"
tempfile = "3.25.0"

# waypipe: integrated as optional dependency for unified static library (run scripts/ensure-waypipe.sh if ./waypipe is missing)
waypipe = { path = "./waypipe", optional = true, default-features = false, features = ["lz4", "zstd", "video"] }

# uutils coreutils umbrella: in-process ls/cat/cp/... dispatched from zsh on the
# App-Store-compliant build (no fork/exec). Run scripts/ensure-coreutils.sh if
# ./coreutils is missing. default-features = false + an explicit safe subset
# keeps binary size bounded (see the in-process safe subset in the dispatch
# shim). exit-prone / sandbox-meaningless utils are deliberately excluded.
coreutils = { path = "./coreutils", optional = true, default-features = false, features = [
  "ls", "cat", "cp", "mv", "rm", "mkdir", "rmdir", "ln", "touch", "echo",
  "pwd", "head", "tail", "wc", "sort", "cut", "tr", "seq", "basename",
  "dirname", "stat", "du", "df", "date", "env", "printenv", "uname",
  "whoami", "yes", "tee", "nl", "tac", "fold", "expand", "unexpand",
  "truncate",
] }

[build-dependencies]
# UniFFI scaffolding is generated in-crate via uniffi::setup_scaffolding! (see
# src/lib.rs), so there is intentionally NO uniffi_build here. Depending on
# uniffi_build pulls uniffi_bindgen into the build-dependency graph with a
# different feature set than the `uniffi` (cli) normal dependency; crate2nix
# then builds two mismatched uniffi_bindgen rlibs and rustc fails with E0460.
wayland-scanner = "0.31.8"



[features]
default = ["desktop-protocols"]
# Desktop-only Wayland protocols (DRM, XWayland, screen capture, session lock).
# Disable for App Store builds: `--no-default-features`
desktop-protocols = ["smithay-desktop"]
# iOS/iPadOS Mode B (TrollStore / Sileo): JIT + IOMobileFramebuffer Desktop.
# Never enable on App Store / TestFlight schemes. CI greps store IPA for absence.
mode-b-ios = []
# Runtime policy baseline (choose at build time; env override available)
profile-store-safe = []
profile-store-safe-remote = []
profile-desktop-host = []
profile-full-dev = []
# Enables Smithay protocol migration scaffolding / compile probes.
smithay-protocols = []
smithay-desktop = []
# iland bare-metal WindowServer-replacement mode (Mode B): Dobby code injection,
# AMFI bypass, framebufferd/SkyLight, inputd, symrez. macOS-ONLY, opt-in, and
# NOT App-Store-safe (requires SIP off + root + private entitlements). Must be
# combined with profile-desktop-host or profile-full-dev; never enabled for
# mobile or store-safe builds. Default builds use iland Mode A (in-window,
# IOSurface + ANGLE, App-Store-safe) only.
iland-baremetal = []
# Per-frame trace logging (SurfaceCommit, buffer, damage, frame callbacks).
# Enable for debugging: `--features verbose-logs`
verbose-logs = []
linux-ui = ["dep:glib", "dep:gtk4", "dep:cairo-rs", "dep:libadwaita"]

# Enable in-process waypipe integration
waypipe = ["dep:waypipe"]
# Enable waypipe with static libssh2 transport (iOS/Android: no subprocess spawning)
waypipe-ssh = ["waypipe", "dep:ssh2"]

# Enable in-process uutils coreutils (ls/cat/cp/...) linked into the staticlib.
coreutils = ["dep:coreutils"]

[[bin]]
name = "wawona-linux-ui"
path = "src/bin/wawona-linux-ui.rs"
required-features = ["linux-ui"]

[[bin]]
name = "wawona-linux-compositor-host"
path = "src/bin/wawona-linux-compositor-host.rs"
required-features = ["linux-ui"]

[[bin]]
name = "wawona-linux-tray"
path = "src/bin/wawona-linux-tray.rs"
required-features = ["linux-ui"]

# Build-perf profiles (p21). panic stays "unwind": the FFI boundary relies on
# std::panic::catch_unwind for poison recovery, so panic=abort is unsafe here.
[profile.release]
lto = "thin"           # cross-crate inlining without full-LTO link blowup
strip = "debuginfo"    # smaller dylib/staticlib shipped into app bundles
opt-level = 3

[profile.dev]
opt-level = 1          # smithay/wayland hot paths are painfully slow at opt-level 0
split-debuginfo = "unpacked"  # faster incremental links on macOS (dSYM churn)

[profile.dev.package."*"]
opt-level = 2          # optimize deps once; keeps our crate fast to iterate
