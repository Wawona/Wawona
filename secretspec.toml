# Wawona release secret *names* only (public repo).
# Values live in the private pass store:
#   https://github.com/aspauldingcode/.password-store
#   secretspec/wawona/release-apple/<KEY>
#   secretspec/wawona/release-android/<KEY>
#
# Tier-0 ops: docs/maintainers/secrets.md

[project]
name = "wawona"
revision = "1.0"
require_reason = false

[providers]
pass_apple = "pass://secretspec/wawona/release-apple/{key}"
pass_android = "pass://secretspec/wawona/release-android/{key}"
env = "env://"

# Local / sync: pass (GPG). CI: env (GitHub Environment secrets).
[profiles.local.defaults]
providers = ["pass_apple", "pass_android"]

[profiles.local]
APPLE_ID = { description = "Apple ID email for Developer portal / produce" }
TEAM_ID = { description = "Apple Developer Team ID" }
MATCH_PASSWORD = { description = "Passphrase encrypting aspauldingcode/apple-signing (match)" }
APPLE_SIGNING_PAT = { description = "Fine-grained PAT with Contents:Read on apple-signing" }
ASC_KEY_ID = { description = "App Store Connect API Key ID" }
ASC_ISSUER_ID = { description = "App Store Connect API Issuer UUID" }
ASC_P8 = { description = "App Store Connect API .p8 PEM (multiline)" }
ANDROID_KEYSTORE_BASE64 = { description = "Upload keystore PKCS12 as base64", providers = ["pass_android"] }
ANDROID_KEYSTORE_PASSWORD = { description = "Upload keystore password", providers = ["pass_android"] }
ANDROID_KEY_ALIAS = { description = "Upload key alias", providers = ["pass_android"] }
ANDROID_KEY_PASSWORD = { description = "Upload key password", providers = ["pass_android"] }
PLAY_STORE_JSON_KEY = { description = "Play Console service-account JSON", providers = ["pass_android"] }

[profiles.sync]
# Same declarations as local — used by scripts/sync-github-secrets.sh
APPLE_ID = { description = "Apple ID email", providers = ["pass_apple"] }
TEAM_ID = { description = "Apple Developer Team ID", providers = ["pass_apple"] }
MATCH_PASSWORD = { description = "match repo passphrase", providers = ["pass_apple"] }
APPLE_SIGNING_PAT = { description = "PAT for apple-signing clone", providers = ["pass_apple"] }
ASC_KEY_ID = { description = "ASC Key ID", providers = ["pass_apple"] }
ASC_ISSUER_ID = { description = "ASC Issuer ID", providers = ["pass_apple"] }
ASC_P8 = { description = "ASC .p8 PEM", providers = ["pass_apple"] }
ANDROID_KEYSTORE_BASE64 = { description = "Upload keystore base64", providers = ["pass_android"] }
ANDROID_KEYSTORE_PASSWORD = { description = "Upload keystore password", providers = ["pass_android"] }
ANDROID_KEY_ALIAS = { description = "Upload key alias", providers = ["pass_android"] }
ANDROID_KEY_PASSWORD = { description = "Upload key password", providers = ["pass_android"] }
PLAY_STORE_JSON_KEY = { description = "Play service-account JSON", providers = ["pass_android"] }

[profiles.ci.defaults]
providers = ["env"]

[profiles.ci]
# Names match GitHub Environment `release-beta` secrets / derived env.
MATCH_PASSWORD = { description = "match passphrase" }
MATCH_GIT_BASIC_AUTHORIZATION = { description = "base64 x-access-token:PAT for match git" }
APP_STORE_CONNECT_API_KEY = { description = "ASC .p8 base64" }
APP_STORE_CONNECT_KEY_ID = { description = "ASC Key ID" }
APP_STORE_CONNECT_ISSUER_ID = { description = "ASC Issuer ID" }
APPLE_ID = { description = "Apple ID" }
TEAM_ID = { description = "Team ID" }
ANDROID_KEYSTORE_BASE64 = { description = "Upload keystore base64" }
ANDROID_KEYSTORE_PASSWORD = { description = "Upload keystore password" }
ANDROID_KEY_ALIAS = { description = "Upload key alias" }
ANDROID_KEY_PASSWORD = { description = "Upload key password" }
PLAY_STORE_JSON_KEY = { description = "Play JSON key" }
