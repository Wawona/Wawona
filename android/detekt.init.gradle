// detekt for scripts/verify-kotlin.sh. Applied from an init script so the
// product build never resolves it (the offline Nix mirror does not carry it).
initscript {
    repositories { gradlePluginPortal() }
    dependencies { classpath "io.gitlab.arturbosch.detekt:detekt-gradle-plugin:1.23.8" }
}

allprojects {
    if (path == ":Wawona") {
        apply plugin: io.gitlab.arturbosch.detekt.DetektPlugin
        detekt {
            buildUponDefaultConfig = true
            // Compose functions are PascalCase. The naming rule still applies to other functions.
            config.setFrom(files("detekt.yml"))
            // Existing Android UI debt. Fail only on new findings after this baseline.
            baseline = file("detekt-baseline.xml")
            parallel = true
        }
    }
}
