# Canonical Wayland protocol manifest for Wawona profile gating and Smithay coverage.
# This file is consumed by compliance checks and release review.

version = 2

[[profile]]
name = "store-safe"
description = "Default App Store / Play Store profile"

[[profile]]
name = "store-safe-remote"
description = "Store profile with remote-first workflows"

[[profile]]
name = "desktop-host"
description = "Non-store desktop distribution profile"

[[profile]]
name = "full-dev"
description = "Internal superset profile for validation"

[[protocol]]
interface = "wl_compositor"
smithay_module = "wayland::compositor"
exposure = "store-safe-core"
profiles = ["store-safe", "store-safe-remote", "desktop-host", "full-dev"]
source_module = "src/core/wayland/wayland/mod.rs"
compile_expectation = "all-targets"
equivalent = "smithay"
notes = "Includes wl_surface/wl_region lifecycle via compositor module"

[[protocol]]
interface = "wl_subcompositor"
smithay_module = "wayland::compositor"
exposure = "store-safe-core"
profiles = ["store-safe", "store-safe-remote", "desktop-host", "full-dev"]
source_module = "src/core/wayland/wayland/mod.rs"
compile_expectation = "all-targets"
equivalent = "smithay"
notes = "Subsurface helpers in compositor module"

[[protocol]]
interface = "wl_shm"
smithay_module = "wayland::shm"
