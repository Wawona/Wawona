profiles = ["store-safe", "store-safe-remote", "desktop-host", "full-dev"]
source_module = "src/core/wayland/wayland/mod.rs"
compile_expectation = "all-targets"
equivalent = "smithay"
notes = "Covers wl_shm_pool and wl_buffer import/release behavior"

